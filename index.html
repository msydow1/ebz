<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Zeiterfassung">
<meta name="theme-color" content="#15171A">
<title>Zeiterfassung</title>
<!-- Zeiterfassung V3.2.1 · Design "Amber Editorial" -->
<!-- impeccable-disable single-font -- Nutzer wählte beim V1.2-Redesign bewusst "Inter durchgängig" (eine Familie, tabular-nums für Zeiten) -->
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link href="vendor/inter.css" rel="stylesheet">
<script src="vendor/pdf.min.js"></script>
<script src="vendor/jspdf.umd.min.js"></script>
<style>
/* ===== Tokens (Handoff "Amber Editorial") ===== */
:root{--bg:#15171A;--surface:#1E2228;--surface-2:#262B31;--field:#22262C;--field-input:#34393F;--line:#2A2F35;--line-strong:#3A4048;--text:#E8E8E8;--text-strong:#FFFFFF;--muted:#8A9099;--silver:#C3C3C3;--faint:#6E747B;--accent:#FA7D19;--accent-soft:rgba(250,125,25,.14);--accent-line:rgba(250,125,25,.28);--accent-ink:#B8925F;--pos:#54BE86;--pos-soft:rgba(84,190,134,.14);--pos-line:rgba(84,190,134,.40);--info:#6B87A2;--info-soft:rgba(107,135,162,.14);--info-line:rgba(107,135,162,.32);--danger:#E0705C;--on-accent:#15171A;--glow:0 8px 24px rgba(250,125,25,.30);--cardshadow:none}
body.light{--bg:#F5F4F1;--surface:#FFFFFF;--surface-2:#EFEDE8;--field:#E9E7E1;--field-input:#E9E7E1;--line:#DEDBD3;--line-strong:#C9C5BC;--text:#28251F;--text-strong:#141210;--muted:#7A756C;--silver:#545048;--faint:#9B968C;--accent:#E86F0C;--accent-soft:rgba(232,111,12,.12);--accent-line:rgba(232,111,12,.30);--accent-ink:#B07A3C;--pos:#1E9E60;--pos-soft:rgba(30,158,96,.12);--pos-line:rgba(30,158,96,.45);--info:#49688C;--info-soft:rgba(73,104,140,.10);--info-line:rgba(73,104,140,.30);--danger:#C24E3B;--on-accent:#FFFFFF;--glow:0 8px 24px rgba(232,111,12,.32);--cardshadow:0 2px 14px rgba(0,0,0,.05)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;max-width:100%;overflow-x:hidden}
body{background:var(--bg);color:var(--text);font-family:"Inter",-apple-system,system-ui,sans-serif;font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
.app{max-width:560px;margin:0 auto;min-height:100vh}
/* Bar */
.bar{position:sticky;top:0;z-index:30;background:rgba(21,23,26,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:calc(env(safe-area-inset-top) + 14px) 20px 12px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;min-height:58px}
body.light .bar{background:rgba(245,244,241,.85)}
.brand{width:28px;height:28px;border-radius:8px;background:var(--accent);color:var(--on-accent);font-weight:800;font-size:15px;display:flex;align-items:center;justify-content:center;flex:none}
.eyebrow{font-size:9px;font-weight:600;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted)}
.iconbtn{width:36px;height:36px;border-radius:10px;border:none;background:transparent;color:var(--muted);display:flex;align-items:center;justify-content:center;flex:none;padding:0}
.iconbtn:active{background:var(--surface)}
.backlink{background:none;border:none;color:var(--accent);font-family:inherit;font-size:13px;font-weight:600;padding:0}
/* View */
.view{padding:22px 20px calc(env(safe-area-inset-bottom) + 44px);animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.pagehead{margin-bottom:16px}
.display{font-weight:800;font-size:32px;letter-spacing:-1px;line-height:1.05;color:var(--text-strong);margin-top:6px}
.dtitle{font-weight:800;font-size:27px;letter-spacing:-.7px;line-height:1.12;color:var(--text-strong);margin-top:6px}
/* KPI-Kacheln */
.kpis{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:0 0 14px}
.kpis.two{grid-template-columns:1fr 1fr}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:13px 12px;min-width:0}
.kpi .l{font-size:9px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted)}
.kpi .n{font-weight:800;font-size:22px;margin-top:3px;color:var(--text-strong)}
.kpi.acc{background:var(--accent-soft);border-color:var(--accent-line)}
.kpi.acc .l{color:var(--accent-ink)}
.kpi.posk{background:var(--pos-soft);border-color:var(--pos-line)}
.kpi.posk .n{color:var(--pos)}
/* Hero */
.hero{background:linear-gradient(135deg,var(--accent-soft),transparent);border:1px solid var(--accent-line);border-radius:16px;padding:22px 18px;margin-bottom:14px}
.hero .l{font-size:9px;font-weight:600;letter-spacing:1.4px;text-transform:uppercase;color:var(--accent-ink)}
.hero .n{font-weight:800;font-size:46px;letter-spacing:-1.5px;line-height:1.05;margin-top:4px;color:var(--text-strong)}
.hero.small{padding:16px 18px}
.hero.small .n{font-size:30px;letter-spacing:-1px}
.hero .hsub{font-size:12px;font-weight:500;color:var(--muted);margin-top:6px}
/* Segment-Tabs */
.segs{display:flex;background:var(--field);border-radius:12px;padding:4px;margin:0 0 18px}
.segs button{flex:1;padding:10px 0;border:none;border-radius:9px;background:transparent;color:var(--muted);font-family:inherit;font-size:13px;font-weight:700}
.segs button.on{background:var(--accent);color:var(--on-accent)}
/* Auftragskarten */
.cards{background:var(--surface);border-radius:14px;overflow:hidden;box-shadow:var(--cardshadow);margin-bottom:10px}
.cards.done{background:var(--surface-2);box-shadow:none}
.card{padding:16px;border-bottom:1px solid var(--line);cursor:pointer}
.card:last-child{border-bottom:none}
.card:active{background:var(--surface-2)}
.card .eyeline{font-size:9px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.card .toprow{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.card .titel{font-weight:700;font-size:16px;letter-spacing:-.3px;line-height:1.25;color:var(--text-strong);margin:0;min-width:0}
.card .num{font-weight:800;font-size:20px;flex:none}
.cardgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;border-top:1px solid var(--line);margin-top:12px;padding-top:12px}
.cardgrid .l{font-size:9px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted)}
.cardgrid .v{font-weight:700;font-size:15px;margin-top:2px;color:var(--text-strong)}
.cardgrid.big .v{font-size:16px}
.cardfoot{font-size:11px;font-weight:500;color:var(--faint);margin-top:12px}
.cards.done .titel{color:var(--muted)}
.cards.done .num{color:var(--faint)!important}
/* Sektionen + Zeilen */
.section-h{display:flex;align-items:baseline;justify-content:space-between;margin:24px 0 4px}
.section-h h3{font-weight:700;font-size:12px;margin:0;letter-spacing:.5px;text-transform:uppercase;color:var(--faint)}
.section-h .tot{font-size:12px;font-weight:600;color:var(--silver)}
.srow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 0;border-bottom:1px solid var(--line)}
.srow .nm{font-size:15px;font-weight:700;color:var(--text-strong);margin:0;min-width:0}
.srow .nm small{display:block;font-size:12px;font-weight:500;color:var(--faint);margin-top:2px}
.srow .v{font-weight:800;font-size:18px;flex:none}
.srow .chev{color:var(--line-strong);font-size:15px;flex:none}
.srow.dim .nm{color:var(--muted)}
.srow.dim .v{color:var(--faint)!important}
/* Tageszeilen */
.day{padding:14px 0;border-bottom:1px solid var(--line);cursor:pointer}
.day .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.day .date{font-weight:700;font-size:15px;color:var(--text-strong)}
.day .ot{font-weight:800;font-size:16px}
.dayDel{width:30px;height:30px;border-radius:8px;border:none;background:transparent;color:var(--danger);display:flex;align-items:center;justify-content:center;flex:none;padding:0}
.dayDel:active{background:rgba(224,112,92,.15)}
.day .line{font-size:12px;font-weight:500;color:var(--silver);margin-top:4px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
/* Key/Value */
.kv{margin:14px 0 0}
.kv .row{display:flex;justify-content:space-between;gap:14px;padding:9px 0;border-bottom:1px solid var(--line)}
.kv .k{font-size:12px;font-weight:500;color:var(--muted);flex:none}
.kv .w{font-size:13px;font-weight:500;color:var(--silver);text-align:right;min-width:0;overflow-wrap:anywhere}
/* Buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:16px;border-radius:14px;border:none;font-family:inherit;font-size:15px;font-weight:700;background:var(--accent);color:var(--on-accent);box-shadow:var(--glow);margin-bottom:10px}
.btn:active{filter:brightness(.94)}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line-strong);box-shadow:none;font-weight:600;padding:13px;border-radius:12px}
.btn.ghost:active{background:var(--surface);filter:none}
.btn.danger{background:transparent;color:var(--danger);border:1px solid rgba(224,112,92,.4);box-shadow:none;font-weight:600;padding:13px;border-radius:12px}
body.light .btn.danger{border-color:rgba(194,78,59,.4)}
.btn.info{background:var(--info);color:#fff;box-shadow:none;border-radius:8px;padding:9px;font-size:12px;margin:0}
.btnrow{display:flex;gap:10px}
.btnrow .btn{margin-bottom:10px}
.sub{font-size:11px;color:var(--faint);text-align:center;margin:2px 0 18px;line-height:1.5}
/* Chips */
.chip{font-size:10px;font-weight:600;padding:3px 8px;border-radius:7px;background:var(--field);color:var(--muted);border:1px solid var(--line);flex:none}
.chip.pos{background:var(--pos-soft);border-color:var(--pos-line);color:var(--pos)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{border:1px solid var(--line);background:var(--field);color:var(--muted);font-family:inherit;font-size:12px;font-weight:600;padding:9px 11px;border-radius:8px}
.chips button.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
/* Farbcodierung */
.ot-pos{color:var(--pos)!important}
.ot-zero{color:var(--muted)!important}
.ot-neg{color:var(--info)!important}
/* Backup-Banner */
.remind{border:1px solid var(--info-line);background:var(--info-soft);border-radius:12px;padding:13px 14px;margin:0 0 16px}
.remind b{display:block;font-size:12px;font-weight:600;color:var(--info);margin-bottom:3px}
.remind p{margin:0 0 10px;font-size:11px;color:var(--silver);line-height:1.5}
.remind .btn.ghost{margin:0;padding:9px;font-size:12px;border-radius:8px}
/* Sheet */
.scrim{position:fixed;inset:0;background:rgba(10,9,8,.55);z-index:50;display:none;backdrop-filter:blur(3px)}
.scrim.on{display:block;animation:fadein .25s ease}
.scrim.out{animation:fadeout .2s ease forwards}
.sheet{position:absolute;left:0;right:0;bottom:0;margin:0 auto;background:var(--bg);width:auto;max-width:560px;border-radius:22px 22px 0 0;border-top:1px solid var(--line-strong);max-height:92vh;overflow-y:auto;overflow-x:hidden;padding:10px 20px calc(env(safe-area-inset-bottom) + 44px);animation:up .3s cubic-bezier(.2,.8,.2,1)}
.sheet.out{animation:down .2s ease forwards}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@keyframes down{to{transform:translateY(100%)}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes fadeout{to{opacity:0}}
.grip{width:38px;height:5px;border-radius:3px;background:var(--line-strong);margin:8px auto 18px}
.sheet h3{font-weight:800;font-size:26px;letter-spacing:-.7px;margin:0 0 18px;color:var(--text-strong)}
/* Section-Label im Sheet darf nicht vom Sheet-Titel-Stil überschrieben werden */
.sheet .section-h h3{font-weight:700;font-size:12px;letter-spacing:.5px;text-transform:uppercase;color:var(--faint);margin:0}
/* Felder */
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;font-weight:600}
.field input,.field textarea{width:100%;min-width:0;max-width:100%;-webkit-appearance:none;appearance:none;padding:12px 13px;border-radius:10px;border:1px solid var(--line-strong);background:var(--field-input);color:var(--text-strong);font-family:inherit;font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.field textarea{resize:none;line-height:1.5;font-variant-numeric:normal}
.field input.txt{font-variant-numeric:normal}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--accent-line);background:var(--surface-2)}
.field input:disabled{opacity:.4}
.field input[type="date"]::-webkit-calendar-picker-indicator{filter:invert(.6) sepia(1) saturate(2.2) hue-rotate(348deg);opacity:.9}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
/* Timeboxen */
.timebox{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.timebox.acc{background:var(--accent-soft);border-color:var(--accent-line)}
.timebox .tl{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:9px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);margin-bottom:12px}
.timebox.acc .tl{color:var(--accent-ink)}
.timebox .tl .hint{font-size:10px;font-weight:500;letter-spacing:0;text-transform:none;color:var(--muted)}
.tfield{background:var(--field-input);border:1px solid var(--line-strong);border-radius:10px;padding:7px 6px 5px;text-align:center;min-width:0}
.timebox.acc .tfield{background:var(--surface)}
.tfield .tlbl{display:block;font-size:9px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted)}
.tfield input{width:100%;min-width:0;border:none;background:transparent;color:var(--text-strong);font-family:inherit;font-size:19px;font-weight:700;text-align:center;padding:2px 0 0;font-variant-numeric:tabular-nums;-webkit-appearance:none;appearance:none}
.tfield input:focus{outline:none}
.tfield input:disabled{color:var(--faint);opacity:1}
/* Native Uhr-Symbol raus: kostet Breite (RZ-Felder wurden abgeschnitten) und der Handoff zeigt reine Zahlen */
.tfield input::-webkit-calendar-picker-indicator{display:none;-webkit-appearance:none}
.tfield input::-webkit-date-and-time-value{text-align:center}
/* RZ: Anreise und Rückreise untereinander, damit "09:30" auf 375px voll lesbar bleibt */
.rzblock+.rzblock{margin-top:12px}
.rzblock .two{gap:10px}
.nrow{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.rlbl{font-size:11px;font-weight:600;color:var(--muted)}
/* Mini-Segment + entfällt */
.mseg{display:flex;background:var(--field);border-radius:8px;padding:3px;gap:2px}
.timebox.acc .mseg{background:var(--surface)}
.mseg button{border:none;background:transparent;color:var(--muted);font-family:inherit;font-size:10px;font-weight:700;padding:5px 9px;border-radius:6px;letter-spacing:0;text-transform:none}
.mseg button.on{background:var(--surface-2);color:var(--text-strong)}
.offbtn{border:1px solid var(--line);background:var(--field);color:var(--muted);font-family:inherit;font-size:10px;font-weight:700;padding:4px 9px;border-radius:7px}
.offbtn.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
/* Ja/Nein-Segmente */
.toggles{display:flex;background:var(--field);border-radius:10px;padding:4px;gap:4px}
.toggles button{flex:1;padding:10px 4px;border-radius:7px;border:none;background:transparent;color:var(--muted);font-family:inherit;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
.toggles button.on{background:var(--accent);color:var(--on-accent)}
.toggles button.on[data-p="0"],.toggles button.on[data-u="0"],.toggles button.on[data-a="0"]{background:var(--surface);color:var(--text-strong)}
/* Calc-Kachel */
.calc{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:4px 0 12px}
.calc .clbl{font-size:9px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.calc .r{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.calc hr{border:none;height:1px;background:var(--line);margin:11px 0}
.calc .c .l{font-size:9px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;color:var(--muted)}
.calc .c .n{font-weight:700;font-size:16px;margin-top:2px;color:var(--text-strong)}
.calc .c .n.big{font-size:17px;font-weight:800}
/* Tagegeld-Box */
.tgbox{border-radius:12px;padding:13px 15px;margin:2px 0 4px;background:var(--surface);border:1px solid var(--line)}
.tgbox .t{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:13px;font-weight:700;color:var(--muted)}
.tgbox .t .in{font-size:11px;font-weight:500;color:var(--muted)}
.tgbox .why{font-size:11px;font-weight:500;color:var(--silver);margin-top:4px;line-height:1.5}
.tgbox.ok{background:var(--pos-soft);border-color:var(--pos-line)}
.tgbox.ok .t{color:var(--pos)}
/* Dispo-Zeile */
.dispoinfo{font-size:12px;color:var(--silver);background:var(--info-soft);border:1px solid var(--info-line);border-radius:10px;padding:9px 12px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.dispoinfo button{background:var(--info);border:none;color:#fff;font-family:inherit;font-size:11px;font-weight:600;padding:5px 10px;border-radius:7px;flex:none}
/* Einstellungen */
.setrow{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;background:var(--surface);border:none;border-radius:12px;padding:14px 15px;margin-bottom:8px;font-family:inherit;font-size:14px;font-weight:600;color:var(--text-strong);text-align:left}
.setrow:active{background:var(--surface-2)}
.setrow>span:first-child{flex:1;min-width:0}
.setrow small{display:block;font-size:11px;font-weight:500;color:var(--faint);margin-top:2px}
.setrow .chev{color:var(--line-strong);font-size:15px;flex:none}
.setcard{background:var(--surface);border-radius:12px;padding:14px 15px;margin-bottom:8px}
.setcard .stat{font-size:12px;font-weight:500;color:var(--silver);margin-bottom:10px}
.setcard .field:last-of-type{margin-bottom:0}
/* Anleitung */
.hsec{background:var(--surface);border-radius:14px;padding:16px;margin-bottom:10px}
.hsec .eb{font-size:9px;font-weight:600;letter-spacing:1.4px;text-transform:uppercase;color:var(--accent-ink);margin-bottom:8px}
.hsec p{margin:0;font-size:13px;font-weight:500;line-height:1.65;color:var(--silver)}
.hsec b{color:var(--text-strong);font-weight:600}
/* Import-Vorschau */
.implist .irow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.implist .irow .d{font-size:14px;font-weight:700;color:var(--text-strong)}
.implist .irow .d small{display:block;font-size:11px;font-weight:500;color:var(--silver);margin-top:2px}
.implist .irow .o{font-weight:800;font-size:15px;flex:none}
.rnote{border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:11px;line-height:1.6;color:var(--faint);margin-top:8px}
.rnote b{color:var(--silver);font-weight:600}
/* Dialog */
.cscrim{position:fixed;inset:0;background:rgba(10,9,8,.62);z-index:120;display:none;align-items:center;justify-content:center;padding:24px;backdrop-filter:blur(3px)}
.cscrim.on{display:flex;animation:fadein .25s ease}
.cscrim.out{animation:fadeout .15s ease forwards}
.cdlg{background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:20px;max-width:300px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.5);animation:pop .25s cubic-bezier(.2,.8,.2,1)}
.cscrim.out .cdlg{animation:popout .15s ease forwards}
@keyframes pop{from{opacity:0;transform:scale(.95) translateY(8px)}}
@keyframes popout{to{opacity:0;transform:scale(.97)}}
.cdlg .ctitle{font-size:17px;font-weight:700;color:var(--text-strong);margin:0 0 8px}
.cdlg .cmsg{margin:0 0 16px;font-size:13px;line-height:1.5;color:var(--silver)}
.crow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.crow .btn{margin:0;padding:12px;font-size:13px}
.crow .btn.do{background:var(--danger);color:#fff;border:none;box-shadow:none;font-weight:700;border-radius:12px}
/* Nicht-destruktive Bestätigung (z. B. Reiseart umstellen): Amber statt Rot */
.crow .btn.do.go{background:var(--accent);color:var(--on-accent)}
/* Toast */
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 46px);transform:translateX(-50%) translateY(20px);width:min(520px,calc(100% - 40px));background:var(--field);border:1px solid var(--accent-line);color:var(--text);padding:13px 15px;border-radius:12px;font-size:12px;font-weight:600;text-align:center;z-index:80;opacity:0;transition:.3s;pointer-events:none;box-shadow:0 10px 40px rgba(0,0,0,.4)}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
/* Sonstiges */
.note{font-size:11px;color:var(--faint);line-height:1.5;margin:8px 0 0}
.note b{color:var(--muted);font-weight:600}
.divider{height:1px;background:var(--line);margin:18px 0}
.hidden{display:none!important}
.empty{text-align:center;color:var(--muted);padding:56px 20px}
.empty .big{font-size:40px;margin-bottom:12px}
.empty p{font-size:14px;font-weight:500;line-height:1.6;margin:0}
.foot{text-align:center;padding:10px 20px calc(env(safe-area-inset-bottom) + 18px)}
.foot-note{font-size:10.5px;color:var(--faint);line-height:1.5}
.foot-v{font-size:11px;font-weight:600;color:var(--faint);margin-top:8px}
.foot-v b{color:var(--accent);font-weight:700}
@media (prefers-reduced-motion:reduce){.view,.scrim,.scrim.on,.scrim.out,.sheet,.sheet.out,.cscrim.on,.cscrim.out,.cdlg,.cscrim.out .cdlg,.toast{animation-duration:0s!important;transition-duration:0s!important}}
</style>
</head>
<body>
<div class="app">
  <div class="bar" id="bar"></div>
  <div class="view" id="view"></div>
  <div class="foot">
    <div class="foot-note">Daten bleiben nur auf diesem Gerät · alle Angaben ohne Gewähr</div>
    <div class="foot-v">Zeiterfassung <b>V3.2.1</b></div>
  </div>
</div>
<input type="file" id="pdfInput" accept="application/pdf" class="hidden">
<input type="file" id="backupInput" accept="application/json,.json" class="hidden">
<div class="scrim" id="scrim"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<div class="cscrim" id="confirmBox"><div class="cdlg"><p class="ctitle"></p><p class="cmsg"></p><div class="crow"><button id="cNo" class="btn ghost">Abbrechen</button><button id="cYes" class="btn do">Löschen</button></div></div></div>

<script>
"use strict";
/* ===== Persistenz (Fallback falls localStorage gesperrt) ===== */
const KEY="zeiterfassung_v2";
const Store={mem:{},load(){try{const r=localStorage.getItem(KEY);return r?JSON.parse(r):null}catch(e){return this.mem[KEY]||null}},save(o){try{localStorage.setItem(KEY,JSON.stringify(o))}catch(e){this.mem[KEY]=o}}};
let DB=Store.load()||{orders:[],settings:{}};
const S=DB.settings;
S.sollMin??=450; if(S.sollMin===462)S.sollMin=450; S.standardPause??=30; S.abwesenheitMin??=480; S.email??=""; S.absender??=""; S.empfaenger??=""; S.theme??="dark";
DB.orders.forEach(o=>{o.notiz??=""; o.equipment??=[]; o.abgerechnet??=false; o.days.forEach(d=>{
  if(d.einsatz===undefined){ d.einsatz=d.istStart||d.geplStart||""; d.ende=d.istEnde||d.geplEnde||""; d.anreise=""; d.rueck="";
    d.dispo={einsatz:d.geplStart||d.istStart||"",ende:d.geplEnde||d.istEnde||""}; delete d.istStart;delete d.istEnde;delete d.geplStart;delete d.geplEnde; }
  d.dispo??={einsatz:"",ende:""}; d.uebernachtung??=false; d.ausland??=false;
  if(typeof d.pause==="number") d.pause=d.pause>0; d.pause??=true;
  d.drehbeginn??=(d.einsatz?addMin(d.einsatz,60):""); d.drehende??=(d.ende?addMin(d.ende,-60):"");
  d.anreiseEnde??=""; d.rueckBeginn??="";
});});
function persist(){Store.save(DB);}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);

/* ===== Icons (Inline-SVG, Handoff) ===== */
const ICON_GEAR='<svg width="17" height="17" viewBox="0 0 17 17" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><path d="M2 5.5h13M2 11.5h13"/><circle cx="6.2" cy="5.5" r="1.9"/><circle cx="10.8" cy="11.5" r="1.9"/></svg>';
const ICON_MOON='<svg width="17" height="17" viewBox="0 0 17 17" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"><path d="M13.8 10.3A5.8 5.8 0 0 1 6.7 3.2a5.8 5.8 0 1 0 7.1 7.1Z"/></svg>';
const ICON_SUN='<svg width="17" height="17" viewBox="0 0 17 17" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><circle cx="8.5" cy="8.5" r="3.2"/><path d="M8.5 1.6v1.6M8.5 13.8v1.6M1.6 8.5h1.6M13.8 8.5h1.6M3.6 3.6l1.2 1.2M12.2 12.2l1.2 1.2M13.4 3.6l-1.2 1.2M4.8 12.2l-1.2 1.2"/></svg>';
const ICON_TRASH='<svg width="13" height="14" viewBox="0 0 13 14" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 3.5h10M4.5 3.5V2h4v1.5M2.8 3.5l.6 9h6.2l.6-9"/></svg>';

/* ===== Helfer ===== */
function hm2min(s){if(!s)return null;const m=String(s).match(/(\d{1,2}):(\d{2})/);return m?(+m[1])*60+(+m[2]):null;}
function dur(a,b){if(a==null||b==null)return null;let d=b-a;if(d<0)d+=1440;return d;}
function addMin(hm,mins){const m=hm2min(hm);if(m==null)return "";let x=(m+mins)%1440;if(x<0)x+=1440;return String(Math.floor(x/60)).padStart(2,"0")+":"+String(x%60).padStart(2,"0");}
function fmtMin(m){if(m==null)return "–";const s=m<0?"-":"";m=Math.abs(m);return s+Math.floor(m/60)+":"+String(m%60).padStart(2,"0");}
function fmtSigned(m){if(m==null)return "–";const s=m>0?"+":(m<0?"-":"±");const a=Math.abs(m);return s+Math.floor(a/60)+":"+String(a%60).padStart(2,"0");}
function otClass(m){if(m==null||m===0)return "ot-zero";return m>0?"ot-pos":"ot-neg";}
const WD=["So","Mo","Di","Mi","Do","Fr","Sa"];
const MN=["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];
function fmtMonth(mk){return MN[+mk.slice(5,7)-1]+" "+mk.slice(0,4);}
function fmtDate(iso){if(!iso)return "—";const d=new Date(iso+"T00:00");if(isNaN(d))return iso;return WD[d.getDay()]+". "+String(d.getDate()).padStart(2,"0")+"."+String(d.getMonth()+1).padStart(2,"0")+".";}
function fmtDateLong(iso){if(!iso)return "";const d=new Date(iso+"T00:00");if(isNaN(d))return iso;return WD[d.getDay()]+", "+String(d.getDate()).padStart(2,"0")+"."+String(d.getMonth()+1).padStart(2,"0")+"."+d.getFullYear();}
function fmtDayC(iso){if(!iso)return "—";const d=new Date(iso+"T00:00");if(isNaN(d))return iso;return WD[d.getDay()]+", "+String(d.getDate()).padStart(2,"0")+"."+String(d.getMonth()+1).padStart(2,"0")+".";}
function fmtRange(o){const ds=o.days.map(d=>d.datum).filter(Boolean).sort();if(!ds.length)return "";
  const a=new Date(ds[0]+"T00:00"),b=new Date(ds[ds.length-1]+"T00:00");if(isNaN(a)||isNaN(b))return "";
  const dd=x=>String(x.getDate()).padStart(2,"0"),mm=x=>String(x.getMonth()+1).padStart(2,"0");
  if(ds[0]===ds[ds.length-1])return dd(a)+"."+mm(a)+"."+a.getFullYear();
  if(a.getMonth()===b.getMonth()&&a.getFullYear()===b.getFullYear())return dd(a)+".–"+dd(b)+"."+mm(b)+"."+b.getFullYear();
  return dd(a)+"."+mm(a)+". – "+dd(b)+"."+mm(b)+"."+b.getFullYear();}
function rangeOrt(o){const r=fmtRange(o);return [r,o.produktionsort].filter(Boolean).join(" · ")||"Noch keine Tage";}
function headEyebrow(){const n=new Date();let s=MN[n.getMonth()].toUpperCase()+" "+n.getFullYear();const a=clean(S.absender);if(a)s+=" · "+a.toUpperCase();return s;}

/* ===== Berechnung pro Tag ===== */
function dayCalc(d){
  const span=dur(hm2min(d.einsatz),hm2min(d.ende));
  const az=dur(hm2min(d.drehbeginn),hm2min(d.drehende));
  const pauseMin=d.pause?(S.standardPause||0):0;
  const netto=span==null?null:Math.max(0,span-pauseMin);
  const ot=netto==null?null:netto-S.sollMin;
  let tg;
  if(d.uebernachtung) tg={state:"ue"};
  else if(d.ausland) tg={state:"ausland"};
  else if(span==null) tg={state:"none"};
  else if(span>S.abwesenheitMin) tg={state:"ok"};
  else tg={state:"under"};
  return {span,az,pause:pauseMin,pauseJa:!!d.pause,netto,ot,absence:span,tg};
}
const orderOT=o=>o.days.reduce((a,d)=>a+(dayCalc(d).ot||0),0);
const orderNetto=o=>o.days.reduce((a,d)=>a+(dayCalc(d).netto||0),0);
const orderTGdays=o=>o.days.reduce((a,d)=>a+(dayCalc(d).tg.state==="ok"?1:0),0);
const orderDate=o=>o.days.map(d=>d.datum).filter(Boolean).sort()[0]||"";
const byDate=(a,b)=>(orderDate(a)||"0000").localeCompare(orderDate(b)||"0000");

/* ===== Reiseart (abgeleitet, nicht gespeichert) =====
   Eine Wahrheit: der Zustand ergibt sich aus days[].uebernachtung, damit Reiseart und
   Tage nie auseinanderlaufen (auch nicht, wenn ein einzelner Tag im Sheet umgestellt wird).
   "mix" = uneinheitlich, z. B. zwei Nächte Hotel und der letzte Tag heimgefahren. */
function orderTrip(o){
  if(!o.days.length)return "none";
  const ue=o.days.filter(d=>d.uebernachtung).length;
  if(ue===0)return "ein";
  if(ue===o.days.length)return "mehr";
  return "mix";
}
/* Reiseart auf alle Tage anwenden. Ändert NUR uebernachtung und die vier Reisefelder –
   Einsatzbeginn/-ende, Dreh und Pause bleiben unangetastet, damit Netto und Überstunden
   sich nicht verschieben. Muster wie beim Import: bei "mehr" Anreise nur am ersten,
   Rückreise nur am letzten Tag; bei "ein" beide Fahrten an jedem Tag. */
function applyTrip(o,trip){
  const mehr=trip==="mehr";
  const days=o.days.slice().sort((a,b)=>((a.datum||"")+(a.einsatz||"")).localeCompare((b.datum||"")+(b.einsatz||"")));
  const last=days.length-1;
  days.forEach((d,i)=>{
    d.uebernachtung=mehr;
    const hin=!mehr||i===0, rueck=!mehr||i===last;
    d.anreise=hin&&d.einsatz?addMin(d.einsatz,30):"";
    d.anreiseEnde=hin&&d.einsatz?addMin(d.einsatz,60):"";
    d.rueckBeginn=rueck&&d.ende?addMin(d.ende,-60):"";
    d.rueck=rueck&&d.ende?addMin(d.ende,-30):"";
  });
}

/* ===== Routing ===== */
let state={tab:"orders",orderId:null};
const view=document.getElementById("view");
function paintThemeIcon(){const b=document.getElementById("themeBtn");if(b)b.innerHTML=(S.theme==="light"?ICON_SUN:ICON_MOON);}
function applyTheme(){const l=S.theme==="light";document.body.classList.toggle("light",l);paintThemeIcon();const m=document.querySelector('meta[name="theme-color"]');if(m)m.content=l?"#F5F4F1":"#15171A";}
function renderBar(){
  const bar=document.getElementById("bar");
  if(state.orderId){
    bar.innerHTML=`<button class="backlink" id="barBack">‹ Aufträge</button><span style="flex:1"></span><span class="eyebrow">Auftrag</span>`;
    document.getElementById("barBack").onclick=()=>{state.orderId=null;render();};
  }else{
    bar.innerHTML=`<div class="brand">Z</div><div class="eyebrow" style="flex:1">Zeiterfassung</div><button class="iconbtn" id="themeBtn" aria-label="Hell/Dunkel"></button><button class="iconbtn" id="navSettings" aria-label="Einstellungen">${ICON_GEAR}</button>`;
    document.getElementById("themeBtn").onclick=()=>{S.theme=(S.theme==="light"?"dark":"light");persist();applyTheme();};
    document.getElementById("navSettings").onclick=openSettings;
    paintThemeIcon();
  }
}
function tabsHtml(){return `<div class="segs" id="segs"><button data-tab="orders"${state.tab==="orders"?' class="on"':''}>Aufträge</button><button data-tab="stats"${state.tab==="stats"?' class="on"':''}>Statistik</button></div>`;}
function bindTabs(){view.querySelectorAll("#segs button").forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;state.orderId=null;window.scrollTo(0,0);render();});}
function render(){renderBar();if(state.orderId)return renderDetail();if(state.tab==="stats")return renderStats();return renderOrders();}

/* ===== Auftragsliste ===== */
function renderOrders(){
  const active=DB.orders.filter(o=>!o.abgerechnet).slice().sort(byDate);
  const done=DB.orders.filter(o=>o.abgerechnet).slice().sort(byDate);
  const totOT=active.reduce((a,o)=>a+orderOT(o),0);
  const totDays=active.reduce((a,o)=>a+o.days.length,0);
  const totTG=active.reduce((a,o)=>a+orderTGdays(o),0);
  let h="";
  const needBak=DB.orders.length>0&&(!S.lastBackup||Date.now()-S.lastBackup>30*864e5)&&(!S.bakSnooze||Date.now()-S.bakSnooze>7*864e5);
  if(needBak)h+=`<div class="remind"><b>${S.lastBackup?"Backup ist über einen Monat her":"Noch kein Backup"}</b><p>Deine Daten liegen nur auf diesem Gerät. Sichere sie regelmäßig als Datei.</p><div class="btnrow"><button class="btn info" id="remBak">Backup teilen</button><button class="btn ghost" id="remLater">Später</button></div></div>`;
  h+=`<div class="pagehead"><div class="eyebrow">${esc(headEyebrow())}</div><div class="display">Aufträge</div></div>
  <div class="kpis">
    <div class="kpi acc"><div class="l">Überstunden</div><div class="n ${otClass(totOT)}">${fmtSigned(totOT)}</div></div>
    <div class="kpi"><div class="l">Tage</div><div class="n">${totDays}</div></div>
    <div class="kpi"><div class="l">Tagegeld</div><div class="n" style="color:${totTG>0?'var(--pos)':'var(--muted)'}">${totTG>0?totTG+"×":"—"}</div></div>
  </div>`+tabsHtml();
  if(!DB.orders.length){
    h+=`<div class="empty"><div class="big">🗂</div><p>Noch kein Auftrag angelegt.<br>Leg einen an oder importiere ein Dispo-PDF.</p></div>`;
  }else{
    const cardHtml=o=>{
      const ot=orderOT(o),tgd=orderTGdays(o);
      return `<div class="card" data-open="${o.id}">
      <div class="eyeline">${esc(rangeOrt(o))}</div>
      <div class="toprow"><p class="titel">${esc(o.titel||"Ohne Titel")}</p><div class="num ${otClass(ot)}">${fmtSigned(ot)}</div></div>
      <div class="cardgrid">
        <div><div class="l">Tage</div><div class="v">${o.days.length}</div></div>
        <div><div class="l">Netto</div><div class="v">${fmtMin(orderNetto(o))}</div></div>
        <div><div class="l">Tagegeld</div><div class="v" style="color:${tgd>0?'var(--pos)':'var(--muted)'}">${tgd>0?tgd+"×":"—"}</div></div>
      </div>
      ${(o.auftragsnr||o.prodNummer)?`<div class="cardfoot">${[o.auftragsnr?"Nr. "+esc(o.auftragsnr):"",o.prodNummer?"Prod. "+esc(o.prodNummer):""].filter(Boolean).join(" · ")}</div>`:""}</div>`;};
    const doneHtml=o=>{
      const ot=orderOT(o);
      return `<div class="card" data-open="${o.id}">
      <div class="eyeline">${esc(rangeOrt(o))}</div>
      <div class="toprow"><p class="titel">${esc(o.titel||"Ohne Titel")}</p><div class="num">${fmtSigned(ot)}</div></div></div>`;};
    if(active.length)h+=`<div class="cards">${active.map(cardHtml).join("")}</div>`;
    else h+=`<div class="empty" style="padding:36px 20px"><div class="big">🗂</div><p>Kein aktiver Auftrag.</p></div>`;
    if(done.length){h+=`<div class="section-h"><h3>Abgerechnet</h3><span class="tot">${done.length}</span></div><div class="cards done">${done.map(doneHtml).join("")}</div>`;}
  }
  h+=`<button class="btn" id="addOrder" style="margin-top:16px">Auftrag anlegen</button>
  <button class="btn ghost" id="importPdf">PDF importieren</button>
  <p class="sub">Dispo-PDF auswählen – Auftragsdaten und Drehtage werden vorgeschlagen, du bestätigst vor dem Import.</p>`;
  view.innerHTML=h;
  bindTabs();
  document.getElementById("addOrder").onclick=()=>editOrder(null);
  document.getElementById("importPdf").onclick=()=>document.getElementById("pdfInput").click();
  const rb=document.getElementById("remBak");if(rb)rb.onclick=exportBackup;
  const rl=document.getElementById("remLater");if(rl)rl.onclick=()=>{S.bakSnooze=Date.now();persist();render();};
  view.querySelectorAll("[data-open]").forEach(c=>c.onclick=()=>{state.orderId=c.dataset.open;window.scrollTo(0,0);render();});
}

/* ===== Detail ===== */
function renderDetail(){
  const o=DB.orders.find(x=>x.id===state.orderId);if(!o){state.orderId=null;return render();}
  const days=o.days.slice().sort((a,b)=>((a.datum||"")+(a.einsatz||"")).localeCompare((b.datum||"")+(b.einsatz||"")));
  const ot=orderOT(o),netto=orderNetto(o),tgd=orderTGdays(o);
  let h=`<div class="pagehead" style="margin-bottom:0"><div class="eyebrow">${esc(rangeOrt(o))}</div><div class="dtitle">${esc(o.titel||"Ohne Titel")}</div></div>
  <div class="cardgrid big" style="margin-top:14px">
    <div><div class="l">Tage</div><div class="v">${o.days.length}</div></div>
    <div><div class="l">Netto</div><div class="v">${fmtMin(netto)}</div></div>
    <div><div class="l">Tagegeld</div><div class="v" style="color:${tgd>0?'var(--pos)':'var(--muted)'}">${tgd>0?tgd+"×":"—"}</div></div>
  </div>
  <div class="hero small" style="margin-top:14px"><div class="l">Überstunden</div><div class="n ${otClass(ot)}">${fmtSigned(ot)}</div></div>
  <div class="kv">
    ${o.auftragsnr?`<div class="row"><span class="k">Auftrags-Nr.</span><span class="w">${esc(o.auftragsnr)}</span></div>`:""}
    ${o.prodNummer?`<div class="row"><span class="k">Prod.-Nr.</span><span class="w">${esc(o.prodNummer)}</span></div>`:""}
    ${o.kostentraeger?`<div class="row"><span class="k">Kostenträger</span><span class="w">${esc(o.kostentraeger)}</span></div>`:""}
    ${o.produktionsort?`<div class="row"><span class="k">Produktionsort</span><span class="w">${esc(o.produktionsort)}</span></div>`:""}
    ${o.mitarbeiter?`<div class="row"><span class="k">Mitarbeiter</span><span class="w">${esc(o.mitarbeiter)}</span></div>`:""}
    ${equipText(o)?`<div class="row"><span class="k">Equipment</span><span class="w">${esc(equipText(o))}</span></div>`:""}
    ${o.abgerechnet?`<div class="row"><span class="k">Status</span><span class="w" style="color:var(--pos)">✓ abgerechnet</span></div>`:""}
  </div>
  <div class="btnrow" style="margin-top:14px"><button class="btn ghost" id="editOrder" style="margin-bottom:0">Bearbeiten</button><button class="btn ghost" id="abrToggle" style="margin-bottom:0">${o.abgerechnet?"Wieder aktiv":"Abgerechnet"}</button></div>
  <div class="section-h"><h3>Arbeitstage</h3><span class="tot">${days.length} ${days.length===1?"Tag":"Tage"} · ${fmtSigned(ot)}</span></div>`;
  if(days.length){
    const trip=orderTrip(o);
    h+=`<div class="field" style="margin:8px 0 16px">
      <div class="nrow"><span class="rlbl">Reiseart</span>${trip==="mix"?'<span class="chip">gemischt</span>':""}</div>
      <div class="toggles" id="tripSeg"><button data-t="ein"${trip==="ein"?' class="on"':''}>Einzeltage</button><button data-t="mehr"${trip==="mehr"?' class="on"':''}>Mehrtägig</button></div>
      <p class="note">${trip==="mix"
        ? "Einzelne Tage haben Übernachtung, andere nicht. Umstellen setzt alle Tage einheitlich."
        : "Tagegeld gibt es nur bei Einzeltagen – mehrtägig mit Übernachtung läuft über die Dienstreise-Abrechnung. Umstellen setzt Übernachtung und die Reisezeiten aller Tage neu; Einsatz- und Drehzeiten bleiben unverändert, die Überstunden ändern sich also nicht."}</p>
    </div>`;
  }
  if(!days.length)h+=`<div class="empty" style="padding:32px 20px"><div class="big">📅</div><p>Noch kein Tag erfasst.</p></div>`;
  else days.forEach(d=>{
    const c=dayCalc(d);
    const azTxt=(d.drehbeginn||d.drehende)?`Dreh ${d.drehbeginn||"–"}–${d.drehende||"–"}`:"kein Dreh";
    const ad=dur(hm2min(d.anreise),hm2min(d.anreiseEnde)),rd=dur(hm2min(d.rueckBeginn),hm2min(d.rueck));
    let l2=`Netto ${fmtMin(c.netto)} · Soll ${fmtMin(S.sollMin)}`;
    if(ad!=null)l2+=` · Anreise ${fmtMin(ad)}`;
    if(rd!=null)l2+=` · Rückreise ${fmtMin(rd)}`;
    let chips="";
    if(c.tg.state==="ok")chips+=`<span class="chip pos">Tagegeld</span>`;
    if(d.uebernachtung)chips+=`<span class="chip">Übernachtung</span>`;

  document.getElementById("abrToggle").onclick=()=>{o.abgerechnet=!o.abgerechnet;persist();render();toast(o.abgerechnet?"Als abgerechnet markiert":"Auftrag wieder aktiv");};
  document.getElementById("addDay").onclick=()=>editDay(o.id,null);
  document.getElementById("mailOrder").onclick=()=>mailOrder(o);
  document.getElementById("pdfOrder").onclick=()=>pdfOrder(o);
  view.querySelectorAll("#tripSeg button").forEach(b=>b.onclick=()=>{
    const trip=b.dataset.t; if(trip===orderTrip(o))return;
    const n=o.days.length;
    const was=trip==="mehr"
      ? `Alle ${n} Tage werden auf Übernachtung gesetzt. Anreise nur am ersten, Rückreise nur am letzten Tag. Bei Übernachtung besteht kein Tagegeld-Anspruch – das läuft über die Dienstreise-Abrechnung.`
      : `Alle ${n} Tage werden auf „keine Übernachtung" gesetzt und bekommen eigene An- und Rückreise. Tagegeld wird dann je Tag geprüft.`;
    askConfirm(was+" Einsatz- und Drehzeiten bleiben unverändert.",()=>{
      applyTrip(o,trip);persist();render();
      const tgd=orderTGdays(o);
      toast(trip==="mehr"?"Auf mehrtägig umgestellt":(tgd>0?`Auf Einzeltage umgestellt · ${tgd}× Tagegeld möglich`:"Auf Einzeltage umgestellt"));
    },"Umstellen","go");
  });
  view.querySelectorAll(".dayDel").forEach(b=>b.onclick=e=>{e.stopPropagation();const id=b.dataset.del;askConfirm("Diesen Arbeitstag wirklich löschen?",()=>{o.days=o.days.filter(x=>x.id!==id);persist();render();toast("Tag gelöscht");});});
  view.querySelectorAll("[data-day]").forEach(el=>el.onclick=()=>editDay(o.id,el.dataset.day));
}

/* ===== Statistik ===== */
function renderStats(){
  const totOT=DB.orders.reduce((a,o)=>a+orderOT(o),0);
  const totNetto=DB.orders.reduce((a,o)=>a+orderNetto(o),0);
  const totDays=DB.orders.reduce((a,o)=>a+o.days.length,0);
  const totTGd=DB.orders.reduce((a,o)=>a+orderTGdays(o),0);
  const nw=new Date();
  let h=`<div class="pagehead"><div class="eyebrow">${esc(headEyebrow())}</div><div class="display">Statistik</div></div>`+tabsHtml();
  h+=`<div class="hero"><div class="l">Überstunden gesamt</div><div class="n ${otClass(totOT)}">${fmtSigned(totOT)}</div><div class="hsub">${DB.orders.length} ${DB.orders.length===1?"Auftrag":"Aufträge"} · Stand ${MN[nw.getMonth()]} ${nw.getFullYear()}</div></div>
  <div class="kpis two">
    <div class="kpi"><div class="l">Netto-Arbeitszeit</div><div class="n">${fmtMin(totNetto)}</div></div>
    <div class="kpi"><div class="l">Arbeitstage</div><div class="n">${totDays}</div></div>
    <div class="kpi posk"><div class="l">Tagegeld-Tage</div><div class="n">${totTGd}</div></div>
    <div class="kpi"><div class="l">Soll / Tag</div><div class="n">${fmtMin(S.sollMin)}</div></div>
  </div>`;
  // Gruppierung nach Monat und Jahr (aus den Tagesdaten)
  const perMonth={},perYear={};
  DB.orders.forEach(o=>o.days.forEach(d=>{
    if(!d.datum)return;const c=dayCalc(d);if(c.netto==null)return;
    const mk=d.datum.slice(0,7),yk=d.datum.slice(0,4);
    (perMonth[mk]??={ot:0,netto:0,days:0});perMonth[mk].ot+=c.ot||0;perMonth[mk].netto+=c.netto;perMonth[mk].days++;
    (perYear[yk]??={ot:0,netto:0,days:0});perYear[yk].ot+=c.ot||0;perYear[yk].netto+=c.netto;perYear[yk].days++;
  }));
  const months=Object.keys(perMonth).sort().reverse(),years=Object.keys(perYear).sort().reverse();
  if(months.length){h+=`<div class="section-h"><h3>Pro Monat</h3></div>`;
    months.forEach(mk=>{const m=perMonth[mk];
      h+=`<div class="srow"><div class="nm">${fmtMonth(mk)}<small>${m.days} ${m.days===1?"Tag":"Tage"} · ${fmtMin(m.netto)} netto</small></div><div class="v ${otClass(m.ot)}">${fmtSigned(m.ot)}</div></div>`;});
  }
  if(years.length>1){h+=`<div class="section-h"><h3>Pro Jahr</h3></div>`;
    years.forEach(yk=>{const yy=perYear[yk];
      h+=`<div class="srow"><div class="nm">${yk}<small>${yy.days} ${yy.days===1?"Tag":"Tage"} · ${fmtMin(yy.netto)} netto</small></div><div class="v ${otClass(yy.ot)}">${fmtSigned(yy.ot)}</div></div>`;});
  }
  if(DB.orders.length){h+=`<div class="section-h"><h3>Pro Auftrag</h3></div>`;
    DB.orders.slice().sort((a,b)=>byDate(b,a)).forEach(o=>{const ot=orderOT(o),tgd=orderTGdays(o);
      h+=`<div class="srow${o.abgerechnet?" dim":""}" data-open="${o.id}" style="cursor:pointer"><div class="nm">${esc(o.titel||"Ohne Titel")}<small>${o.days.length} ${o.days.length===1?"Tag":"Tage"} · ${fmtMin(orderNetto(o))} netto${tgd>0?` · ${tgd}× Tagegeld`:""}</small></div><div style="display:flex;align-items:center;gap:10px"><span class="v ${otClass(ot)}">${fmtSigned(ot)}</span><span class="chev">›</span></div></div>`;});
  }else h+=`<div class="empty"><div class="big">📊</div><p>Noch keine Daten.</p></div>`;
  view.innerHTML=h;
  bindTabs();
  view.querySelectorAll("[data-open]").forEach(c=>c.onclick=()=>{state.orderId=c.dataset.open;window.scrollTo(0,0);render();});
}

/* ===== Sheet ===== */
const scrim=document.getElementById("scrim"),sheet=document.getElementById("sheet");
let shT=null;
function openSheet(html){clearTimeout(shT);scrim.classList.remove("out");sheet.classList.remove("out");sheet.innerHTML='<div class="grip"></div>'+html;scrim.classList.add("on");sheet.scrollTop=0;document.body.style.overflow="hidden";}
function closeSheet(){
  if(!scrim.classList.contains("on")||scrim.classList.contains("out"))return;
  scrim.classList.add("out");
  if(!sheet.style.transform)sheet.classList.add("out");/* Swipe hat das Sheet schon rausgeschoben */
  shT=setTimeout(()=>{scrim.classList.remove("on","out");sheet.classList.remove("out");sheet.style.transform="";sheet.style.transition="";document.body.style.overflow="";},200);
}
scrim.addEventListener("click",e=>{if(e.target===scrim)closeSheet();});
/* Wisch nach unten schließt das Sheet (nur wenn der Inhalt oben steht) */
let swY=null,swActive=false;
sheet.addEventListener("touchstart",e=>{swY=e.touches[0].clientY;swActive=sheet.scrollTop<=0;},{passive:true});
sheet.addEventListener("touchmove",e=>{
  if(swY==null||!swActive)return;
  const dy=e.touches[0].clientY-swY;
  if(dy>0&&sheet.scrollTop<=0){sheet.style.transition="none";sheet.style.transform="translateY("+dy+"px)";e.preventDefault();}
},{passive:false});
sheet.addEventListener("touchend",e=>{
  if(swY==null)return;
  const dy=e.changedTouches[0].clientY-swY;swY=null;
  if(swActive&&dy>110){sheet.style.transition="transform .22s ease";sheet.style.transform="translateY(100%)";setTimeout(closeSheet,210);}
  else{sheet.style.transition="transform .22s ease";sheet.style.transform="";setTimeout(()=>{sheet.style.transition="";},240);}
  swActive=false;
});

    <div class="field"><label>Sonstiges (optional)</label><textarea class="txt" id="f_notiz" rows="3" placeholder="z. B. weitere Hinweise">${esc(o.notiz||"")}</textarea></div>

    persist();closeSheet();render();toast(id?"Gespeichert":"Auftrag angelegt");};
  if(id)document.getElementById("delOrder").onclick=()=>{askConfirm("Diesen Auftrag mit allen Tagen wirklich löschen?",()=>{DB.orders=DB.orders.filter(x=>x.id!==id);persist();state.orderId=null;closeSheet();render();toast("Auftrag gelöscht");});};
}

/* ===== Tag ===== */
let tmpPause,tmpUE,tmpAL;
function editDay(orderId,dayId){
  const o=DB.orders.find(x=>x.id===orderId);
  const d=dayId?o.days.find(x=>x.id===dayId):{datum:guessNextDate(o),einsatz:"09:00",anreise:"09:30",anreiseEnde:"10:00",drehbeginn:"10:00",drehende:"17:00",rueckBeginn:"17:00",rueck:"17:30",ende:"18:00",pause:true,uebernachtung:false,ausland:false,dispo:{einsatz:"09:00",ende:"18:00"}};
  tmpPause=d.pause!==false; tmpUE=!!d.uebernachtung; tmpAL=!!d.ausland;
  const dsp=d.dispo||{}; const hasDispo=dsp.einsatz||dsp.ende;
  openSheet(`<h3>${dayId?"Tag bearbeiten":"Tag erfassen"}</h3>
    <div class="field"><label>Datum</label><input type="date" id="d_datum" value="${d.datum||""}"></div>
    ${hasDispo?`<div class="dispoinfo"><span>Laut Dispo: ${dsp.einsatz||"?"}–${dsp.ende||"?"}</span><button id="useDispo">übernehmen</button></div>`:""}
    <div class="timebox acc"><div class="tl"><span>EZ · Einsatzzeit</span><span class="hint">Basis der Überstunden</span></div>
      <div class="two">
        <div class="tfield"><span class="tlbl">von</span><input type="time" id="d_einsatz" value="${d.einsatz||""}"></div>
        <div class="tfield"><span class="tlbl">bis</span><input type="time" id="d_ende" value="${d.ende||""}"></div>
      </div>
    </div>
    <div class="timebox"><div class="tl"><span>AZ · Arbeitszeit (Dreh)</span><span class="mseg" id="azSeg"><button type="button" data-az="1">kein Dreh</button><button type="button" data-az="0">Dreh</button></span></div>
      <div class="two" id="azFields">
        <div class="tfield"><span class="tlbl">von</span><input type="time" id="d_drehbeginn" value="${d.drehbeginn||""}"></div>
        <div class="tfield"><span class="tlbl">bis</span><input type="time" id="d_drehende" value="${d.drehende||""}"></div>
      </div>
    </div>
    <div class="timebox"><div class="tl"><span>RZ · Reisezeit</span></div>
      <div class="rzblock"><div class="nrow"><span class="rlbl">Anreise</span><button type="button" class="offbtn" id="anNone">entfällt</button></div>
        <div class="two"><div class="tfield"><span class="tlbl">von</span><input type="time" id="d_anreise" value="${d.anreise||""}"></div><div class="tfield"><span class="tlbl">bis</span><input type="time" id="d_anreiseEnde" value="${d.anreiseEnde||""}"></div></div></div>
      <div class="rzblock"><div class="nrow"><span class="rlbl">Rückreise</span><button type="button" class="offbtn" id="rkNone">entfällt</button></div>
        <div class="two"><div class="tfield"><span class="tlbl">von</span><input type="time" id="d_rueckBeginn" value="${d.rueckBeginn||""}"></div><div class="tfield"><span class="tlbl">bis</span><input type="time" id="d_rueck" value="${d.rueck||""}"></div></div></div>
    </div>
    <div class="field"><label>Pause genommen?</label><div class="toggles" id="pausebtns"><button data-p="1">Ja · ${fmtMin(S.standardPause)}</button><button data-p="0">Nein</button></div></div>
    <div class="calc" id="calc"></div>
    <div class="section-h" style="margin:18px 0 8px"><h3>Dienstreise</h3></div>
    <div class="two">
      <div class="field"><label>Übernachtung?</label><div class="toggles" id="uebtns"><button data-u="1">Ja</button><button data-u="0">Nein</button></div></div>
      <div class="field"><label>Ausland?</label><div class="toggles" id="albtns"><button data-a="1">Ja</button><button data-a="0">Nein</button></div></div>
    </div>
    <div id="tgbox"></div>
    <p class="note">„kein Dreh" und „entfällt" lassen den jeweiligen Block leer – gerechnet wird dann nur mit der Einsatzzeit. Einsatzende rechnet sich automatisch aus der letzten Tätigkeit + 30 Min, bis du es selbst tippst.</p>
    <button class="btn" id="saveDay" style="margin-top:14px">Speichern</button>
    <div class="btnrow">${dayId?'<button class="btn danger" id="delDay" style="margin-bottom:0">Tag löschen</button>':''}<button class="btn ghost" id="cancelDay" style="margin-bottom:0">Abbrechen</button></div>`);
  const g=id=>document.getElementById(id);
  function paintPause(){document.querySelectorAll("#pausebtns button").forEach(b=>b.classList.toggle("on",(b.dataset.p==="1")===tmpPause));}
  document.querySelectorAll("#pausebtns button").forEach(b=>b.onclick=()=>{tmpPause=b.dataset.p==="1";paintPause();recalc();});
  function paintUE(){document.querySelectorAll("#uebtns button").forEach(b=>b.classList.toggle("on",(b.dataset.u==="1")===tmpUE));}
  document.querySelectorAll("#uebtns button").forEach(b=>b.onclick=()=>{tmpUE=b.dataset.u==="1";paintUE();recalc();});
  function paintAL(){document.querySelectorAll("#albtns button").forEach(b=>b.classList.toggle("on",(b.dataset.a==="1")===tmpAL));}
  document.querySelectorAll("#albtns button").forEach(b=>b.onclick=()=>{tmpAL=b.dataset.a==="1";paintAL();recalc();});
  let anEd=!!(d.anreise&&d.anreise!==addMin(d.einsatz,30));
  let aeEd=!!(d.anreiseEnde&&d.anreiseEnde!==addMin(d.einsatz,60));
  let dbEd=!!(d.drehbeginn&&d.drehbeginn!==addMin(d.einsatz,60));
  function calcAutoEnde(dd){const le=dd.rueck||dd.drehende||dd.anreiseEnde||"";return le?addMin(le,30):"";}
  let endeEd=!!(d.ende&&d.ende!==calcAutoEnde(d));
  function deriveFromEinsatz(){const e=val("d_einsatz");if(!anEd)g("d_anreise").value=e?addMin(e,30):"";if(!aeEd)g("d_anreiseEnde").value=e?addMin(e,60):"";if(!dbEd)g("d_drehbeginn").value=e?addMin(e,60):"";}
  function lastEnd(){return val("d_rueck")||val("d_drehende")||val("d_anreiseEnde")||"";}
  function computeEnde(){if(endeEd)return;const le=lastEnd();g("d_ende").value=le?addMin(le,30):"";}
  g("d_anreise").oninput=()=>{anEd=true;};
  g("d_anreiseEnde").oninput=()=>{aeEd=true;computeEnde();recalc();};
  g("d_drehbeginn").oninput=()=>{dbEd=true;recalc();};
  g("d_drehende").oninput=()=>{computeEnde();recalc();};
  g("d_rueckBeginn").oninput=()=>{};
  g("d_rueck").oninput=()=>{computeEnde();recalc();};
  g("d_einsatz").oninput=()=>{deriveFromEinsatz();computeEnde();recalc();};
  g("d_ende").oninput=()=>{endeEd=true;recalc();};
  if(hasDispo)g("useDispo").onclick=()=>{g("d_einsatz").value=dsp.einsatz||"";g("d_ende").value=dsp.ende||"";endeEd=true;anEd=aeEd=dbEd=false;applyAZ(false);applyAN(false);applyRK(false);deriveFromEinsatz();recalc();};
  function recalc(){
    const c=dayCalc({einsatz:val("d_einsatz"),ende:val("d_ende"),drehbeginn:val("d_drehbeginn"),drehende:val("d_drehende"),pause:tmpPause,uebernachtung:tmpUE,ausland:tmpAL});
    g("calc").innerHTML=`<div class="clbl">Rechnung</div>
      <div class="r">
        <div class="c"><div class="l">EZ</div><div class="n">${fmtMin(c.span)}</div></div>
        <div class="c"><div class="l">Dreh</div><div class="n">${fmtMin(c.az)}</div></div>
        <div class="c"><div class="l">− Pause</div><div class="n">${fmtMin(c.pause)}</div></div>
      </div><hr>
      <div class="r">
        <div class="c"><div class="l">Netto</div><div class="n">${fmtMin(c.netto)}</div></div>
        <div class="c"><div class="l">Soll</div><div class="n">${fmtMin(S.sollMin)}</div></div>
        <div class="c"><div class="l">Überstunden</div><div class="n big ${otClass(c.ot)}">${fmtSigned(c.ot)}</div></div>
      </div>`;
    const box=g("tgbox");const t=c.tg;
    if(t.state==="ok"){box.innerHTML=`<div class="tgbox ok"><div class="t"><span>Tagegeld: 28,00 €</span><span class="in">nur intern</span></div><div class="why">Abwesenheit ${fmtMin(c.absence)} h · über der Schwelle von ${fmtMin(S.abwesenheitMin)} h, eintägig, Inland. Bitte selbst prüfen.</div></div>`;}
    else{
      const why=t.state==="ue"?"Mehrtägige Reise mit Übernachtung: kein Tagegeld-Anspruch, das läuft über die Dienstreise-Abrechnung."
        :t.state==="ausland"?"Auslandsreise: Der Spesensatz ist Ländersache und wird über den Reisedienst abgerechnet – deshalb hier kein Betrag."
        :t.state==="under"?`Abwesenheit ${fmtMin(c.absence)} h liegt unter der Schwelle von ${fmtMin(S.abwesenheitMin)} h.`
        :"Zeiten eintragen.";
      box.innerHTML=`<div class="tgbox"><div class="t"><span>Kein Tagegeld</span><span class="in">nur intern</span></div><div class="why">${why}</div></div>`;
    }
  }
  const anNoneBtn=g("anNone"),rkNoneBtn=g("rkNone");
  function paintAZ(none){document.querySelectorAll("#azSeg button").forEach(b=>b.classList.toggle("on",(b.dataset.az==="1")===none));g("azFields").classList.toggle("hidden",none);}
  function applyAZ(none){paintAZ(none);g("d_drehbeginn").disabled=none;g("d_drehende").disabled=none;
    if(none){g("d_drehbeginn").value="";g("d_drehende").value="";dbEd=true;}
    else{const e=val("d_einsatz");dbEd=false;g("d_drehbeginn").value=e?addMin(e,60):"";g("d_drehende").value=e?addMin(e,480):"";}}
  function applyAN(none){anNoneBtn.classList.toggle("on",none);g("d_anreise").disabled=none;g("d_anreiseEnde").disabled=none;
    if(none){g("d_anreise").value="";g("d_anreiseEnde").value="";anEd=true;aeEd=true;}
    else{const e=val("d_einsatz");anEd=false;aeEd=false;g("d_anreise").value=e?addMin(e,30):"";g("d_anreiseEnde").value=e?addMin(e,60):"";}}
  function applyRK(none){rkNoneBtn.classList.toggle("on",none);g("d_rueckBeginn").disabled=none;g("d_rueck").disabled=none;
    if(none){g("d_rueckBeginn").value="";g("d_rueck").value="";}
    else{const rb=val("d_drehende")||addMin(val("d_einsatz"),480);g("d_rueckBeginn").value=rb;g("d_rueck").value=rb?addMin(rb,30):"";}}
  document.querySelectorAll("#azSeg button").forEach(b=>b.onclick=()=>{applyAZ(b.dataset.az==="1");computeEnde();recalc();});
  anNoneBtn.onclick=()=>{const none=!anNoneBtn.classList.contains("on");applyAN(none);computeEnde();recalc();};

/* ===== PDF Import ===== */
document.getElementById("pdfInput").addEventListener("change",async e=>{
  const file=e.target.files[0];e.target.value="";if(!file)return;
  if(typeof pdfjsLib==="undefined"){toast("PDF-Bibliothek nicht geladen (online sein)");return;}
  toast("PDF wird gelesen…");
  try{pdfjsLib.GlobalWorkerOptions.workerSrc="vendor/pdf.worker.min.js";
    const buf=await file.arrayBuffer();const pdf=await pdfjsLib.getDocument({data:buf}).promise;let text="",hints=null;
    for(let p=1;p<=pdf.numPages;p++){const pg=await pdf.getPage(p);const tc=await pg.getTextContent();
      const lines=[];tc.items.forEach(it=>{if(typeof it.str!=="string"||it.str===""||!it.transform)return;const x=it.transform[4],y=it.transform[5];let ln=lines.find(l=>Math.abs(l.y-y)<=4);if(!ln){ln={y,parts:[]};lines.push(ln);}ln.parts.push({x,w:it.width||0,s:it.str});});
      lines.sort((a,b)=>b.y-a.y);
      /* Teile nur bei echter Lücke (>1pt) mit Leerzeichen verbinden – PDFs zerlegen
         Wörter/Nummern oft in berührende Stücke ("A"+"2748455", "455"+"11333") */
      const pageText=lines.map(l=>{const ps=l.parts.sort((a,b)=>a.x-b.x);let s="",end=null;ps.forEach(p=>{if(end!==null&&p.x-end>1)s+=" ";s+=p.s;end=p.x+p.w;});return s;}).join(" ");
      text+=(pageText||tc.items.map(i=>i.str).join(" "))+" ";
      if(p===1)hints=labelHints(tc.items);}
    const meta=parseZDF(text);
    if(hints){if(hints.titel)meta.titel=hints.titel;if(hints.ort)meta.produktionsort=hints.ort;}
    confirmImport(meta,file.name);
  }catch(err){console.error(err);toast("PDF konnte nicht gelesen werden");}
});
function clean(s){return String(s||"").replace(/\s+/g," ").trim();}
function cleanName(n){return clean(n).replace(/\s*\.{2,3}\s*$/,"").replace(/\s+,/,",").trim();}
/* Spaltenwerte direkt unter den Formular-Labels lesen (Seite 1).
   Titel/Produktionsort stehen im ZDF-Formular exakt unter ihrer Beschriftung –
   zuverlässiger als jede Fließtext-Heuristik (17/25 Ort-Fehlschläge im Real-Korpus). */
function labelHints(items){
  const its=[];items.forEach(it=>{if(typeof it.str!=="string"||!it.str.trim()||!it.transform)return;its.push({s:it.str,x:it.transform[4],y:it.transform[5],w:it.width||0});});
  const find=re=>its.find(i=>re.test(i.s.trim()));
  const grab=(lab,xEnd)=>{
    if(!lab)return "";
    const cand=its.filter(i=>i.y<lab.y-3&&i.y>lab.y-30&&i.x>=lab.x-2&&i.x<xEnd-2&&!/^(Personalleistung|Personal-Disposition|Auftragsbemerkung)/.test(i.s.trim()));
    cand.sort((a,b)=>b.y-a.y||a.x-b.x);
    let s="",end=null,lastY=null;
    cand.forEach(c=>{if(lastY!==null&&Math.abs(c.y-lastY)>3){s+=" ";end=null;}if(end!==null&&c.x-end>1)s+=" ";s+=c.s;end=c.x+c.w;lastY=c.y;});
    return clean(s);
  };
  const tit=find(/^Titel$/),pn=find(/^Prod\.?\s*Nummer$/),ort=find(/^Produktionsort$/),send=find(/^SendeRedaktion$/);
  return { titel:grab(tit,pn?pn.x:Infinity), ort:grab(ort,send?send.x:Infinity) };
}
function parseMeta(t){
  const o={titel:"",auftragsnr:"",prodNummer:"",kostentraeger:"",produktionsort:""};let m;
  if(m=t.match(/Auftrag\s+(A\d{6,8})/i))o.auftragsnr=m[1];
  o.kostentraeger=(t.match(/KTDL:?\s*(\d{6,9})/i)||[])[1]||(t.match(/\b(80\d{6})\b/)||[])[1]||"";
  const nums=[...t.matchAll(/\b(\d{8})\b/g)].map(x=>x[1]);
  o.prodNummer=nums.find(n=>n!==o.kostentraeger)||"";
  if(m=t.match(/(?:Kostenträger DL|Telefon|\/Tel\.|\bDL)\s+([A-ZÄÖÜ][\wäöüßÄÖÜ0-9 .,\/\-]{2,50}?)\s+\d{8}\b/))o.titel=clean(m[1]);
  if(!o.titel&&o.prodNummer){const mm=t.match(new RegExp("([A-ZÄÖÜ][\\wäöüßÄÖÜ0-9 .,/&'\\-]{2,48}?)\\s+"+o.prodNummer+"\\b"));if(mm){let c=clean(mm[1]).replace(/.*\b(?:DL|Telefon|Tel\.|Nummer|Produktion)\s+/,"");o.titel=c;}}
  if(m=t.match(/Redakteur(?:\/Tel\.|\s+Telefon)\s+([A-ZÄÖÜ][\wäöüßÄÖÜ0-9 .\-]{2,40}?)\s+(?:Hauptredaktion|Redaktion|SendeRedaktion|Personalleistung|Ereignis)/))o.produktionsort=clean(m[1]);
  return o;
}
function parsePersons(t){
  const year=(t.match(/\d{2}\.\d{2}\.(20\d{2})/)||[])[1]||(t.match(/\b(20\d{2})\b/)||[])[1]||(new Date().getFullYear()+"");
  const sec=t.search(/Personal-Disposition|Personalleistung/);const body=sec>=0?t.slice(sec):t;
  const nameRe=/[A-ZÄÖÜ][A-Za-zäöüßÄÖÜ-]+,\s+[A-ZÄÖÜ][A-Za-zäöüßÄÖÜ]*\.{0,3}/g;
  const stops=/(Kamera\/Geräte|Kamera-|Dienstbeginn|Bemerkungen|KFZ|Seite \d|Personal-Disposition|Aktualisierungszeitpunkt)/;
  const anchors=[];let m;
  while(m=nameRe.exec(body))anchors.push({name:m[0],end:m.index+m[0].length,start:m.index});
  const persons={};const order=[];
  anchors.forEach((a,i)=>{
    let end=i+1<anchors.length?anchors[i+1].start:body.length;
    const rest=body.slice(a.end,end),st=rest.search(stops);
    if(st>=0)end=a.end+st;
    const slice=body.slice(a.end,end);
    const dm=slice.match(/(\d{2})\.(\d{2})\./);
    const times=[...slice.matchAll(/(\d{1,2}:\d{2})/g)].map(x=>x[1]);
    if(!dm||!times.length)return;
    const iso=year+"-"+dm[2]+"-"+dm[1];
    const einsatz=times[0].padStart(5,"0"),ende=times[times.length-1].padStart(5,"0");
    let anreise="",rueck="";if(times.length>=4){anreise=times[1].padStart(5,"0");rueck=times[2].padStart(5,"0");}
    const nm=cleanName(a.name);
    if(!persons[nm]){persons[nm]={name:nm,days:[],seen:new Set()};order.push(nm);}
    const key=iso+einsatz;
    if(!persons[nm].seen.has(key)){persons[nm].seen.add(key);persons[nm].days.push({datum:iso,einsatz,ende,anreise,rueck});}
  });
  return order.map(n=>({name:persons[n].name,days:persons[n].days.sort((x,y)=>(x.datum+x.einsatz).localeCompare(y.datum+y.einsatz))}));
}
function parseZDF(raw){const t=clean(raw);const meta=parseMeta(t);meta.persons=parsePersons(t);return meta;}

let impData,impSel;
function confirmImport(p,fname){
  impData=p;const persons=p.persons||[];
  /* Vorauswahl anhand "Dein Name" (Nachname) – macht die App kollegen-tauglich */
  const meNachname=clean(S.absender).split(/\s+/).pop()||"";
  impSel=meNachname?persons.findIndex(x=>x.name.toLowerCase().includes(meNachname.toLowerCase())):-1;
  if(impSel<0)impSel=persons.length?0:-1;
  let impTrip=null,tripTouched=false;
  const defTrip=()=>"ein";
  openSheet(`<h3>Import bestätigen</h3>
    <p class="note" style="margin:-8px 0 16px">Aus <b style="color:var(--accent-ink)">${esc(fname||"PDF")}</b> erkannt. Bitte prüfen und korrigieren.</p>
    <div class="field"><label>Titel</label><input type="text" class="txt" id="i_titel" value="${esc(p.titel||"")}" placeholder="Titel eintragen"></div>
    <div class="two"><div class="field"><label>Auftrags-Nr.</label><input type="text" id="i_anr" value="${esc(p.auftragsnr||"")}"></div><div class="field"><label>Prod.-Nr.</label><input type="text" id="i_pnr" value="${esc(p.prodNummer||"")}"></div></div>
    <div class="two"><div class="field"><label>Kostenträger</label><input type="text" id="i_kt" value="${esc(p.kostentraeger||"")}"></div><div class="field"><label>Produktionsort</label><input type="text" class="txt" id="i_ort" value="${esc(p.produktionsort||"")}"></div></div>
    ${persons.length?`<div class="section-h" style="margin:18px 0 8px"><h3>Personen im PDF</h3></div>
    <div class="chips" id="i_persons">${persons.map((x,i)=>`<button type="button" data-i="${i}">${esc(x.name)} · ${x.days.length} ${x.days.length===1?"Tag":"Tage"}</button>`).join("")}</div>
    <p class="note">Vorauswahl folgt „Dein Name" aus den Einstellungen.</p>
    <div class="field" style="margin-top:12px"><label>Name (für Nachweis)</label><input type="text" class="txt" id="i_name" value=""></div>`:`<p class="note">Keine Personen erkannt – du kannst den Auftrag trotzdem anlegen und Tage manuell erfassen.</p>`}
    <div class="section-h" style="margin:18px 0 8px"><h3>Reiseart</h3></div>
    <div class="toggles" id="i_trip"><button data-t="ein">Einzeltage</button><button data-t="mehr">Mehrtägig</button></div>
    <div class="rnote"><b>Einzeltage</b> · jeden Tag hin &amp; zurück, ohne Übernachtung – Tagegeld je Tag möglich.<br><b>Mehrtägig</b> · Anreise am ersten, Rückreise am letzten Tag, Übernachtung vorbelegt – dann kein Tagegeld-Anspruch (läuft über die Dienstreise-Abrechnung). Dreh- und Reisezeiten passt du danach je Tag an.</div>
    <div class="section-h" style="margin:18px 0 4px"><h3>Tagesvorschau</h3></div>
    <div class="implist" id="i_days"></div>
    <button class="btn" id="doImport" style="margin-top:16px">Importieren</button><button class="btn ghost" id="cancelImport" style="margin-bottom:0">Abbrechen</button>`);
  function paint(){
    document.querySelectorAll("#i_persons button").forEach(b=>b.classList.toggle("on",+b.dataset.i===impSel));
    const sel=persons[impSel];const days=sel?sel.days:[];
    const dl=document.getElementById("i_days");
    dl.innerHTML=days.length?days.map(d=>{
      const c=dayCalc({einsatz:d.einsatz,ende:d.ende,pause:true});
      return `<div class="irow"><div class="d">${fmtDayC(d.datum)}<small>EZ ${d.einsatz||"?"}–${d.ende||"?"}</small></div><div class="o ${otClass(c.ot)}">${fmtSigned(c.ot)}</div></div>`;
    }).join(""):'<p class="note">Keine Tage erkannt.</p>';
    const nm=document.getElementById("i_name");if(nm&&sel)nm.value=sel.name;
    if(!tripTouched)impTrip=defTrip();
    document.querySelectorAll("#i_trip button").forEach(b=>b.classList.toggle("on",b.dataset.t===impTrip));
    const di=document.getElementById("doImport");if(di)di.textContent=days.length?`Importieren · ${days.length} ${days.length===1?"Tag":"Tage"}`:"Importieren";
  }
  if(persons.length){document.querySelectorAll("#i_persons button").forEach(b=>b.onclick=()=>{impSel=+b.dataset.i;paint();});}
  document.querySelectorAll("#i_trip button").forEach(b=>b.onclick=()=>{impTrip=b.dataset.t;tripTouched=true;document.querySelectorAll("#i_trip button").forEach(x=>x.classList.toggle("on",x.dataset.t===impTrip));});
  paint();
  document.getElementById("cancelImport").onclick=closeSheet;
  document.getElementById("doImport").onclick=()=>{
    const sel=persons[impSel];
    const src=(sel?sel.days:[]).slice().sort((a,b)=>((a.datum||"")+(a.einsatz||"")).localeCompare((b.datum||"")+(b.einsatz||"")));
    const mehr=impTrip==="mehr";const last=src.length-1;
    const days=src.map((d,i)=>({id:uid(),datum:d.datum,einsatz:d.einsatz,
      anreise:d.anreise||(((!mehr||i===0)&&d.einsatz)?addMin(d.einsatz,30):""),
      anreiseEnde:"",
      drehbeginn:d.einsatz?addMin(d.einsatz,60):"",
      drehende:d.ende?addMin(d.ende,-60):"",
      rueckBeginn:"",
      rueck:d.rueck||(((!mehr||i===last)&&d.ende)?addMin(d.ende,-30):""),
      ende:d.ende,pause:true,uebernachtung:mehr,ausland:false,dispo:{einsatz:d.einsatz,ende:d.ende}}));
    const no={id:uid(),titel:val("i_titel"),auftragsnr:val("i_anr"),prodNummer:val("i_pnr"),kostentraeger:val("i_kt"),produktionsort:val("i_ort"),mitarbeiter:val("i_name"),days};
    DB.orders.push(no);persist();state.orderId=no.id;state.tab="orders";closeSheet();render();toast(days.length?days.length+" Tag(e) importiert – bitte prüfen!":"Auftrag angelegt");
  };
}

/* ===== Utils ===== */
function val(id){return (document.getElementById(id)||{}).value||"";}
function esc(s){return String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
let toastT;function toast(m){const el=document.getElementById("toast");el.textContent=m;el.classList.add("on");clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove("on"),2600);}
/* kind="go" = nicht-destruktiv (Amber), sonst destruktiv (Rot) */
function askConfirm(msg,onYes,yesLabel,kind){const el=document.getElementById("confirmBox");el.querySelector(".ctitle").textContent=(yesLabel||"Löschen")+"?";el.querySelector(".cmsg").textContent=msg;el.classList.remove("out");el.classList.add("on");const yes=document.getElementById("cYes"),no=document.getElementById("cNo");yes.textContent=yesLabel||"Löschen";yes.classList.toggle("go",kind==="go");const close=()=>{el.classList.add("out");setTimeout(()=>{el.classList.remove("on","out");},150);yes.onclick=null;no.onclick=null;};yes.onclick=()=>{close();onYes();};no.onclick=close;}
if("serviceWorker" in navigator&&(location.protocol==="https:"||location.hostname==="localhost"))navigator.serviceWorker.register("sw.js").catch(()=>{});
applyTheme();
render();
</script>
