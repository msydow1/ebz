<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Zeiterfassung">
<meta name="theme-color" content="#15171A">
<title>Zeiterfassung</title>
<!-- Zeiterfassung V4.3.1 · Design "Amber Editorial" -->
<!-- impeccable-disable single-font -- Nutzer wählte beim V1.2-Redesign bewusst "Inter durchgängig" (eine Familie, tabular-nums für Zeiten) -->
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link href="vendor/inter.css" rel="stylesheet">
<script src="vendor/pdf.min.js"></script>
<script src="vendor/jspdf.umd.min.js"></script>
<style>
/* ===== Tokens (Handoff "Amber Editorial") ===== */
:root{--bg:#15171A;--surface:#1E2228;--surface-2:#262B31;--field:#22262C;--field-input:#34393F;--line:#2A2F35;--line-strong:#3A4048;--text:#E8E8E8;--text-strong:#FFFFFF;--muted:#8A9099;--silver:#C3C3C3;--faint:#6E747B;--accent:#FA7D19;--accent-soft:rgba(250,125,25,.14);--accent-line:rgba(250,125,25,.28);--accent-ink:#B8925F;--pos:#54BE86;--pos-soft:rgba(84,190,134,.14);--pos-line:rgba(84,190,134,.40);--info:#6B87A2;--info-soft:rgba(107,135,162,.14);--info-line:rgba(107,135,162,.32);--danger:#E0705C;--on-accent:#15171A;--glow:0 8px 24px rgba(250,125,25,.30);--cardshadow:none;--holo-1:#FA7D19;--holo-2:#FFC08A;--holo-3:#F2A9CF;--holo-4:#B6A8F4;--holo-5:#8ED8EA}
body.light{--bg:#F5F4F1;--surface:#FFFFFF;--surface-2:#EFEDE8;--field:#E9E7E1;--field-input:#E9E7E1;--line:#DEDBD3;--line-strong:#C9C5BC;--text:#28251F;--text-strong:#141210;--muted:#7A756C;--silver:#545048;--faint:#9B968C;--accent:#E86F0C;--accent-soft:rgba(232,111,12,.12);--accent-line:rgba(232,111,12,.30);--accent-ink:#B07A3C;--pos:#1E9E60;--pos-soft:rgba(30,158,96,.12);--pos-line:rgba(30,158,96,.45);--info:#49688C;--info-soft:rgba(73,104,140,.10);--info-line:rgba(73,104,140,.30);--danger:#C24E3B;--on-accent:#FFFFFF;--glow:0 8px 24px rgba(232,111,12,.32);--cardshadow:0 2px 14px rgba(0,0,0,.05);--holo-1:#E86F0C;--holo-2:#E8955A;--holo-3:#C9679D;--holo-4:#7C6AD0;--holo-5:#3C9DB8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;max-width:100%;overflow-x:hidden}
body{background:var(--bg);color:var(--text);font-family:"Inter",-apple-system,system-ui,sans-serif;font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
.app{max-width:560px;margin:0 auto;min-height:100vh}
/* Bar */
.bar{position:sticky;top:0;z-index:30;background:rgba(21,23,26,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:calc(env(safe-area-inset-top) + 14px) 20px 12px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;min-height:58px}
body.light .bar{background:rgba(245,244,241,.85)}
/* Logo V4.0 (Richtung 3c "Spanne Hologramm"): Zeiger auf Dienstbeginn in currentColor, Bogen = gelaufene Zeit */
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0;color:var(--text)}
.brand svg{width:28px;height:28px;flex:none;display:block}
.brand-name{font-weight:700;font-size:16px;line-height:1;letter-spacing:-.3px;color:var(--text-strong);white-space:nowrap}
.eyebrow{font-size:9px;font-weight:600;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted)}
.iconbtn{width:36px;height:36px;border-radius:10px;border:none;background:transparent;color:var(--muted);display:flex;align-items:center;justify-content:center;flex:none;padding:0}
.iconbtn:active{background:var(--surface)}
.backlink{background:none;border:none;color:var(--accent);font-family:inherit;font-size:13px;font-weight:600;padding:0}
/* View */
.view{padding:22px 20px calc(env(safe-area-inset-bottom) + 44px);animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.pagehead{margin-bottom:16px}
.display{font-weight:800;font-size:32px;letter-spacing:-1px;line-height:1.05;color:var(--text-strong);margin-top:6px}
.dtitle{font-weight:800;font-size:27px;letter-spacing:-.7px;line-height:1.12;color:var(--text-strong);margin-top:6px}
/* KPI-Kacheln */
.kpis{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:0 0 14px}
.kpis.two{grid-template-columns:1fr 1fr}
.kpis.verd .kpi{display:flex;flex-direction:column;justify-content:space-between}
.kpis.verd .kpi .n{font-size:19px;white-space:nowrap}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:13px 12px;min-width:0}
.kpi .l{font-size:9px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted)}
.kpi .n{font-weight:800;font-size:22px;margin-top:3px;color:var(--text-strong)}
.kpi.acc{background:var(--accent-soft);border-color:var(--accent-line)}
.kpi.acc .l{color:var(--accent-ink)}
.kpi.posk{background:var(--pos-soft);border-color:var(--pos-line)}
.kpi.posk .n{color:var(--pos)}
.kpi.warnk{border-color:var(--danger)}
.kpi.warnk .l,.kpi.warnk .n{color:var(--danger)}
.kpi.warnk .l{letter-spacing:.8px;white-space:nowrap}/* "Über Vertrag" passt so auch bei 375 px in eine Zeile */
.vbar{display:flex;height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin:-6px 0 14px}
.vbar span{display:block;height:100%}
.vbar .g{background:var(--accent)}
.vbar .d{background:var(--accent-line)}
.note.vline{margin:-6px 0 14px}
.vwarn{color:var(--danger);font-weight:700;white-space:nowrap}
/* Hero */
.hero{background:linear-gradient(135deg,var(--accent-soft),transparent);border:1px solid var(--accent-line);border-radius:16px;padding:22px 18px;margin-bottom:14px}
.hero .l{font-size:9px;font-weight:600;letter-spacing:1.4px;text-transform:uppercase;color:var(--accent-ink)}
.hero .n{font-weight:800;font-size:46px;letter-spacing:-1.5px;line-height:1.05;margin-top:4px;color:var(--text-strong)}
.hero.small{padding:16px 18px}
.hero.small .n{font-size:30px;letter-spacing:-1px}
.hero .hsub{font-size:12px;font-weight:500;color:var(--muted);margin-top:6px}
/* Segment-Tabs */
.segs{display:flex;background:var(--field);border-radius:12px;padding:4px;margin:0 0 18px}
.segs button{flex:1;padding:10px 0;border:none;border-radius:9px;background:transparent;color:var(--muted);font-family:inherit;font-size:13px;font-weight:700}
.segs button.on{background:var(--accent);color:var(--on-accent)}
/* Auftragskarten */
.cards{background:var(--surface);border-radius:14px;overflow:hidden;box-shadow:var(--cardshadow);margin-bottom:10px}
.cards.done{background:var(--surface-2);box-shadow:none}
.card{padding:16px;border-bottom:1px solid var(--line);cursor:pointer}
.card:last-child{border-bottom:none}
.card:active{background:var(--surface-2)}
.card .eyeline{font-size:9px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.card .toprow{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.card .titel{font-weight:700;font-size:16px;letter-spacing:-.3px;line-height:1.25;color:var(--text-strong);margin:0;min-width:0}
.card .num{font-weight:800;font-size:20px;flex:none}
.cardgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;border-top:1px solid var(--line);margin-top:12px;padding-top:12px}
.cardgrid .l{font-size:9px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted)}
.cardgrid .v{font-weight:700;font-size:15px;margin-top:2px;color:var(--text-strong)}
.cardgrid.big .v{font-size:16px}
.cardfoot{font-size:11px;font-weight:500;color:var(--faint);margin-top:12px}
.cards.done .titel{color:var(--muted)}
.cards.done .num{color:var(--faint)!important}
/* Sektionen + Zeilen */
.section-h{display:flex;align-items:baseline;justify-content:space-between;margin:24px 0 4px}
.section-h h3{font-weight:700;font-size:12px;margin:0;letter-spacing:.5px;text-transform:uppercase;color:var(--faint)}
.section-h .tot{font-size:12px;font-weight:600;color:var(--silver)}
.srow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 0;border-bottom:1px solid var(--line)}
.srow .nm{font-size:15px;font-weight:700;color:var(--text-strong);margin:0;min-width:0}
.srow .nm small{display:block;font-size:12px;font-weight:500;color:var(--faint);margin-top:2px}
.srow .v{font-weight:800;font-size:18px;flex:none}
.srow .chev{color:var(--line-strong);font-size:15px;flex:none}
.srow.dim .nm{color:var(--muted)}
.srow.dim .v{color:var(--faint)!important}
/* Tageszeilen */
.day{padding:14px 0;border-bottom:1px solid var(--line);cursor:pointer}
.day .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.day .date{font-weight:700;font-size:15px;color:var(--text-strong)}
.day .ot{font-weight:800;font-size:16px}
.dayDel{width:30px;height:30px;border-radius:8px;border:none;background:transparent;color:var(--danger);display:flex;align-items:center;justify-content:center;flex:none;padding:0}
.dayDel:active{background:rgba(224,112,92,.15)}
.day .line{font-size:12px;font-weight:500;color:var(--silver);margin-top:4px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
/* Key/Value */
.kv{margin:14px 0 0}
.kv .row{display:flex;justify-content:space-between;gap:14px;padding:9px 0;border-bottom:1px solid var(--line)}
.kv .k{font-size:12px;font-weight:500;color:var(--muted);flex:none}
.kv .w{font-size:13px;font-weight:500;color:var(--silver);text-align:right;min-width:0;overflow-wrap:anywhere}
/* Buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:16px;border-radius:14px;border:none;font-family:inherit;font-size:15px;font-weight:700;background:var(--accent);color:var(--on-accent);box-shadow:var(--glow);margin-bottom:10px}
.btn:active{filter:brightness(.94)}
.btn:disabled{opacity:.4;cursor:default;filter:none}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line-strong);box-shadow:none;font-weight:600;padding:13px;border-radius:12px}
.btn.ghost:active{background:var(--surface);filter:none}
.btn.danger{background:transparent;color:var(--danger);border:1px solid rgba(224,112,92,.4);box-shadow:none;font-weight:600;padding:13px;border-radius:12px}
body.light .btn.danger{border-color:rgba(194,78,59,.4)}
.btn.info{background:var(--info);color:#fff;box-shadow:none;border-radius:8px;padding:9px;font-size:12px;margin:0}
.btnrow{display:flex;gap:10px}
.btnrow .btn{margin-bottom:10px}
.sub{font-size:11px;color:var(--faint);text-align:center;margin:2px 0 18px;line-height:1.5}
/* Chips */
.chip{font-size:10px;font-weight:600;padding:3px 8px;border-radius:7px;background:var(--field);color:var(--muted);border:1px solid var(--line);flex:none}
.chip.pos{background:var(--pos-soft);border-color:var(--pos-line);color:var(--pos)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{border:1px solid var(--line);background:var(--field);color:var(--muted);font-family:inherit;font-size:12px;font-weight:600;padding:9px 11px;border-radius:8px}
.chips button.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
/* Farbcodierung */
.ot-pos{color:var(--pos)!important}
.ot-zero{color:var(--muted)!important}
.ot-neg{color:var(--info)!important}
/* Backup-Banner */
.remind{border:1px solid var(--info-line);background:var(--info-soft);border-radius:12px;padding:13px 14px;margin:0 0 16px}
.remind b{display:block;font-size:12px;font-weight:600;color:var(--info);margin-bottom:3px}
.remind p{margin:0 0 10px;font-size:11px;color:var(--silver);line-height:1.5}
.remind .btn.ghost{margin:0;padding:9px;font-size:12px;border-radius:8px}
/* Sheet */
.scrim{position:fixed;inset:0;background:rgba(10,9,8,.55);z-index:50;display:none;backdrop-filter:blur(3px)}
.scrim.on{display:block;animation:fadein .25s ease}
.scrim.out{animation:fadeout .2s ease forwards}
.sheet{position:absolute;left:0;right:0;bottom:0;margin:0 auto;background:var(--bg);width:auto;max-width:560px;border-radius:22px 22px 0 0;border-top:1px solid var(--line-strong);max-height:92vh;overflow-y:auto;overflow-x:hidden;padding:10px 20px calc(env(safe-area-inset-bottom) + 44px);animation:up .3s cubic-bezier(.2,.8,.2,1)}
.sheet.out{animation:down .2s ease forwards}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@keyframes down{to{transform:translateY(100%)}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes fadeout{to{opacity:0}}
.grip{width:38px;height:5px;border-radius:3px;background:var(--line-strong);margin:8px auto 18px}
.sheet h3{font-weight:800;font-size:26px;letter-spacing:-.7px;margin:0 0 18px;color:var(--text-strong)}
/* Section-Label im Sheet darf nicht vom Sheet-Titel-Stil überschrieben werden */
.sheet .section-h h3{font-weight:700;font-size:12px;letter-spacing:.5px;text-transform:uppercase;color:var(--faint);margin:0}
/* Felder */
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;font-weight:600}
.field input,.field textarea{width:100%;min-width:0;max-width:100%;-webkit-appearance:none;appearance:none;padding:12px 13px;border-radius:10px;border:1px solid var(--line-strong);background:var(--field-input);color:var(--text-strong);font-family:inherit;font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.field textarea{resize:none;line-height:1.5;font-variant-numeric:normal}
.field input.txt{font-variant-numeric:normal}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--accent-line);background:var(--surface-2)}
.field input:disabled{opacity:.4}
.field select{width:100%;min-width:0;max-width:100%;-webkit-appearance:none;appearance:none;padding:12px 34px 12px 13px;border-radius:10px;border:1px solid var(--line-strong);background-color:var(--field-input);color:var(--text-strong);font-family:inherit;font-size:15px;font-weight:600;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 52%,calc(100% - 13px) 52%;background-size:5px 5px,5px 5px;background-repeat:no-repeat}
.field select:focus{outline:none;border-color:var(--accent-line)}
.field select:disabled{opacity:.4}
.field input[type="date"]::-webkit-calendar-picker-indicator{filter:invert(.6) sepia(1) saturate(2.2) hue-rotate(348deg);opacity:.9}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
/* Timeboxen */
.timebox{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.timebox.acc{background:var(--accent-soft);border-color:var(--accent-line)}
.timebox .tl{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:9px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);margin-bottom:12px}
.timebox.acc .tl{color:var(--accent-ink)}
.timebox .tl .hint{font-size:10px;font-weight:500;letter-spacing:0;text-transform:none;color:var(--muted)}
.tfield{background:var(--field-input);border:1px solid var(--line-strong);border-radius:10px;padding:7px 6px 5px;text-align:center;min-width:0}
.timebox.acc .tfield{background:var(--surface)}
.tfield .tlbl{display:block;font-size:9px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted)}
.tfield input{width:100%;min-width:0;border:none;background:transparent;color:var(--text-strong);font-family:inherit;font-size:19px;font-weight:700;text-align:center;padding:2px 0 0;font-variant-numeric:tabular-nums;-webkit-appearance:none;appearance:none}
.tfield input:focus{outline:none}
.tfield input:disabled{color:var(--faint);opacity:1}
/* Native Uhr-Symbol raus: kostet Breite (RZ-Felder wurden abgeschnitten) und der Handoff zeigt reine Zahlen */
.tfield input::-webkit-calendar-picker-indicator{display:none;-webkit-appearance:none}
.tfield input::-webkit-date-and-time-value{text-align:center}
/* RZ: Anreise und Rückreise untereinander, damit "09:30" auf 375px voll lesbar bleibt */
.rzblock+.rzblock{margin-top:12px}
.rzblock .two{gap:10px}
.nrow{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.rlbl{font-size:11px;font-weight:600;color:var(--muted)}
/* Mini-Segment + entfällt */
.mseg{display:flex;background:var(--field);border-radius:8px;padding:3px;gap:2px}
.timebox.acc .mseg{background:var(--surface)}
.mseg button{border:none;background:transparent;color:var(--muted);font-family:inherit;font-size:10px;font-weight:700;padding:5px 9px;border-radius:6px;letter-spacing:0;text-transform:none}
.mseg button.on{background:var(--surface-2);color:var(--text-strong)}
.offbtn{border:1px solid var(--line);background:var(--field);color:var(--muted);font-family:inherit;font-size:10px;font-weight:700;padding:4px 9px;border-radius:7px}
.offbtn.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
/* Ja/Nein-Segmente */
.toggles{display:flex;background:var(--field);border-radius:10px;padding:4px;gap:4px}
.toggles button{flex:1;padding:10px 4px;border-radius:7px;border:none;background:transparent;color:var(--muted);font-family:inherit;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
.toggles button.on{background:var(--accent);color:var(--on-accent)}
.toggles button.on[data-p="0"],.toggles button.on[data-u="0"],.toggles button.on[data-a="0"],.toggles button.on[data-v="0"]{background:var(--surface);color:var(--text-strong)}
/* Calc-Kachel */
.calc{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:4px 0 12px}
.calc .clbl{font-size:9px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.calc .r{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.calc hr{border:none;height:1px;background:var(--line);margin:11px 0}
.calc .c .l{font-size:9px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;color:var(--muted)}
.calc .c .n{font-weight:700;font-size:16px;margin-top:2px;color:var(--text-strong)}
.calc .c .n.big{font-size:17px;font-weight:800}
.calc .tarifz{font-size:12px;font-weight:600;color:var(--silver)}
/* Tagegeld-Box */
.tgbox{border-radius:12px;padding:13px 15px;margin:2px 0 4px;background:var(--surface);border:1px solid var(--line)}
.tgbox .t{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:13px;font-weight:700;color:var(--muted)}
.tgbox .t .in{font-size:11px;font-weight:500;color:var(--muted)}
.tgbox .why{font-size:11px;font-weight:500;color:var(--silver);margin-top:4px;line-height:1.5}
.tgbox.ok{background:var(--pos-soft);border-color:var(--pos-line)}
.tgbox.ok .t{color:var(--pos)}
/* Dispo-Zeile */
.dispoinfo{font-size:12px;color:var(--silver);background:var(--info-soft);border:1px solid var(--info-line);border-radius:10px;padding:9px 12px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.dispoinfo button{background:var(--info);border:none;color:#fff;font-family:inherit;font-size:11px;font-weight:600;padding:5px 10px;border-radius:7px;flex:none}
/* Einstellungen */
.setrow{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;background:var(--surface);border:none;border-radius:12px;padding:14px 15px;margin-bottom:8px;font-family:inherit;font-size:14px;font-weight:600;color:var(--text-strong);text-align:left}
.setrow:active{background:var(--surface-2)}
.setrow>span:first-child{flex:1;min-width:0}
.setrow small{display:block;font-size:11px;font-weight:500;color:var(--faint);margin-top:2px}
.setrow .chev{color:var(--line-strong);font-size:15px;flex:none}
.setcard{background:var(--surface);border-radius:12px;padding:14px 15px;margin-bottom:8px}
.setcard .stat{font-size:12px;font-weight:500;color:var(--silver);margin-bottom:10px}
.setcard .field:last-of-type{margin-bottom:0}
/* Anleitung */
.hsec{background:var(--surface);border-radius:14px;padding:16px;margin-bottom:10px}
.hsec .eb{font-size:9px;font-weight:600;letter-spacing:1.4px;text-transform:uppercase;color:var(--accent-ink);margin-bottom:8px}
.hsec p{margin:0 0 10px;font-size:13px;font-weight:500;line-height:1.65;color:var(--silver)}
.hsec p:last-child{margin-bottom:0}
.hsec .tip{background:var(--field);border-radius:10px;padding:10px 12px;font-size:12.5px;color:var(--muted);margin-top:12px}
.hsec b{color:var(--text-strong);font-weight:600}
/* Import-Vorschau */
.implist .irow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.implist .irow .d{font-size:14px;font-weight:700;color:var(--text-strong)}
.implist .irow .d small{display:block;font-size:11px;font-weight:500;color:var(--silver);margin-top:2px}
.implist .irow .o{font-weight:800;font-size:15px;flex:none}
.rnote{border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:11px;line-height:1.6;color:var(--faint);margin-top:8px}
.rnote b{color:var(--silver);font-weight:600}
/* Dialog */
.cscrim{position:fixed;inset:0;background:rgba(10,9,8,.62);z-index:120;display:none;align-items:center;justify-content:center;padding:24px;backdrop-filter:blur(3px)}
.cscrim.on{display:flex;animation:fadein .25s ease}
.cscrim.out{animation:fadeout .15s ease forwards}
.cdlg{background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:20px;max-width:300px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.5);animation:pop .25s cubic-bezier(.2,.8,.2,1)}
.cscrim.out .cdlg{animation:popout .15s ease forwards}
@keyframes pop{from{opacity:0;transform:scale(.95) translateY(8px)}}
@keyframes popout{to{opacity:0;transform:scale(.97)}}
.cdlg .ctitle{font-size:17px;font-weight:700;color:var(--text-strong);margin:0 0 8px}
.cdlg .cmsg{margin:0 0 16px;font-size:13px;line-height:1.5;color:var(--silver)}
.crow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.crow .btn{margin:0;padding:12px;font-size:13px}
.crow .btn.do{background:var(--danger);color:#fff;border:none;box-shadow:none;font-weight:700;border-radius:12px}
/* Nicht-destruktive Bestätigung (z. B. Reiseart umstellen): Amber statt Rot */
.crow .btn.do.go{background:var(--accent);color:var(--on-accent)}
/* Toast */
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 46px);transform:translateX(-50%) translateY(20px);width:min(520px,calc(100% - 40px));background:var(--field);border:1px solid var(--accent-line);color:var(--text);padding:13px 15px;border-radius:12px;font-size:12px;font-weight:600;text-align:center;z-index:80;opacity:0;transition:.3s;pointer-events:none;box-shadow:0 10px 40px rgba(0,0,0,.4)}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
/* Sonstiges */
.note{font-size:11px;color:var(--faint);line-height:1.5;margin:8px 0 0}
.note b{color:var(--muted);font-weight:600}
.divider{height:1px;background:var(--line);margin:18px 0}
.hidden{display:none!important}
.empty{text-align:center;color:var(--muted);padding:56px 20px}
.empty .big{font-size:40px;margin-bottom:12px}
.empty p{font-size:14px;font-weight:500;line-height:1.6;margin:0}
.foot{text-align:center;padding:10px 20px calc(env(safe-area-inset-bottom) + 18px)}
.foot-note{font-size:10.5px;color:var(--faint);line-height:1.5}
.foot-v{font-size:11px;font-weight:600;color:var(--faint);margin-top:8px}
.foot-v b{color:var(--accent);font-weight:700}
@media (prefers-reduced-motion:reduce){.view,.scrim,.scrim.on,.scrim.out,.sheet,.sheet.out,.cscrim.on,.cscrim.out,.cdlg,.cscrim.out .cdlg,.toast{animation-duration:0s!important;transition-duration:0s!important}}

<script>

const Store={mem:{},load(){try{const r=localStorage.getItem(KEY);return r?JSON.parse(r):null}catch(e){return this.mem[KEY]||null}},save(o){try{localStorage.setItem(KEY,JSON.stringify(o))}catch(e){this.mem[KEY]=o}}};

const S=DB.settings;
/* Soll nach Tarif: PdTV Ziffer 6.2 i. V. m. Verguetungs-TV 2024-2026 § 6, seit 01.01.2026 7,7 Std = 462 Min ohne Pause.

S.sollMin??=462; if(S.sollMin===450&&S.sollEigen!==450)S.sollMin=462; S.standardPause??=30; S.abwesenheitMin??=480; S.email??=""; S.absender??=""; S.empfaenger??=""; S.theme??="dark";
S.status??="frei"; S.flink30??=390; S.flink45??=585;  /* FLINK-Schwellen: 6:30 und 9:45 */

/* Aus einem fremden oder beschädigten Backup nur echte Zahlen übernehmen, alles andere gilt als leer. */
["satzAssist","satzKamera","nettoQuote"].forEach(k=>{if(typeof S[k]!=="number"||!isFinite(S[k]))S[k]=null;});

if(!(Number.isInteger(S.vertragstage)&&S.vertragstage>=1&&S.vertragstage<=366))S.vertragstage=null;

const APP_VERSION="4.3.1";
const WHATSNEW=[
  {v:"4.3.1", t:"Einsatztage richtig gezählt, Tagegeld genauer", items:[
    ["Zähler hängt nicht mehr an der Beschäftigung","Beim Umschalten zwischen frei und fest in den Einstellungen hat der Zähler ältere Aufträge ohne eigene Angabe mal mitgezählt und mal nicht. Jetzt zählt jeder Einsatztag aus deinen Aufträgen, egal ob frei oder fest."],
    ["Für fest Angestellte","Fest Angestellte sehen jetzt in der Statistik und oben in den Aufträgen ihre Einsatztage im laufenden Jahr, geleistet und disponiert. Eine Zahl aus dem Vertrag brauchen sie dafür nicht."],
    ["Tagegeld genauer erklärt","Bei mehrtägigen Reisen mit Übernachtung gibt es Tagegeld, es kommt aber automatisch über die Dienstreise-Abrechnung: 14 Euro für An- und Abreisetag, 28 Euro für volle Tage. Bisher stand dort „kein Anspruch“, das war ungenau. Neu ist auch der Hinweis, dass das ZDF kürzt, wenn die Produktion Essen stellt: 5,60 Euro für ein Frühstück, je 11,20 Euro für Mittag- und Abendessen. Liegt ein Tag knapp unter 8 Stunden, erinnert dich die App daran, dass die Anfahrt von zu Hause mitzählt."]
  ]},
  {v:"4.3", t:"Feiertage am Arbeitsort", items:[
    ["Feiertage in 15 Ländern","Die App kennt jetzt die gesetzlichen Feiertage am Arbeitsort: in Deutschland je Bundesland, in der Schweiz je Kanton, dazu Österreich, Italien, Slowenien, Norwegen, Schweden, Finnland, Frankreich, Andorra, Spanien, Polen, Tschechien, die Slowakei und Kroatien. Oster- und Pfingstsonntag zählen immer, so steht es im Tarif."],
    ["Welcher Ort gilt","Als freier Mitarbeiter zählt der Arbeitsort des Auftrags. Beim Dispo-Import erkennt die App das Land aus dem Produktionsort, zum Beispiel „Kranjska Gora SLO“ oder „Wengen SUI“. Sonst gilt dein üblicher Arbeitsort aus den Einstellungen. Fest Angestellte tragen dort ihren Dienstort ein, er gilt dann für alle Aufträge."],
    ["Im Nachweis markiert","Ein Feiertag bekommt im PDF ein Sternchen beim Datum, in der Mail den Zusatz „Feiertag“. Unten steht eine Zeile mit allen Feiertagen und ihren Namen. So sieht die Disposition sofort, wo der Feiertagszuschlag fällig ist. Im Tag kannst du einen Feiertag abschalten oder selbst einen eintragen."],
    ["Feiertagszuschlag im Verdienst","Wer den Verdienst nach Tarif nutzt, sieht jetzt auch den Feiertagszuschlag von 100 Prozent. Trifft er mit Nacht oder Sonntag zusammen, zählt nur der höhere."]
  ]},
  {v:"4.2", t:"Vertragstage, dein Name und geprüfte Zuschläge", items:[
    ["Vertragstage im Blick","Trag unter Einstellungen ein, wie viele Arbeitstage dein Vertrag im Jahr vorsieht. Dann siehst du in der Statistik und oben in den Aufträgen, wie viele Tage du dieses Jahr schon geleistet hast, wie viele disponiert sind und wie viele noch frei bleiben. Ohne Eintrag ändert sich nichts."],
    ["Die App kennt deinen Namen","Beim Start fragt die App jetzt, wer sie nutzt, bis ein Name gespeichert ist. Beim Dispo-Import wählt sie dich darüber aus, auch wenn dein Name in der Dispo abgeschnitten ist. Findet sie dich nicht, wählt sie niemanden vor, und du tippst an, wer du bist. Vorher hat sie in dem Fall einfach die erste Person genommen, meistens einen Kollegen."],
    ["Verdienst an echten Abrechnungen geprüft","Nacht- und Sonntagszuschlag stimmen mit echten Abrechnungen überein. Die App rundet den Stundensatz jetzt wie das ZDF, dadurch stimmen Mehrarbeit und Zuschläge in den geprüften Fällen auf den Cent. An langen Reisetagen kann sie noch abweichen. Warum, steht in der Anleitung unter Punkt 9. Die Beispiele in den Feldern für Tagessatz und Netto-Anteil zeigen jetzt übliche Spannen statt fester Zahlen."]
  ]},
  {v:"4.1", t:"Verdienst nach Tarif, freiwillig", items:[
    ["Sieh, was dir zusteht","Wenn du magst, zeigt dir die App jetzt pro Monat, was dir nach Tarif zusteht und ungefähr aufs Konto kommen sollte. Die Option ist aus. Du schaltest sie unter Einstellungen und Verdienst ein und trägst dort deine Tagessätze ein. Wie gerechnet wird, steht in der Anleitung unter Punkt 9."]
  ]},
  {v:"4.0", t:"Neues Logo, Soll nach Tarif und genauere Pausenkorrektur", items:[
    ["Neues Logo und neues App-Symbol","Oben in der App steht jetzt das neue Logo. Die Zeiger stehen auf Dienstbeginn, der Bogen ist die Zeit, die seitdem gelaufen ist. Das Symbol auf dem Home-Bildschirm tauscht das iPhone nicht von selbst aus. Wenn du das neue Symbol haben willst, mach zuerst unter Einstellungen ein Backup, denn beim Löschen vom Home-Bildschirm verschwinden auch die Daten der App. Dann löschst du die App und fügst sie in Safari neu zum Home-Bildschirm hinzu, wie in der Anleitung unter Punkt 7 beschrieben. Öffne sie über das neue Symbol und lies dort das Backup ein. Ohne diesen Schritt läuft alles weiter, nur mit dem alten Symbol."],
    ["Das Soll steht jetzt auf 7:42 Stunden","Seit dem 01.01.2026 gilt im Tarifvertrag für die auf Produktionsdauer Beschäftigten eine Woche von 38,5 Stunden, also 7,7 Stunden am Tag ohne Pause. Stand bei dir noch der alte Standard von 7:30, hat die App ihn auf 7:42 umgestellt. Mit 7:30 zeigte sie pro Tag 12 Minuten zu viel an. Hattest du selbst einen anderen Wert eingetragen, bleibt er stehen. Das Soll gilt für alle Tage in der App, auch für ältere aus 2025. Du siehst und änderst es unter Einstellungen und Arbeitszeit-Regeln."],
    ["Pausenkorrektur ohne Lücke kurz vor 9:45","An Tagen ohne Pause mit 9:16 bis 9:45 Stunden hat die Verlängerung den Nachweis über 9:45 geschoben. Dort zieht das System 45 statt 30 Minuten ab, und dir fehlten 15 Minuten. Die App rechnet die Korrektur jetzt auf den verlängerten Tag. Ein Tag von 09:00 bis 18:30 ohne Pause erscheint deshalb als 09:00 bis 19:15. Hast du solche Tage schon abgerechnet, lohnt ein Blick auf die alten Nachweise."],
    ["Kurze Tage starten ohne Pause","Tage bis 6:30 Stunden legt der Dispo-Import jetzt ohne Pause an. Bis dahin zieht FLINK nichts ab, und eine vorgegebene Pause hat deine Nettozeit nur verkürzt. Längere Tage starten weiter mit Pause ja. Bereits angelegte Tage bleiben, wie sie sind, und den Schalter kannst du jederzeit umstellen."],
    ["Tagegeld-Hinweis nennt 14 Euro","Für eintägige Reisen im Inland mit mehr als 8 Stunden Abwesenheit beträgt die Verpflegungspauschale 14 Euro. Bisher stand im Hinweis 28 Euro, das ist der Satz für volle 24 Stunden."]
  ]},
  {v:"3.6", t:"Eigenes Anschreiben und zwei Korrekturen", items:[
    ["Du schreibst die Mail jetzt selbst","In den Einstellungen kannst du Anrede und Grußformel frei formulieren. Lässt du die Felder leer, bleibt alles beim bisherigen Text. Wenn du magst, setzt du Platzhalter ein: {name} für den Empfänger, dazu {produktion}, {auftrag} und {tage}."],
    ["Pausenkorrektur greift wieder in allen Fällen","Das Abrechnungssystem zieht die gesetzliche Ruhepause immer ab, auch an Tagen ohne Pause. Der Nachweis gleicht das jetzt vollständig aus. Ein Tag von 09:00 bis 17:30 ohne Pause erscheint dort als 09:00 bis 18:00, damit deine echten 8:30 Stunden ankommen."],
    ["Der Folgetag stimmt wieder","Tag hinzufügen hat bisher immer das Datum des Vortags vorgeschlagen. Das ist behoben."],
    ["Keine erfundene Dispo-Zeile mehr","Von Hand erfasste Tage zeigten dauerhaft die Zeile Laut Dispo 09:00 bis 18:00, obwohl es nie eine Dispo gab. Ein Tipp auf Übernehmen hat dabei echte Zeiten überschrieben. Der Knopf setzt jetzt nur noch die Einsatzzeit."],
    ["Anleitung neu geschrieben","Sie erklärt den Ablauf jetzt Schritt für Schritt, statt nur Stichworte aufzuzählen."]
  ]},
  {v:"3.5", t:"Grenzübertritt bei Auslandsreisen", items:[
    ["Grenze hin und zurück festhalten","Steht ein Tag auf Ausland, kannst du eintragen, wann du Deutschland verlassen hast und wann du zurück warst. Die Felder sind zunächst gesperrt. Ein Tipp auf dokumentieren schaltet sie frei."],
    ["Erscheint unten im Nachweis","Hast du Grenzzeiten erfasst, stehen sie im Notizfeld von PDF und Mail. Die Tabelle mit deinen Arbeitszeiten bleibt unberührt."]
  ]},
  {v:"3.4", t:"Diese Übersicht", items:[
    ["Neuerungen auf einen Blick","Nach einem Update siehst du künftig einmalig, was sich geändert hat. Du erreichst die Liste jederzeit wieder über Einstellungen und dann Was ist neu."]
  ]},
  {v:"3.3", t:"Pausen richtig auf dem Nachweis", items:[
    ["Über 9:45 Stunden zieht das System 45 Minuten ab","Du machst aber nur 30. Der Nachweis verlängert dein Einsatzende deshalb um die Differenz, damit deine echte Arbeitszeit ankommt."],
    ["Die Pause steht jetzt als Zahl im Nachweis","Statt ja oder nein steht dort 0,5 Stunden, so wie es das Formular vorsieht. Damit erübrigt sich die Rückfrage, wie viel ja eigentlich bedeutet."],
    ["Freier Mitarbeiter oder fest angestellt","Du wählst es im Import, im Auftrag und als Vorgabe in den Einstellungen. Fest Angestellte bekommen den Nachweis mit unveränderten Zeiten."]
  ]},
  {v:"3.2", t:"Tagegeld und neues Symbol", items:[
    ["Tagegeld nur bei Einzeltagen","Bei einer mehrtägigen Reise mit Übernachtung besteht kein Anspruch, das läuft über die Dienstreise-Abrechnung. Im Ausland richtet sich der Satz nach dem Land."],
    ["Neues App-Symbol","Eine Klappe mit EB löst das alte Z ab."]
  ]},
  {v:"3.1", t:"Reiseart nachträglich ändern", items:[
    ["Einzeltage oder mehrtägig, jederzeit","Im Auftrag kannst du über den Arbeitstagen umschalten. Übernachtung und Reisezeiten aller Tage werden neu gesetzt, deine Überstunden bleiben gleich."]
  ]},
  {v:"3.0", t:"Neues Design", items:[
    ["Ruhiger und klarer","Größere Zahlen, mehr Luft, und Hell- und Dunkelmodus sind gleichwertig gepflegt."]
  ]}
];

  d.drehbeginn??=(d.einsatz?addMin(d.einsatz,60):""); d.drehende??=(d.ende?addMin(d.ende,-60):"");

/* ===== Helfer ===== */
function hm2min(s){if(!s)return null;const m=String(s).match(/(\d{1,2}):(\d{2})/);return m?(+m[1])*60+(+m[2]):null;}
function dur(a,b){if(a==null||b==null)return null;let d=b-a;if(d<0)d+=1440;return d;}
function addMin(hm,mins){const m=hm2min(hm);if(m==null)return "";let x=(m+mins)%1440;if(x<0)x+=1440;return String(Math.floor(x/60)).padStart(2,"0")+":"+String(x%60).padStart(2,"0");}
function fmtMin(m){if(m==null)return "–";const s=m<0?"-":"";m=Math.abs(m);return s+Math.floor(m/60)+":"+String(m%60).padStart(2,"0");}
function fmtSigned(m){if(m==null)return "–";const s=m>0?"+":(m<0?"-":"±");const a=Math.abs(m);return s+Math.floor(a/60)+":"+String(a%60).padStart(2,"0");}
function otClass(m){if(m==null||m===0)return "ot-zero";return m>0?"ot-pos":"ot-neg";}
const WD=["So","Mo","Di","Mi","Do","Fr","Sa"];
const MN=["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];
function fmtMonth(mk){return MN[+mk.slice(5,7)-1]+" "+mk.slice(0,4);}
function fmtDate(iso){if(!iso)return "—";const d=new Date(iso+"T00:00");if(isNaN(d))return iso;return WD[d.getDay()]+". "+String(d.getDate()).padStart(2,"0")+"."+String(d.getMonth()+1).padStart(2,"0")+".";}
function fmtDateLong(iso){if(!iso)return "";const d=new Date(iso+"T00:00");if(isNaN(d))return iso;return WD[d.getDay()]+", "+String(d.getDate()).padStart(2,"0")+"."+String(d.getMonth()+1).padStart(2,"0")+"."+d.getFullYear();}
function fmtDayC(iso){if(!iso)return "—";const d=new Date(iso+"T00:00");if(isNaN(d))return iso;return WD[d.getDay()]+", "+String(d.getDate()).padStart(2,"0")+"."+String(d.getMonth()+1).padStart(2,"0")+".";}
function fmtRange(o){const ds=o.days.map(d=>d.datum).filter(Boolean).sort();if(!ds.length)return "";
  const a=new Date(ds[0]+"T00:00"),b=new Date(ds[ds.length-1]+"T00:00");if(isNaN(a)||isNaN(b))return "";
  const dd=x=>String(x.getDate()).padStart(2,"0"),mm=x=>String(x.getMonth()+1).padStart(2,"0");
  if(ds[0]===ds[ds.length-1])return dd(a)+"."+mm(a)+"."+a.getFullYear();
  if(a.getMonth()===b.getMonth()&&a.getFullYear()===b.getFullYear())return dd(a)+".–"+dd(b)+"."+mm(b)+"."+b.getFullYear();
  return dd(a)+"."+mm(a)+". – "+dd(b)+"."+mm(b)+"."+b.getFullYear();}
function rangeOrt(o){const r=fmtRange(o);return [r,o.produktionsort].filter(Boolean).join(" · ")||"Noch keine Tage";}
function headEyebrow(){const n=new Date();let s=MN[n.getMonth()].toUpperCase()+" "+n.getFullYear();const a=clean(S.absender);if(a)s+=" · "+a.toUpperCase();return s;}

/* ===== Berechnung pro Tag ===== */
/* ===== FLINK-Pausenautomatik (ZDF-System) =====
   Gesetzliche Ruhepause, die FLINK selbst abzieht – unabhängig davon, was im Nachweis steht:
   Anwesenheit über 9:45 Std → 45 Min · über 6:30 Std → 30 Min · darunter → keine.
   Quelle: ZDF/FLINK-Regel (6,5 bzw. 9,75 Stunden). Bei freien Mitarbeitern weicht die
   tatsächliche Pause davon ab (real 30 Min oder keine), deshalb muss der Nachweis
   korrigiert werden – siehe exportEnde(). */
function flinkPause(span){
  if(span==null)return 0;
  if(span>S.flink45)return 45;
  if(span>S.flink30)return 30;
  return 0;
}
/* Pausen-Vorgabe fuer neu angelegte Tage (V4.0): Bis zur ersten FLINK-Schwelle (6:30) zieht FLINK nichts ab,
   eine vorgegebene Pause wuerde nur die Nettozeit kuerzen. Darunter also "Pause nein", darueber "Pause ja".
   Nur Startwert, der Schalter im Tag bleibt frei. Fehlen Zeiten, bleibt es bei "ja" wie bisher. */
function pauseVorgabe(einsatz,ende){const s=dur(hm2min(einsatz),hm2min(ende));return s==null||s>S.flink30;}
function dayCalc(d){
  const span=dur(hm2min(d.einsatz),hm2min(d.ende));
  const az=dur(hm2min(d.drehbeginn),hm2min(d.drehende));
  const pauseMin=d.pause?(S.standardPause||0):0;
  const netto=span==null?null:Math.max(0,span-pauseMin);
  const ot=netto==null?null:netto-S.sollMin;
  let tg;
  if(d.uebernachtung) tg={state:"ue"};
  else if(d.ausland) tg={state:"ausland"};
  else if(span==null) tg={state:"none"};
  else if(span>S.abwesenheitMin) tg={state:"ok"};
  else tg={state:"under"};
  const fp=flinkPause(span);
  /* Korrektur = was FLINK abzieht minus die tatsaechlich gemachte Pause.
     FLINK zieht die gesetzliche Ruhepause immer ab, auch wenn keine gemacht wurde.
     Damit nach diesem Abzug die echte Arbeitszeit ankommt, wandert die Differenz
     ans Einsatzende. Beispiele: 30er-Fenster mit Pause 30 -> 0 (deckt sich, die Pause
     steckt in der Arbeitszeit) · 45er-Fenster mit Pause 30 -> +15 · ohne Pause -> voller
     FLINK-Abzug. Nie negativ: der Nachweis wird nie kuerzer als die echte Zeit.
     Schwellensprung (V4.0): FLINK sieht die VERLAENGERTE Spanne. Rutscht sie dadurch ueber
     die naechste Schwelle, zieht FLINK dort mehr ab. Deshalb wird die Korrektur auf die
     verlaengerte Spanne nachgerechnet, bis sie stabil ist. Beispiel: 09:00-18:30 ohne Pause
     -> +30 ergaebe 19:00 = 10:00 > 9:45 -> FLINK 45 -> es fehlten 15. Richtig: +45 = 19:15.
     flinkPause steigt nur und hat drei Stufen, die Schleife endet nach hoechstens zwei Runden. */
  let korr=span==null?0:Math.max(0,fp-pauseMin);
  if(span!=null){for(let i=0;i<3;i++){const k=Math.max(0,flinkPause(span+korr)-pauseMin);if(k===korr)break;korr=k;}}
  const flinkNw=span==null?0:flinkPause(span+korr);   /* was FLINK vom Nachweis abzieht */
  return {span,az,pause:pauseMin,pauseJa:!!d.pause,netto,ot,absence:span,tg,flink:fp,flinkNw,korr};
}
/* Einsatzende für den Nachweis. Bei freien Mitarbeitern wird es um die Differenz
   verschoben, die FLINK zu viel (oder zu wenig) abzieht – damit nach dessen Automatik
   die tatsächlich geleistete Nettozeit herauskommt. Feste bekommen die echte Zeit,
   für sie stimmt die Automatik.
   Beispiel frei: 09:00–19:00 (10:00), Pause 30. FLINK zieht 45 → Nachweis 19:15;
   FLINK rechnet 10:15 − 45 = 9:30 = die echte Nettozeit. */
function exportEnde(o,d){
  if(orderStatus(o)!=="frei")return d.ende||"";
  const c=dayCalc(d);
  if(!d.ende||!c.korr)return d.ende||"";
  return addMin(d.ende,c.korr);
}
/* Pausenwert für den Nachweis in Dezimalstunden, wie im ZDF-Formular üblich ("0,5"). */
function pauseDez(min){if(!min)return "—";return (min/60).toFixed(2).replace(/0$/,"").replace(".",",");}
/* Status des Auftrags: frei (Default aus den Einstellungen) oder fest angestellt. */
function orderStatus(o){return (o&&o.status)||S.status||"frei";}

    x.tage.sort((a,b)=>(a.d.datum+(a.d.einsatz||"")).localeCompare(b.d.datum+(b.d.einsatz||"")));
    x.konto=q?runde2(x.brutto*q/100):null;return x;});
}
/* Tage bis heute, die nur wegen eines fehlenden Tagessatzes nicht mitzählen, je Funktion. Grundlage für den Hinweis
   im Reiter Verdienst. Zählt wie verdienstMonate: Status frei, Einsatzbeginn und -ende eingetragen, nicht in der Zukunft. */
function verdienstFehlSatz(heute){
  const bis=heute||isoLocal(new Date());const n={assistent:0,kamera:0};if(!S.verdienstOn)return n;
  DB.orders.forEach(o=>{if(orderStatus(o)!=="frei"||orderSatz(o))return;const k=orderFunktion(o)==="kamera"?"kamera":"assistent";
    o.days.forEach(d=>{if(d.datum&&d.datum<=bis&&d.einsatz&&d.ende)n[k]++;});});
  return n;
}
function parseEur(s){const t=String(s??"").trim().replace(/\s|€/g,"");if(!t)return null;
  const n=parseFloat(t.includes(",")?t.replace(/\./g,"").replace(",","."):t);return isFinite(n)&&n>0?runde2(n):null;}
/* Netto-Anteil in Prozent: Komma oder Punkt, ohne vorher zu runden. Ein Bruch unter 1 (z. B. 0,5437) gilt als 54,37 %.
   Gültig nur 1 bis 100, sonst null (dann zeigt die App nur Brutto). */
function parseQuote(s){const t=String(s??"").trim().replace(/\s|%/g,"");if(!t)return null;
  let n=parseFloat(t.replace(",","."));if(!isFinite(n))return null;if(n<1)n*=100;n=runde2(n);return n>=1&&n<=100?n:null;}
function fmtEur(n){return n==null?"–":n.toLocaleString("de-DE",{minimumFractionDigits:2,maximumFractionDigits:2})+"\u00a0€";}
function fmtEurRund(n){return n==null?"–":Math.round(n).toLocaleString("de-DE")+" €";}
function fmtStd(h){return String(h).replace(".",",")+" Std";}
/* === TARIF-END === */
/* ===== Vertragstage (V4.2) ===== Reine Rechnung ohne DOM, getestet in tests/vertragstage.test.mjs. */
/* Arbeitstage laut Vertrag eingeben: ganze Zahl 1 bis 366, ein angehängtes "Tage" ist erlaubt. Sonst null (kein Zähler). */
function parseTage(s){const m=String(s??"").trim().match(/^(\d{1,3})(\s*tage?)?$/i);if(!m)return null;const n=+m[1];return n>=1&&n<=366?n:null;}
/* Einsatztage im laufenden Kalenderjahr (V4.2, V4.3.1). Gezählt werden alle Aufträge, egal ob frei oder fest, abgerechnete
   eingeschlossen, jedes Datum einmal. Geleistet = bis einschließlich heute, disponiert = danach. Die Beschäftigung zählt nicht
   mehr mit: Ältere Aufträge ohne eigenen Status folgten der Einstellung und fielen beim Umschalten auf „fest“ heraus.
   Frei (S.status): Vertragstage nötig, sonst null; frei = Vertrag minus beides, darf negativ werden (über dem Vertrag).
   Fest: immer geleistet und disponiert, ohne Vertrag und ohne frei (vertrag und frei = null). */
function vertragsTage(heute){
  const fest=S.status==="fest",v=S.vertragstage,mitVertrag=!fest&&Number.isInteger(v)&&v>=1&&v<=366;
  if(!fest&&!mitVertrag)return null;
  const bis=heute||isoLocal(new Date()),jahr=bis.slice(0,4),daten=new Set();
  DB.orders.forEach(o=>o.days.forEach(d=>{if(d.datum&&d.datum.slice(0,4)===jahr)daten.add(d.datum);}));
  let geleistet=0,disponiert=0;daten.forEach(t=>{if(t<=bis)geleistet++;else disponiert++;});
  return {jahr,vertrag:mitVertrag?v:null,geleistet,disponiert,frei:mitVertrag?v-geleistet-disponiert:null};
}
const orderOT=o=>o.days.reduce((a,d)=>a+(dayCalc(d).ot||0),0);
const orderNetto=o=>o.days.reduce((a,d)=>a+(dayCalc(d).netto||0),0);
const orderTGdays=o=>o.days.reduce((a,d)=>a+(dayCalc(d).tg.state==="ok"?1:0),0);
const orderDate=o=>o.days.map(d=>d.datum).filter(Boolean).sort()[0]||"";
const byDate=(a,b)=>(orderDate(a)||"0000").localeCompare(orderDate(b)||"0000");

/* ===== Reiseart (abgeleitet, nicht gespeichert) =====
   Eine Wahrheit: der Zustand ergibt sich aus days[].uebernachtung, damit Reiseart und
   Tage nie auseinanderlaufen (auch nicht, wenn ein einzelner Tag im Sheet umgestellt wird).
   "mix" = uneinheitlich, z. B. zwei Nächte Hotel und der letzte Tag heimgefahren. */
function orderTrip(o){
  if(!o.days.length)return "none";
  const ue=o.days.filter(d=>d.uebernachtung).length;
  if(ue===0)return "ein";
  if(ue===o.days.length)return "mehr";
  return "mix";
}
/* Reiseart auf alle Tage anwenden. Ändert NUR uebernachtung und die vier Reisefelder –
   Einsatzbeginn/-ende, Dreh und Pause bleiben unangetastet, damit Netto und Überstunden
   sich nicht verschieben. Muster wie beim Import: bei "mehr" Anreise nur am ersten,
   Rückreise nur am letzten Tag; bei "ein" beide Fahrten an jedem Tag. */
function applyTrip(o,trip){
  const mehr=trip==="mehr";
  const days=o.days.slice().sort((a,b)=>((a.datum||"")+(a.einsatz||"")).localeCompare((b.datum||"")+(b.einsatz||"")));
  const last=days.length-1;
  days.forEach((d,i)=>{
    d.uebernachtung=mehr;
    const hin=!mehr||i===0, rueck=!mehr||i===last;
    d.anreise=hin&&d.einsatz?addMin(d.einsatz,30):"";
    d.anreiseEnde=hin&&d.einsatz?addMin(d.einsatz,60):"";
    d.rueckBeginn=rueck&&d.ende?addMin(d.ende,-60):"";
    d.rueck=rueck&&d.ende?addMin(d.ende,-30):"";
  });
}

/* Vertragstage (V4.2): Kurzzeile in den Aufträgen, bei Freien leer ohne Eintrag in den Einstellungen.
   Fest angestellt (V4.3.1): „Einsatztage“ mit geleistet und disponiert, ohne Vertrag und ohne frei. */
function vertragsZeileHtml(){const v=vertragsTage();if(!v||v.vertrag==null&&!DB.orders.length)return "";
  if(v.vertrag==null)return `<p class="note vline">Einsatztage ${v.jahr} · ${v.geleistet}&nbsp;geleistet · ${v.disponiert}&nbsp;disponiert</p>`;

/* Block in der Statistik: drei Kacheln und ein Balken (geleistet voll, disponiert heller, Rest leer). */
function vertragsBlockHtml(){const v=vertragsTage();if(!v)return "";
  if(v.vertrag==null)return `<div class="section-h"><h3>Einsatztage ${v.jahr}</h3></div>
  <div class="kpis two">
    <div class="kpi"><div class="l">Geleistet</div><div class="n">${v.geleistet}</div></div>
    <div class="kpi"><div class="l">Disponiert</div><div class="n">${v.disponiert}</div></div>
  </div>`;
  const pct=x=>Math.max(0,Math.min(100,x/v.vertrag*100)),g=pct(v.geleistet),dsp=Math.min(pct(v.disponiert),100-g);
  return `<div class="section-h"><h3>Vertragstage ${v.jahr}</h3><span class="tot">von ${v.vertrag}</span></div>
  <div class="kpis">
    <div class="kpi"><div class="l">Geleistet</div><div class="n">${v.geleistet}</div></div>
    <div class="kpi"><div class="l">Disponiert</div><div class="n">${v.disponiert}</div></div>
    <div class="kpi ${v.frei<0?"warnk":"acc"}"><div class="l">${v.frei<0?"Über Vertrag":"Frei"}</div><div class="n">${Math.abs(v.frei)}</div></div>
  </div>
  <div class="vbar" aria-hidden="true"><span class="g" style="width:${g}%"></span><span class="d" style="width:${dsp}%"></span></div>`;}
/* ===== Statistik ===== */
function renderStats(){
  const totOT=DB.orders.reduce((a,o)=>a+orderOT(o),0);
  const totNetto=DB.orders.reduce((a,o)=>a+orderNetto(o),0);
  const totDays=DB.orders.reduce((a,o)=>a+o.days.length,0);
  const totTGd=DB.orders.reduce((a,o)=>a+orderTGdays(o),0);

    (perYear[yk]??={ot:0,netto:0,days:0});perYear[yk].ot+=c.ot||0;perYear[yk].netto+=c.netto;perYear[yk].days++;
  }));
  const months=Object.keys(perMonth).sort().reverse(),years=Object.keys(perYear).sort().reverse();

  if(years.length>1){h+=`<div class="section-h"><h3>Pro Jahr</h3></div>`;
    years.forEach(yk=>{const yy=perYear[yk];
      h+=`<div class="srow"><div class="nm">${yk}<small>${yy.days} ${yy.days===1?"Tag":"Tage"} · ${fmtMin(yy.netto)} netto</small></div><div class="v ${otClass(yy.ot)}">${fmtSigned(yy.ot)}</div></div>`;});
  }
  if(DB.orders.length){h+=`<div class="section-h"><h3>Pro Auftrag</h3></div>`;
    DB.orders.slice().sort((a,b)=>byDate(b,a)).forEach(o=>{const ot=orderOT(o),tgd=orderTGdays(o);
      h+=`<div class="srow${o.abgerechnet?" dim":""}" data-open="${o.id}" style="cursor:pointer"><div class="nm">${esc(o.titel||"Ohne Titel")}<small>${o.days.length} ${o.days.length===1?"Tag":"Tage"} · ${fmtMin(orderNetto(o))} netto${tgd>0?` · ${tgd}× Tagegeld`:""}</small></div><div style="display:flex;align-items:center;gap:10px"><span class="v ${otClass(ot)}">${fmtSigned(ot)}</span><span class="chev">›</span></div></div>`;});
  }else h+=`<div class="empty"><div class="big">📊</div><p>Noch keine Daten.</p></div>`;
  view.innerHTML=h;
  bindTabs();
  view.querySelectorAll("[data-open]").forEach(c=>c.onclick=()=>{state.orderId=c.dataset.open;window.scrollTo(0,0);render();});
}

/* Hinweis in ganzen Sätzen, wenn Einsätze nur wegen eines fehlenden Tagessatzes nicht mitzählen (je Funktion). */
function fehlSatzText(f){
  const s=[["assistent","Dreh-Assistent"],["kamera","Kamera"]].filter(([k])=>f[k]).map(([k,nm])=>
    `${f[k]} ${f[k]===1?"Einsatz":"Einsätze"} als ${nm} ${f[k]===1?"zählt":"zählen"} nicht mit, weil der Tagessatz ${nm} fehlt.`);
  return s.length?s.join(" ")+` Trag ${s.length>1?"sie":"ihn"} in den Einstellungen unter Verdienst ein.`:"";
}

/* ===== Sheet ===== */
const scrim=document.getElementById("scrim"),sheet=document.getElementById("sheet");
let shT=null;
function openSheet(html){clearTimeout(shT);scrim.classList.remove("out");sheet.classList.remove("out");sheet.innerHTML='<div class="grip"></div>'+html;scrim.classList.add("on");sheet.scrollTop=0;document.body.style.overflow="hidden";}
function closeSheet(){
  if(!scrim.classList.contains("on")||scrim.classList.contains("out"))return;
  scrim.classList.add("out");
  if(!sheet.style.transform)sheet.classList.add("out");/* Swipe hat das Sheet schon rausgeschoben */
  shT=setTimeout(()=>{scrim.classList.remove("on","out");sheet.classList.remove("out");sheet.style.transform="";sheet.style.transition="";document.body.style.overflow="";},200);
}
scrim.addEventListener("click",e=>{if(e.target===scrim)closeSheet();});
/* Wisch nach unten schließt das Sheet (nur wenn der Inhalt oben steht) */
let swY=null,swActive=false;
sheet.addEventListener("touchstart",e=>{swY=e.touches[0].clientY;swActive=sheet.scrollTop<=0;},{passive:true});
sheet.addEventListener("touchmove",e=>{
  if(swY==null||!swActive)return;
  const dy=e.touches[0].clientY-swY;
  if(dy>0&&sheet.scrollTop<=0){sheet.style.transition="none";sheet.style.transform="translateY("+dy+"px)";e.preventDefault();}
},{passive:false});
sheet.addEventListener("touchend",e=>{
  if(swY==null)return;
  const dy=e.changedTouches[0].clientY-swY;swY=null;
  if(swActive&&dy>110){sheet.style.transition="transform .22s ease";sheet.style.transform="translateY(100%)";setTimeout(closeSheet,210);}
  else{sheet.style.transition="transform .22s ease";sheet.style.transform="";setTimeout(()=>{sheet.style.transition="";},240);}
  swActive=false;
});

    else{

        :t.state==="ausland"?"Auslandsreise: Der Spesensatz ist Ländersache und wird über den Reisedienst abgerechnet – deshalb hier kein Betrag."
        :t.state==="under"?`Abwesenheit ${fmtMin(c.absence)} h liegt unter der Schwelle von ${fmtMin(S.abwesenheitMin)} h.`+(c.absence>=S.abwesenheitMin-60?" Zählt deine Anfahrt von zu Hause dazu, kann es trotzdem reichen: Gerechnet wird ab der Abfahrt von der Wohnung.":"")
        :"Zeiten eintragen.";
      box.innerHTML=`<div class="tgbox"><div class="t"><span>${t.state==="ue"?"Tagegeld über die Reiseabrechnung":"Kein Tagegeld"}</span><span class="in">nur intern</span></div><div class="why">${why}</div></div>`;

/* Lokales ISO-Datum. toISOString() rechnet nach UTC und verschiebt in Deutschland
   den Tag zurueck - der Folgetag war dadurch immer der Vortag. */
function isoLocal(dt){return dt.getFullYear()+"-"+String(dt.getMonth()+1).padStart(2,"0")+"-"+String(dt.getDate()).padStart(2,"0");}
function guessNextDate(o){if(o.days.length){const last=o.days.map(d=>d.datum).filter(Boolean).sort().pop();if(last){const dt=new Date(last+"T00:00");dt.setDate(dt.getDate()+1);return isoLocal(dt);}}return isoLocal(new Date());}

/* Auswahl der Feiertags-Orte, gruppiert nach Deutschland, Schweiz, weitere Länder (V4.3).
   erste = optionale erste Option [Wert, Text], z. B. ["", "Wie Einstellungen: Bayern"]. */
function ftOptionen(wahl,erste){
  let h=erste?`<option value="${esc(erste[0])}"${wahl===erste[0]?" selected":""}>${esc(erste[1])}</option>`:"",gruppe="";
  FT_ORTE.forEach(([k,name,g])=>{if(g!==gruppe){h+=(gruppe?"</optgroup>":"")+`<optgroup label="${esc(g)}">`;gruppe=g;}
    h+=`<option value="${k}"${k===wahl?" selected":""}>${esc(name)}</option>`;});
  return h+"</optgroup>";
}

/* ===== Datensicherung ===== */
function exportBackup(){
  const fname="Zeiterfassung-Backup_"+new Date().toISOString().slice(0,10)+".json";
  const blob=new Blob([JSON.stringify({app:"zeiterfassung",exportedAt:new Date().toISOString(),data:DB},null,1)],{type:"application/json"});
  const file=new File([blob],fname,{type:"application/json"});
  const mark=()=>{S.lastBackup=Date.now();persist();const lb=document.getElementById("lastBak");if(lb)lb.textContent="heute";};
  if(navigator.canShare&&navigator.canShare({files:[file]})){
    navigator.share({files:[file]}).then(()=>{mark();toast("Backup geteilt");render();}).catch(err=>{if(err&&err.name!=="AbortError"){dlBlob(blob,fname);mark();render();}});
  }else{dlBlob(blob,fname);mark();render();}
}
function dlBlob(blob,fname){const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=fname;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),3000);toast("Datei gespeichert");}

document.getElementById("backupInput").addEventListener("change",e=>{
  const f=e.target.files[0];e.target.value="";if(!f)return;
  const r=new FileReader();
  r.onload=()=>{try{
    const j=JSON.parse(r.result);
    const db=j&&j.app==="zeiterfassung"&&j.data&&Array.isArray(j.data.orders)?j.data:(j&&Array.isArray(j.orders)?j:null);
    if(!db){toast("Keine gültige Backup-Datei");return;}
    askConfirm("Backup mit "+db.orders.length+" Auftrag/Aufträgen einlesen? Ersetzt den aktuellen Stand ("+DB.orders.length+" Aufträge).",()=>{
      DB=db;DB.settings??={};persist();location.reload();
    },"Einlesen");
  }catch(err){console.error(err);toast("Backup konnte nicht gelesen werden");}};
  r.readAsText(f);
});

/* ===== Was ist neu ===== */
function openWhatsNew(alle){
  /* Nach einem Update nur die Versionen zeigen, die der Nutzer noch nicht gesehen hat.
     Beim Aufruf aus den Einstellungen (alle=true) die komplette Liste. */
  const seen=S.seenVersion||"";
  const cmp=(a,b)=>a.split(".").map(Number).reduce((r,n,i)=>r||n-(+b.split(".")[i]||0),0);
  const zeigen=alle?WHATSNEW:WHATSNEW.filter(w=>!seen||cmp(w.v,seen)>0);
  const liste=(zeigen.length?zeigen:WHATSNEW.slice(0,1));
  openSheet(`<h3>Was ist neu</h3>
    <p class="note" style="margin:-8px 0 16px">Version ${APP_VERSION}${seen?" · zuletzt gesehen: "+esc(seen):""}</p>
    ${liste.map(w=>`<div class="section-h" style="margin:18px 0 8px"><h3>V${w.v} · ${esc(w.t)}</h3></div>
      ${w.items.map(([k,txt])=>`<div class="hsec"><div class="eb">${esc(k)}</div><p>${esc(txt)}</p></div>`).join("")}`).join("")}
    <button class="btn" id="wnOk" style="margin-top:16px">Verstanden</button>`);
  document.getElementById("wnOk").onclick=()=>{S.seenVersion=APP_VERSION;persist();closeSheet();};
}

/* ===== Anleitung ===== */
function openHelp(){
  openSheet(`<h3>Anleitung</h3>
    <p class="note" style="margin:-8px 0 16px">So arbeitest du mit der App. Einmal lesen reicht.</p>

    <div class="hsec"><div class="eb">Der Ablauf in Kurzform</div>
      <p>Du legst einen <b>Auftrag</b> an, das ist ein Dreh oder eine Produktion. In diesen Auftrag trägst du deine <b>Arbeitstage</b> ein. Am Ende schickst du daraus einen Stundennachweis an die Disposition, als PDF oder als E-Mail.</p>
      <p>Alles andere rechnet die App: Überstunden, Pausen und den Hinweis auf mögliches Tagegeld.</p>
      <p>Die <b>Überstunden</b> misst die App an deinem Tages-Soll. Voreingestellt sind <b>7:42 Stunden ohne Pause</b>. So steht es seit dem 01.01.2026 im Tarifvertrag für die auf Produktionsdauer Beschäftigten: 38,5 Stunden in der Woche, also 7,7 Stunden am Tag. Die Pause kommt obendrauf. Steht in deinem Vertrag etwas anderes, stellst du es unter Einstellungen und Arbeitszeit-Regeln ein.</p></div>

    <div class="hsec"><div class="eb">1 · Auftrag anlegen</div>
      <p>Am schnellsten geht es mit der Dispo. Tippe auf <b>PDF importieren</b> und wähle die Datei aus. Die App liest Titel, Auftragsnummer, Produktionsnummer, Ort und die Namen aller eingeteilten Personen heraus und legt dir die Drehtage gleich mit an.</p>
      <p>Die App sucht dich über deinen Namen aus den Einstellungen und wählt dich vor. Findet sie dich nicht, ist niemand ausgewählt, und du tippst an, wer du bist. Danach prüfst du die <b>Reiseart</b>. Einzeltage heißt, du fährst jeden Tag hin und zurück. Mehrtägig heißt, du übernachtest vor Ort.</p>
      <p>Ohne Dispo geht es genauso über <b>Auftrag anlegen</b>. Dann trägst du die Tage von Hand ein.</p>
      <p class="tip">Die Dispo kommt per Mail? Tippe das PDF an, dann auf Teilen und auf In Dateien sichern. Danach findest du es im Import ganz oben unter Zuletzt benutzt.</p></div>

    <div class="hsec"><div class="eb">2 · Einen Tag erfassen</div>
      <p>Der <b>Einsatzbeginn ist der Ausgangspunkt</b>. Sobald du ihn einträgst, schlägt die App alle übrigen Zeiten vor. Die Vorschläge sind nur Startwerte, du überschreibst sie einfach mit deinen echten Zeiten.</p>
      <p>Das <b>Einsatzende</b> rechnet sich dabei selbst aus. Es liegt immer 30 Minuten nach deiner letzten Tätigkeit, also nach der Rückreise, sonst nach dem Dreh. Sobald du es einmal selbst eintippst, bleibt dein Wert stehen.</p>
      <p>Zwei Schalter helfen bei besonderen Tagen. <b>Kein Dreh</b> nimmst du für reine Anreisetage. <b>Entfällt</b> steht bei Anreise und Rückreise getrennt zur Verfügung, für Tage ohne Fahrt.</p></div>

    <div class="hsec"><div class="eb">3 · Pausen und was FLINK daraus macht</div>
      <p>Das Abrechnungssystem des Senders zieht die gesetzliche Ruhepause <b>immer automatisch</b> ab. Über 6:30 Stunden Anwesenheit sind das 30 Minuten, über 9:45 Stunden 45 Minuten. Daran kann niemand etwas ändern, auch die Disposition nicht.</p>
      <p>Machst du tatsächlich 30 Minuten Pause, gehen dir bei langen Tagen also 15 Minuten verloren. Machst du gar keine, sogar die vollen 30 oder 45.</p>
      <p>Deshalb verlängert die App auf dem Nachweis dein Einsatzende genau um diese Differenz. Beispiel: Du arbeitest von 09:00 bis 17:30 ohne Pause. Auf dem Nachweis steht <b>09:00 bis 18:00</b>. Das System zieht davon 30 Minuten ab und bucht deine echten 8:30.</p>
      <p>Eine Besonderheit gibt es kurz vor 9:45 Stunden. Arbeitest du zum Beispiel von 09:00 bis 18:30 ohne Pause, würde eine Verlängerung um 30 Minuten den Nachweis über 9:45 Stunden schieben, und dort zieht das System 45 Minuten ab. Die App rechnet das mit ein und verlängert in diesem Fall gleich um 45 Minuten, auf <b>19:15</b>.</p>
      <p>Beim Dispo-Import legt die App Tage bis 6:30 Stunden <b>ohne Pause</b> an, längere mit Pause. Bis 6:30 Stunden zieht FLINK nichts ab, eine Pause würde dort nur deine Nettozeit kürzen. Hast du doch Pause gemacht, stellst du den Schalter im Tag einfach um.</p>
      <p>In der App selbst siehst du weiterhin deine tatsächlichen Zeiten. Im Tages-Sheet steht unter <b>Nachweis für FLINK</b> immer, was am Ende auf dem Papier landet.</p>
      <p class="tip">Das gilt nur für freie Mitarbeiter. Fest Angestellte bekommen den Nachweis mit den unveränderten Zeiten.</p></div>

    <div class="hsec"><div class="eb">4 · Tagegeld</div>
      <p>Selbst beantragen musst du Tagegeld <b>nur bei Einzeltagen</b>: eintägig unterwegs, im Inland und länger als 8 Stunden abwesend. Dann beträgt es <b>14 Euro</b>. Das ist die Verpflegungspauschale aus dem Einkommensteuergesetz, auf die die Reisekosten-Regelung des ZDF verweist. Genau genommen zählen die 8 Stunden ab der Abfahrt von deiner Wohnung, die App nimmt dafür die Einsatzzeit. Liegt ein Tag knapp darunter, weist sie dich darauf hin.</p>
      <p>Bei einer mehrtägigen Reise mit Übernachtung kommt das Tagegeld <b>automatisch über die Dienstreise-Abrechnung</b>: 14 Euro für den An- und den Abreisetag, 28 Euro für jeden vollen Tag dazwischen. Beantragen musst du dort nichts. Im Ausland richtet sich der Satz nach dem jeweiligen Land und wird über den Reisedienst abgewickelt, deshalb nennt die App dort keinen Betrag.</p>
      <p>Stellt die Produktion Essen, kürzt das ZDF das Tagegeld: um 5,60 Euro für ein Frühstück und um je 11,20 Euro für Mittag- und Abendessen. Das gilt auch, wenn du das Essen ohne triftigen Grund nicht nimmst. Mit Mittagessen bleiben vom Einzeltag also 2,80 Euro.</p>
      <p>Der grüne Hinweis ist nur für dich gedacht. Er taucht weder im PDF noch in der Mail auf. Denk daran: Der Antrag muss innerhalb von sechs Monaten raus.</p></div>

    <div class="hsec"><div class="eb">5 · Nachweis verschicken</div>
      <p><b>Als PDF</b> erzeugt die fertige Datei und öffnet das Teilen-Menü. Von dort schickst du sie per Mail, legst sie in Dateien ab oder gibst sie per AirDrop weiter.</p>
      <p><b>Als E-Mail</b> öffnet deine Mail-App mit dem Nachweis als Text. Empfängeradresse, Anrede und Grußformel stellst du einmal in den Einstellungen ein, danach steht alles automatisch drin.</p>
      <p>Feiertage am Arbeitsort sind im Nachweis beim Datum markiert, im PDF mit einem Sternchen, in der Mail mit dem Zusatz „Feiertag“. Unten stehen sie mit ihrem Namen. Mehr dazu unter Punkt 11.</p>
      <p>Ist ein Auftrag erledigt, markierst du ihn mit <b>Abgerechnet</b>. Er wandert dann ausgegraut ans Ende der Liste und ist nicht mehr im Weg.</p></div>

    <div class="hsec"><div class="eb">6 · Sicherung, das Wichtigste</div>
      <p>Deine Daten liegen ausschließlich in dieser App, auf diesem Gerät. Safari und die App auf dem Home-Bildschirm haben dabei getrennte Speicher. Es gibt keinen Server und kein Konto. Das heißt auch: Wenn das iPhone die Websitedaten löscht, sind sie weg.</p>
      <p>Mach deshalb regelmäßig ein Backup. Du findest es unter <b>Einstellungen</b> und dann <b>Backup teilen</b>. Sichere die Datei in deiner Cloud oder schick sie dir selbst per Mail. Zurückholen kannst du sie jederzeit mit <b>Backup einlesen</b>.</p>
      <p class="tip">Beim Einlesen wird der aktuelle Stand komplett ersetzt. Prüfe also kurz, ob du die richtige Datei erwischt hast.</p></div>

    <div class="hsec"><div class="eb">7 · Auf dem iPhone installieren</div>
      <p>Öffne die Adresse in <b>Safari</b> und tippe auf <b>Teilen</b>. Bei neuerem iOS liegt Teilen hinter den drei Punkten. Scrolle in der Liste nach unten zu <b>Zum Home-Bildschirm</b>, bei neuerem iOS heißt es „Zu Home-Bildschirm hinzufügen“, und lass <b>Als Web-App öffnen</b> eingeschaltet. Ab da startest du die App über ihr Symbol und sie läuft im Vollbild.</p>
      <p>Nach dem ersten Laden funktioniert alles auch <b>ohne Internet</b>, sogar der PDF-Export.</p>
      <p class="tip">Bekommt die App ein neues Symbol, tauscht das iPhone es auf dem Home-Bildschirm nicht von selbst aus. Dafür musst du die App löschen und neu hinzufügen. Mach vorher unbedingt ein Backup, denn beim Löschen verschwinden auch ihre Daten. Danach öffnest du die neue App über ihr Symbol und liest das Backup dort ein.</p></div>

    <div class="hsec"><div class="eb">8 · An Kollegen weitergeben</div>
      <p>Unter <b>Einstellungen</b> und <b>App weiterempfehlen</b> teilst du den Link. Jeder Kollege bekommt seine eigene, leere App. Daten werden nie geteilt oder vermischt.</p>
      <p>Sag ihm dazu, dass er die App nach dem Öffnen zum Home-Bildschirm hinzufügen sollte. Beim ersten Start fragt die App nach seinem Namen. Der Name sorgt dafür, dass beim Dispo-Import automatisch die richtige Person vorausgewählt wird.</p></div>

    <div class="hsec"><div class="eb">9 · Verdienst (freiwillig)</div>
      <p>Wenn du magst, zeigt dir die App pro Monat, was dir nach Tarif zusteht und ungefähr auf dem Konto ankommen sollte. Du schaltest das unter <b>Einstellungen</b> und <b>Verdienst</b> ein und trägst dort deine Tagessätze als Dreh-Assistent und als Kamera ein. Danach gibt es neben Aufträge und Statistik den Reiter <b>Verdienst</b>.</p>
      <p>Die App rechnet so wie das ZDF auf der Abrechnung. Jeder Einsatztag bringt den Tagessatz. Dazu kommt Mehrarbeit für alles über 7,7 Stunden am Tag, aufgerundet auf halbe Stunden, mit dem Tagessatz geteilt durch 7,7 und 25 Prozent Zuschlag. Die 7,7 Stunden stehen so im Tarif und gelten auch dann, wenn du unter Arbeitszeit-Regeln ein anderes Soll eingetragen hast. Für Arbeit in der Nacht zwischen 22 und 6 Uhr kommen 25 Prozent dazu, am Sonntag 50 Prozent. An Feiertagen am Arbeitsort sind es 100 Prozent. Treffen zwei Zuschläge zusammen, zählt nur der höhere. Pause und Reisezeit zählen dabei nicht mit. Laut Tarif zahlt das ZDF Mehrarbeit und diese Zuschläge nur bei einem Tagessatz bis 336,06 Euro. Liegt dein Tagessatz über 336,06 Euro, gibt es nur den Tagessatz.</p>
      <p>Steht bei einer Fahrt nur der Beginn oder nur das Ende, wie nach einem Dispo-Import, rechnet die App diese Fahrt mit 30 Minuten. Trag die echten Fahrzeiten ein, dann wird es genauer. Nacht- und Sonntagszuschlag sind an echten Abrechnungen geprüft. Abweichen kann es an langen Reisetagen. Das ZDF zählt eine Fahrt manchmal als Arbeitszeit und manchmal als Reisezeit. Reisezeit zählt mit der Arbeit höchstens 12 Stunden am Tag und bekommt keine Zuschläge. Die App rechnet jede Fahrt bei der Mehrarbeit wie Arbeitszeit, bei den Zuschlägen aber wie Reisezeit. An solchen Tagen kann sie deshalb nach oben oder nach unten abweichen.</p>
      <p>Trägst du deinen Netto-Anteil ein, zeigt die App auch, was ungefähr aufs Konto kommt. Den Anteil findest du auf einer Abrechnung, wenn du die Auszahlung durch die Summe des Vertrags teilst.</p>
      <p class="tip">Das ZDF zahlt nachträglich, meist ein bis zwei Monate später und oft in mehreren Teilbeträgen. Urlaubsentgelt ist nicht enthalten. Nichts davon erscheint im Nachweis.</p></div>

    <div class="hsec"><div class="eb">10 · Vertragstage</div>
      <p>In deinem Vertrag steht, an wie vielen Tagen im Jahr du eingesetzt werden kannst. Trag diese Zahl unter <b>Einstellungen</b> bei <b>Arbeitstage laut Vertrag</b> ein. Dann zeigt dir die App in der Statistik und oben in den Aufträgen, wie viele Tage du im laufenden Jahr schon geleistet hast, wie viele bereits disponiert sind und wie viele noch frei bleiben.</p>
      <p>Gezählt wird jeder Tag aus deinen Aufträgen, auch aus abgerechneten, egal ob der Auftrag frei oder fest ist. Geleistet sind die Tage bis heute, disponiert die Tage danach. Stehen zwei Aufträge am selben Tag, zählt der Tag einmal. Urlaubstage zählt die App nicht mit. Die Kachel „Tage“ oben in den Aufträgen zählt dagegen alle Tage der offenen Aufträge über alle Jahre, deshalb weichen die beiden Zahlen oft voneinander ab.</p>
      <p>Bist du fest angestellt, brauchst du keine Vertragstage einzutragen. Die App zeigt dir dann unter <b>Einsatztage</b>, wie viele Tage du im laufenden Jahr geleistet hast und wie viele disponiert sind.</p>
      <p class="tip">Am 1. Januar beginnt die Zählung von vorn. Liegst du über der Zahl aus dem Vertrag, steht das rot in der Statistik.</p></div>

    <div class="hsec"><div class="eb">11 · Feiertage</div>
      <p>Die App kennt die gesetzlichen Feiertage in Deutschland je Bundesland, in der Schweiz je Kanton und in 13 weiteren Ländern. Oster- und Pfingstsonntag zählen immer, weil der Tarif sie ausdrücklich nennt.</p>
      <p>Als freier Mitarbeiter zählt der Feiertag dort, wo du arbeitest. Beim Dispo-Import erkennt die App das Land aus dem Produktionsort, im Auftrag änderst du es unter <b>Feiertage nach</b>. Erkennt sie nichts, gilt dein üblicher Arbeitsort aus den <b>Einstellungen</b>. Als fest Angestellter gilt immer der Dienstort, den du dort einträgst.</p>
      <p>Im Tag steht, ob er ein Feiertag ist. Stimmt das nicht, leerst du das Feld. Für ein Land, das die App nicht kennt, trägst du den Namen selbst ein. Regionale Feiertage in Spanien, etwa Gründonnerstag in den meisten Regionen, und Ortsfeiertage in Italien kennt die App nicht, die trägst du ebenfalls selbst ein.</p>
      <p class="tip">Im PDF bekommt ein Feiertag ein Sternchen beim Datum, in der Mail den Zusatz „Feiertag“. Unten stehen alle Feiertage mit Namen. So sieht die Disposition, wo der Zuschlag fällig ist.</p></div>

    <button class="btn" id="helpBack" style="margin-top:6px">Verstanden</button>`);
  document.getElementById("helpBack").onclick=openSettings;
}

/* ===== Export ===== */
function orderReportText(o){
  const L=["ZEITNACHWEIS",o.titel||"Ohne Titel"];
  if(o.auftragsnr)L.push("Auftrag: "+o.auftragsnr);if(o.prodNummer)L.push("Prod.-Nr.: "+o.prodNummer);if(o.kostentraeger)L.push("Kostenträger: "+o.kostentraeger);if(o.produktionsort)L.push("Ort: "+o.produktionsort);const _mit=o.mitarbeiter||S.absender;if(_mit)L.push("Mitarbeiter: "+_mit);L.push("");
  o.days.slice().sort((a,b)=>(a.datum||"").localeCompare(b.datum||"")).forEach(d=>{const c=dayCalc(d);
    L.push(fmtDateLong(d.datum));
    L.push("  Einsatz: "+(d.einsatz||"–")+"–"+(d.ende||"–")+"   Pause: "+(c.pause===0?"keine":c.pause+" Min")+"   Netto: "+fmtMin(c.netto)+" Std   Überstd.: "+fmtSigned(c.ot));
    if(d.anreise||d.rueck)L.push("  Anreise: "+(d.anreise||"–")+"   Rückreise: "+(d.rueck||"–"));
    if(c.tg.state==="ok")L.push("  Abwesend: "+fmtMin(c.absence)+" Std → Tagegeld möglich (bitte prüfen)");
    L.push("");});
  L.push("─────────────");L.push("Summe Netto: "+fmtMin(orderNetto(o))+" Std");L.push("Summe Überstunden: "+fmtSigned(orderOT(o))+" Std");
  const tgd=orderTGdays(o);if(tgd>0)L.push("Tagegeld-fähige Tage: "+tgd+" (bitte selbst prüfen, Antrag binnen 6 Monaten)");
  L.push("(Soll "+fmtMin(S.sollMin)+" Std/Tag · ohne Gewähr)");return L.join("\n");
}
function flipName(n){const p=String(n||"").split(",");return p.length===2?clean(p[1])+" "+clean(p[0]):clean(n);}
function initials(n){const p=clean(flipName(n)).split(/\s+/).filter(Boolean);if(!p.length)return "";const a=p[0][0].toUpperCase();const b=p.length>1?p[p.length-1][0].toUpperCase():"";return a+"."+(b?b+".":"");}
function fmtDE(dt){const d=dt||new Date();return String(d.getDate()).padStart(2,"0")+"."+String(d.getMonth()+1).padStart(2,"0")+"."+d.getFullYear();}
function equipText(o){return [...(o.equipment||[]),o.notiz].filter(Boolean).join(", ");}
/* Grenzuebertritte fuer den Nachweis: eine kurze Zeile, nur wenn welche erfasst sind.
   Landet unten im Notizfeld, nicht in der Zeitentabelle - die Arbeitszeit bleibt davon unberuehrt. */
function grenzText(o){
  const z=o.days.slice().sort((a,b)=>(a.datum||"").localeCompare(b.datum||""))

document.getElementById("pdfInput").addEventListener("change",async e=>{
  const file=e.target.files[0];e.target.value="";if(!file)return;
  if(typeof pdfjsLib==="undefined"){toast("PDF-Bibliothek nicht geladen (online sein)");return;}
  toast("PDF wird gelesen…");
  try{pdfjsLib.GlobalWorkerOptions.workerSrc="vendor/pdf.worker.min.js";
    const buf=await file.arrayBuffer();const pdf=await pdfjsLib.getDocument({data:buf}).promise;let text="",hints=null;
    for(let p=1;p<=pdf.numPages;p++){const pg=await pdf.getPage(p);const tc=await pg.getTextContent();
      const lines=[];tc.items.forEach(it=>{if(typeof it.str!=="string"||it.str===""||!it.transform)return;const x=it.transform[4],y=it.transform[5];let ln=lines.find(l=>Math.abs(l.y-y)<=4);if(!ln){ln={y,parts:[]};lines.push(ln);}ln.parts.push({x,w:it.width||0,s:it.str});});
      lines.sort((a,b)=>b.y-a.y);

         Wörter/Nummern oft in berührende Stücke ("A"+"2748455", "455"+"11333") */
      const pageText=lines.map(l=>{const ps=l.parts.sort((a,b)=>a.x-b.x);let s="",end=null;ps.forEach(p=>{if(end!==null&&p.x-end>1)s+=" ";s+=p.s;end=p.x+p.w;});return s;}).join(" ");
      text+=(pageText||tc.items.map(i=>i.str).join(" "))+" ";
      if(p===1)hints=labelHints(tc.items);}
    const meta=parseZDF(text);
    if(hints){if(hints.titel)meta.titel=hints.titel;if(hints.ort)meta.produktionsort=hints.ort;}
    confirmImport(meta,file.name);
  }catch(err){console.error(err);toast("PDF konnte nicht gelesen werden");}
});
function clean(s){return String(s||"").replace(/\s+/g," ").trim();}
function cleanName(n){return clean(n).replace(/\s*\.{2,3}\s*$/,"").replace(/\s+,/,",").trim();}

   Titel/Produktionsort stehen im ZDF-Formular exakt unter ihrer Beschriftung –
   zuverlässiger als jede Fließtext-Heuristik (17/25 Ort-Fehlschläge im Real-Korpus). */
function labelHints(items){
  const its=[];items.forEach(it=>{if(typeof it.str!=="string"||!it.str.trim()||!it.transform)return;its.push({s:it.str,x:it.transform[4],y:it.transform[5],w:it.width||0});});
  const find=re=>its.find(i=>re.test(i.s.trim()));
  const grab=(lab,xEnd)=>{
    if(!lab)return "";
    const cand=its.filter(i=>i.y<lab.y-3&&i.y>lab.y-30&&i.x>=lab.x-2&&i.x<xEnd-2&&!/^(Personalleistung|Personal-Disposition|Auftragsbemerkung)/.test(i.s.trim()));
    cand.sort((a,b)=>b.y-a.y||a.x-b.x);
    let s="",end=null,lastY=null;
    cand.forEach(c=>{if(lastY!==null&&Math.abs(c.y-lastY)>3){s+=" ";end=null;}if(end!==null&&c.x-end>1)s+=" ";s+=c.s;end=c.x+c.w;lastY=c.y;});
    return clean(s);

  const tit=find(/^Titel$/),pn=find(/^Prod\.?\s*Nummer$/),ort=find(/^Produktionsort$/),send=find(/^SendeRedaktion$/);
  return { titel:grab(tit,pn?pn.x:Infinity), ort:grab(ort,send?send.x:Infinity) };

function parseMeta(t){
  const o={titel:"",auftragsnr:"",prodNummer:"",kostentraeger:"",produktionsort:""};let m;
  if(m=t.match(/Auftrag\s+(A\d{6,8})/i))o.auftragsnr=m[1];
  o.kostentraeger=(t.match(/KTDL:?\s*(\d{6,9})/i)||[])[1]||(t.match(/\b(80\d{6})\b/)||[])[1]||"";
  const nums=[...t.matchAll(/\b(\d{8})\b/g)].map(x=>x[1]);
  o.prodNummer=nums.find(n=>n!==o.kostentraeger)||"";
  if(m=t.match(/(?:Kostenträger DL|Telefon|\/Tel\.|\bDL)\s+([A-ZÄÖÜ][\wäöüßÄÖÜ0-9 .,\/\-]{2,50}?)\s+\d{8}\b/))o.titel=clean(m[1]);

function parsePersons(t){
  const year=(t.match(/\d{2}\.\d{2}\.(20\d{2})/)||[])[1]||(t.match(/\b(20\d{2})\b/)||[])[1]||(new Date().getFullYear()+"");
  const sec=t.search(/Personal-Disposition|Personalleistung/);const body=sec>=0?t.slice(sec):t;
  const nameRe=/[A-ZÄÖÜ][A-Za-zäöüßÄÖÜ-]+,\s+[A-ZÄÖÜ][A-Za-zäöüßÄÖÜ]*\.{0,3}/g;
  const stops=/(Kamera\/Geräte|Kamera-|Dienstbeginn|Bemerkungen|KFZ|Seite \d|Personal-Disposition|Aktualisierungszeitpunkt)/;
  const anchors=[];let m;
  while(m=nameRe.exec(body))anchors.push({name:m[0],end:m.index+m[0].length,start:m.index});
  const persons={};const order=[];
  anchors.forEach((a,i)=>{
    let end=i+1<anchors.length?anchors[i+1].start:body.length;
    const rest=body.slice(a.end,end),st=rest.search(stops);
    if(st>=0)end=a.end+st;
    const slice=body.slice(a.end,end);
    const dm=slice.match(/(\d{2})\.(\d{2})\./);
    const times=[...slice.matchAll(/(\d{1,2}:\d{2})/g)].map(x=>x[1]);
    if(!dm||!times.length)return;
    const iso=year+"-"+dm[2]+"-"+dm[1];
    const einsatz=times[0].padStart(5,"0"),ende=times[times.length-1].padStart(5,"0");
    let anreise="",rueck="";if(times.length>=4){anreise=times[1].padStart(5,"0");rueck=times[2].padStart(5,"0");}
    const nm=cleanName(a.name);

    const pre=body.slice(Math.max(0,a.start-160),a.start).replace(/^[\s\S]*(\d{1,2}:\d{2}|---)/,"");
    if(!persons[nm]){persons[nm]={name:nm,days:[],seen:new Set(),funktion:funktionAus(pre)};order.push(nm);}

/* Welche Person der Dispo bin ich? (V4.2, Review A8) Nachname = Teil vor dem Komma, jedes seiner Wörter muss als ganzes
   Wort im eigenen Namen stehen (Komma, Groß-/Kleinschreibung und Unicode-Form egal). So passt auch ein abgeschnittenes "Muster, Eri".
   Haben beide Seiten einen Vornamen, muss er passen: als Anfang in beide Richtungen ("Eri", "Erika", "E." zu "Erika"),
   verglichen nur mit den eigenen Wörtern außerhalb des Nachnamens. Widerspricht er, ist es ein Kollege gleichen Namens.
