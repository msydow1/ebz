<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Zeiterfassung">
<meta name="theme-color" content="#15171A">
<title>Zeiterfassung</title>
<!-- Zeiterfassung V4.5.1 · Design "Amber Editorial" -->
<!-- impeccable-disable single-font -- Nutzer wählte beim V1.2-Redesign bewusst "Inter durchgängig" (eine Familie, tabular-nums für Zeiten) -->
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link href="vendor/inter.css" rel="stylesheet">
<script src="vendor/pdf.min.js"></script>
<script src="vendor/jspdf.umd.min.js"></script>
<style>
/* ===== Tokens (Handoff "Amber Editorial") ===== */
:root{--bg:#15171A;--surface:#1E2228;--surface-2:#262B31;--field:#22262C;--field-input:#34393F;--line:#2A2F35;--line-strong:#3A4048;--text:#E8E8E8;--text-strong:#FFFFFF;--muted:#8A9099;--silver:#C3C3C3;--faint:#6E747B;--accent:#FA7D19;--accent-soft:rgba(250,125,25,.14);--accent-line:rgba(250,125,25,.28);--accent-ink:#B8925F;--pos:#54BE86;--pos-soft:rgba(84,190,134,.14);--pos-line:rgba(84,190,134,.40);--info:#6B87A2;--info-soft:rgba(107,135,162,.14);--info-line:rgba(107,135,162,.32);--danger:#E0705C;--on-accent:#15171A;--glow:0 8px 24px rgba(250,125,25,.30);--cardshadow:none;--holo-1:#FA7D19;--holo-2:#FFC08A;--holo-3:#F2A9CF;--holo-4:#B6A8F4;--holo-5:#8ED8EA;--urlaub-has-bg:rgba(250,125,25,.14);--urlaub-has-fg:#FA7D19}
body.light{--bg:#F5F4F1;--surface:#FFFFFF;--surface-2:#EFEDE8;--field:#E9E7E1;--field-input:#E9E7E1;--line:#DEDBD3;--line-strong:#C9C5BC;--text:#28251F;--text-strong:#141210;--muted:#7A756C;--silver:#545048;--faint:#9B968C;--accent:#E86F0C;--accent-soft:rgba(232,111,12,.12);--accent-line:rgba(232,111,12,.30);--accent-ink:#B07A3C;--pos:#1E9E60;--pos-soft:rgba(30,158,96,.12);--pos-line:rgba(30,158,96,.45);--info:#49688C;--info-soft:rgba(73,104,140,.10);--info-line:rgba(73,104,140,.30);--danger:#C24E3B;--on-accent:#FFFFFF;--glow:0 8px 24px rgba(232,111,12,.32);--cardshadow:0 2px 14px rgba(0,0,0,.05);--holo-1:#E86F0C;--holo-2:#E8955A;--holo-3:#C9679D;--holo-4:#7C6AD0;--holo-5:#3C9DB8;--urlaub-has-bg:#94520C;--urlaub-has-fg:#FFFFFF}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;max-width:100%;overflow-x:hidden}
body{background:var(--bg);color:var(--text);font-family:"Inter",-apple-system,system-ui,sans-serif;font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
.app{max-width:560px;margin:0 auto;min-height:100vh}
/* Bar */
.bar{position:sticky;top:0;z-index:30;background:rgba(21,23,26,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:calc(env(safe-area-inset-top) + 14px) 20px 12px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;min-height:58px}
body.light .bar{background:rgba(245,244,241,.85)}
/* Logo V4.0 (Richtung 3c "Spanne Hologramm"): Zeiger auf Dienstbeginn in currentColor, Bogen = gelaufene Zeit */
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0;color:var(--text)}
.brand svg{width:28px;height:28px;flex:none;display:block}
.brand-name{font-weight:700;font-size:16px;line-height:1;letter-spacing:-.3px;color:var(--text-strong);white-space:nowrap}
.eyebrow{font-size:9px;font-weight:600;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted)}
.iconbtn{width:36px;height:36px;border-radius:10px;border:none;background:transparent;color:var(--muted);display:flex;align-items:center;justify-content:center;flex:none;padding:0}
.iconbtn:active{background:var(--surface)}
.backlink{background:none;border:none;color:var(--accent);font-family:inherit;font-size:13px;font-weight:600;padding:0}
/* View */
.view{padding:22px 20px calc(env(safe-area-inset-bottom) + 44px);animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.pagehead{margin-bottom:16px}
.display{font-weight:800;font-size:32px;letter-spacing:-1px;line-height:1.05;color:var(--text-strong);margin-top:6px}
.dtitle{font-weight:800;font-size:27px;letter-spacing:-.7px;line-height:1.12;color:var(--text-strong);margin-top:6px}
/* KPI-Kacheln */
.kpis{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:0 0 14px}
.kpis.two{grid-template-columns:1fr 1fr}
.kpis.verd .kpi{display:flex;flex-direction:column;justify-content:space-between}
.kpis.verd .kpi .n{font-size:19px;white-space:nowrap}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:13px 12px;min-width:0}
.kpi .l{font-size:9px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted)}
.kpi .n{font-weight:800;font-size:22px;margin-top:3px;color:var(--text-strong)}
.kpi.acc{background:var(--accent-soft);border-color:var(--accent-line)}
.kpi.acc .l{color:var(--accent-ink)}
.kpi.posk{background:var(--pos-soft);border-color:var(--pos-line)}
.kpi.posk .n{color:var(--pos)}
.kpi.warnk{border-color:var(--danger)}
.kpi.warnk .l,.kpi.warnk .n{color:var(--danger)}
.kpi.warnk .l{letter-spacing:.8px;white-space:nowrap}/* "Über Vertrag" passt so auch bei 375 px in eine Zeile */
.vbar{display:flex;height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin:-6px 0 14px}
.vbar span{display:block;height:100%}
.vbar .g{background:var(--accent)}
.vbar .d{background:var(--accent-line)}
.note.vline{margin:-6px 0 14px}
.note.warnline{color:var(--accent-ink);margin:-8px 0 16px}
.vwarn{color:var(--danger);font-weight:700;white-space:nowrap}
/* Hero */
.hero{background:linear-gradient(135deg,var(--accent-soft),transparent);border:1px solid var(--accent-line);border-radius:16px;padding:22px 18px;margin-bottom:14px}
.hero .l{font-size:9px;font-weight:600;letter-spacing:1.4px;text-transform:uppercase;color:var(--accent-ink)}
.hero .n{font-weight:800;font-size:46px;letter-spacing:-1.5px;line-height:1.05;margin-top:4px;color:var(--text-strong)}
.hero.small{padding:16px 18px}
.hero.small .n{font-size:30px;letter-spacing:-1px}
.hero .hsub{font-size:12px;font-weight:500;color:var(--muted);margin-top:6px}
/* Segment-Tabs */
.segs{display:flex;background:var(--field);border-radius:12px;padding:4px;margin:0 0 18px}
.segs button{flex:1;padding:10px 0;border:none;border-radius:9px;background:transparent;color:var(--muted);font-family:inherit;font-size:13px;font-weight:700}
.segs button.on{background:var(--accent);color:var(--on-accent)}
/* Auftragskarten */
.cards{display:flex;flex-direction:column;gap:10px;margin-bottom:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--cardshadow);cursor:pointer}
.card:active{background:var(--surface-2)}
.cards.done .card{background:var(--surface-2);box-shadow:none}
.cards.done .card:active{background:var(--surface)}
.section-h+.cards{margin-top:8px}
/* Reiter Urlaub (Spec 2026-10-23, Variante B) */
.hero .hsub.neg{color:var(--danger)}
.hero .hsub[hidden],.tgbox[hidden]{display:none}
.hero .linkbtn.left{margin:-6px 0 -14px}
.btn.wide{width:100%;margin:0 0 12px}
.ucard{padding:14px 15px}
.ucard .ut{font-size:15px;font-weight:700;color:var(--text-strong)}
.ucard .us{font-size:12px;color:var(--muted);margin-top:2px}
.ucard .ust{font-size:13px;color:var(--text);margin-top:8px}
.ucard .ust.ok{color:var(--pos)}.ucard .ust.wait,.ucard .ust.warn{color:var(--accent-ink)}
.ucard .ustep{width:100%;margin:10px 0 0}
.ucard .linkbtn.uneben{margin:2px auto -10px}
.ucard .uz{display:flex;flex-wrap:wrap;gap:0 14px;margin-top:4px}
.ucard .uz .linkbtn{margin:0;padding:8px 0;min-height:36px;font-size:14px}
.utage{margin:4px 0 2px}
.utage .chips button{min-height:44px;min-width:64px}
.tgbox+.cards{margin-top:12px}
.note.uinfo{font-size:13px;color:var(--text);margin:-4px 0 6px}
.note.uinfo:empty{display:none}
.note.uinfo.warnline{color:var(--accent-ink)}
.uhinweis{font-size:14px;line-height:1.55;color:var(--text);margin:-4px 0 18px;overflow-wrap:anywhere}
.umon{display:flex;justify-content:space-between;align-items:center;margin:4px 0 8px;font-size:16px;font-weight:700;color:var(--text-strong)}
.umon .iconbtn{color:var(--accent);font-size:22px;font-family:inherit}
.umon .iconbtn:disabled{color:var(--faint);opacity:.45}
.ucal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center}
.ucal i{font-style:normal;font-size:11px;font-weight:600;color:var(--muted);padding-bottom:2px}
.ucal button{min-width:0;min-height:44px;padding:0;border:none;border-radius:10px;background:var(--surface);color:var(--text);font-family:inherit;font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;opacity:1;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
.ucal button:active{background:var(--surface-2)}
.ucal button:disabled{cursor:default}
.ucal button.gr,.ucal button.ft{background:transparent;color:var(--faint)}
.ucal button.ft{text-decoration:line-through}
.ucal button.has{background:var(--urlaub-has-bg);color:var(--urlaub-has-fg)}
.ucal button.sel,.ucal button.sel:active{background:var(--accent);color:var(--on-accent)}
.ucal button.ein{box-shadow:inset 0 0 0 1.5px var(--accent-ink)}
.uleg{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:11px;color:var(--muted);margin:10px 0 0;line-height:1.6}
.uleg u{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.uleg u.has{background:var(--urlaub-has-bg)}.uleg u.sel{background:var(--accent)}.uleg u.ein{box-shadow:inset 0 0 0 1.5px var(--accent-ink)}
.ubar{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:13px 15px;margin-top:12px;box-shadow:var(--cardshadow)}
.ubar .z{font-size:15px;font-weight:700;color:var(--text-strong)}
.ubar .r{font-size:13px;color:var(--muted);margin-top:2px}
.ubar .r.neg{color:var(--danger)}
.ubar ul{margin:6px 0 0;padding-left:18px;font-size:13px;color:var(--text)}
.ubar .btn{margin:12px 0 0}
.usteps{font-size:12px;color:var(--muted);margin:14px 0 4px;padding-left:20px;line-height:1.6}
.card .eyeline{font-size:9px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.card .toprow{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.card .titel{font-weight:700;font-size:16px;letter-spacing:-.3px;line-height:1.25;color:var(--text-strong);margin:0;min-width:0}
.card .num{font-weight:800;font-size:20px;flex:none}
.cardgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;border-top:1px solid var(--line);margin-top:12px;padding-top:12px}
.cardgrid .l{font-size:9px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted)}
.cardgrid .v{font-weight:700;font-size:15px;margin-top:2px;color:var(--text-strong)}
.cardgrid.big .v{font-size:16px}
.cardfoot{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:11px;font-weight:500;color:var(--faint);margin-top:12px}
.cardfoot .open{margin-left:auto;font-size:12px;font-weight:600;color:var(--accent);white-space:nowrap}
.cards.done .cardfoot{margin-top:10px}
.cards.done .cardfoot .open{color:var(--muted)}
.cards.done .titel{color:var(--muted)}
.cards.done .num{color:var(--faint)!important}
/* Sektionen + Zeilen */
.section-h{display:flex;align-items:baseline;justify-content:space-between;margin:24px 0 4px}
.section-h h3{font-weight:700;font-size:12px;margin:0;letter-spacing:.5px;text-transform:uppercase;color:var(--faint)}
.section-h .tot{font-size:12px;font-weight:600;color:var(--silver)}
.srow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 0;border-bottom:1px solid var(--line)}
.srow .nm{font-size:15px;font-weight:700;color:var(--text-strong);margin:0;min-width:0}
.srow .nm small{display:block;font-size:12px;font-weight:500;color:var(--faint);margin-top:2px}
.srow .v{font-weight:800;font-size:18px;flex:none}
.srow .chev{color:var(--line-strong);font-size:15px;flex:none}
.srow.dim .nm{color:var(--muted)}
.srow.dim .v{color:var(--faint)!important}
/* Tageszeilen */
.day{padding:14px 0;border-bottom:1px solid var(--line);cursor:pointer}
.day .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.day .date{font-weight:700;font-size:15px;color:var(--text-strong)}
.day .ot{font-weight:800;font-size:16px}
.dayDel{width:30px;height:30px;border-radius:8px;border:none;background:transparent;color:var(--danger);display:flex;align-items:center;justify-content:center;flex:none;padding:0}
.dayDel:active{background:rgba(224,112,92,.15)}
.day .line{font-size:12px;font-weight:500;color:var(--silver);margin-top:4px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
/* Key/Value */
.kv{margin:14px 0 0}
.kv .row{display:flex;justify-content:space-between;gap:14px;padding:9px 0;border-bottom:1px solid var(--line)}
.kv .k{font-size:12px;font-weight:500;color:var(--muted);flex:none}
.kv .w{font-size:13px;font-weight:500;color:var(--silver);text-align:right;min-width:0;overflow-wrap:anywhere}
/* Buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:16px;border-radius:14px;border:none;font-family:inherit;font-size:15px;font-weight:700;background:var(--accent);color:var(--on-accent);box-shadow:var(--glow);margin-bottom:10px}
.btn:active{filter:brightness(.94)}
.btn:disabled{opacity:.4;cursor:default;filter:none}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line-strong);box-shadow:none;font-weight:600;padding:13px;border-radius:12px}
.btn.ghost:active{background:var(--surface);filter:none}
.btn.danger{background:transparent;color:var(--danger);border:1px solid rgba(224,112,92,.4);box-shadow:none;font-weight:600;padding:13px;border-radius:12px}
body.light .btn.danger{border-color:rgba(194,78,59,.4)}
.btn.info{background:var(--info);color:#fff;box-shadow:none;border-radius:8px;padding:9px;font-size:12px;margin:0}
.btnrow{display:flex;gap:10px}
.btnrow .btn{margin-bottom:10px}
.topbtns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));margin:0 0 18px}/* Raster statt flex:1, sonst ist der umrandete Knopf 2 px breiter */
.topbtns .btn{margin:0;padding:13px 6px;border-radius:12px;white-space:nowrap}
.sub{font-size:11px;color:var(--faint);text-align:center;margin:2px 0 18px;line-height:1.5}
/* Chips */
.chip{font-size:10px;font-weight:600;padding:3px 8px;border-radius:7px;background:var(--field);color:var(--muted);border:1px solid var(--line);flex:none}
.chip.pos{background:var(--pos-soft);border-color:var(--pos-line);color:var(--pos)}
.chip.nw{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{border:1px solid var(--line);background:var(--field);color:var(--muted);font-family:inherit;font-size:12px;font-weight:600;padding:9px 11px;border-radius:8px}
.chips button.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
/* Farbcodierung */
.ot-pos{color:var(--pos)!important}
.ot-zero{color:var(--muted)!important}
.ot-neg{color:var(--info)!important}
/* Backup-Banner */
.remind{border:1px solid var(--info-line);background:var(--info-soft);border-radius:12px;padding:13px 14px;margin:0 0 16px}
.remind b{display:block;font-size:12px;font-weight:600;color:var(--info);margin-bottom:3px}
.remind p{margin:0 0 10px;font-size:11px;color:var(--silver);line-height:1.5}
.remind .btn.ghost{margin:0;padding:9px;font-size:12px;border-radius:8px}
/* Sheet */
.scrim{position:fixed;inset:0;background:rgba(10,9,8,.55);z-index:50;display:none;backdrop-filter:blur(3px)}
.scrim.on{display:block;animation:fadein .25s ease}
.scrim.out{animation:fadeout .2s ease forwards}
.sheet{position:absolute;left:0;right:0;bottom:0;margin:0 auto;background:var(--bg);width:auto;max-width:560px;border-radius:22px 22px 0 0;border-top:1px solid var(--line-strong);max-height:92vh;overflow-y:auto;overflow-x:hidden;padding:10px 20px calc(env(safe-area-inset-bottom) + 44px);animation:up .3s cubic-bezier(.2,.8,.2,1)}
.sheet.out{animation:down .2s ease forwards}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@keyframes down{to{transform:translateY(100%)}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes fadeout{to{opacity:0}}
.grip{width:38px;height:5px;border-radius:3px;background:var(--line-strong);margin:8px auto 18px}
.sheet h3{font-weight:800;font-size:26px;letter-spacing:-.7px;margin:0 0 18px;color:var(--text-strong)}
/* Section-Label im Sheet darf nicht vom Sheet-Titel-Stil überschrieben werden */
.sheet .section-h h3{font-weight:700;font-size:12px;letter-spacing:.5px;text-transform:uppercase;color:var(--faint);margin:0}
/* Felder */
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;font-weight:600}
.field input,.field textarea{width:100%;min-width:0;max-width:100%;-webkit-appearance:none;appearance:none;padding:12px 13px;border-radius:10px;border:1px solid var(--line-strong);background:var(--field-input);color:var(--text-strong);font-family:inherit;font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.field textarea{resize:none;line-height:1.5;font-variant-numeric:normal}
.field input.txt{font-variant-numeric:normal}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--accent-line);background:var(--surface-2)}
.field input:disabled{opacity:.4}
.field select{width:100%;min-width:0;max-width:100%;-webkit-appearance:none;appearance:none;padding:12px 34px 12px 13px;border-radius:10px;border:1px solid var(--line-strong);background-color:var(--field-input);color:var(--text-strong);font-family:inherit;font-size:15px;font-weight:600;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 52%,calc(100% - 13px) 52%;background-size:5px 5px,5px 5px;background-repeat:no-repeat}
.field select:focus{outline:none;border-color:var(--accent-line)}
.field select:disabled{opacity:.4}
.field input[type="date"]::-webkit-calendar-picker-indicator{filter:invert(.6) sepia(1) saturate(2.2) hue-rotate(348deg);opacity:.9}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
/* Timeboxen */
.timebox{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.timebox.acc{background:var(--accent-soft);border-color:var(--accent-line)}
.timebox .tl{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:9px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);margin-bottom:12px}
.timebox.acc .tl{color:var(--accent-ink)}
.timebox .tl .hint{font-size:10px;font-weight:500;letter-spacing:0;text-transform:none;color:var(--muted)}
.tfield{background:var(--field-input);border:1px solid var(--line-strong);border-radius:10px;padding:7px 6px 5px;text-align:center;min-width:0}
.timebox.acc .tfield{background:var(--surface)}
.tfield .tlbl{display:block;font-size:9px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted)}

.nwwrap:empty{margin:0}
.tgbox.nw{background:var(--accent-soft);border-color:var(--accent-line)}

/* Anleitung */

.hsec .tip{background:var(--field);border-radius:10px;padding:10px 12px;font-size:12.5px;color:var(--muted);margin-top:12px}

/* Import-Vorschau */
.implist .irow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.implist .irow .d{font-size:14px;font-weight:700;color:var(--text-strong)}

.cscrim{position:fixed;inset:0;background:rgba(10,9,8,.62);z-index:120;display:none;align-items:center;justify-content:center;padding:24px;backdrop-filter:blur(3px)}

.crow .btn{margin:0;padding:12px;font-size:13px}
.crow .btn.do{background:var(--danger);color:#fff;border:none;box-shadow:none;font-weight:700;border-radius:12px}

.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 46px);transform:translateX(-50%) translateY(20px);width:min(520px,calc(100% - 40px));background:var(--field);border:1px solid var(--accent-line);color:var(--text);padding:13px 15px;border-radius:12px;font-size:12px;font-weight:600;text-align:center;z-index:80;opacity:0;transition:.3s;pointer-events:none;box-shadow:0 10px 40px rgba(0,0,0,.4)}

/* Sonstiges */
.note{font-size:11px;color:var(--faint);line-height:1.5;margin:8px 0 0}
.note b{color:var(--muted);font-weight:600}
/* Direkte Wege in die Einstellungen (V4.4): ruhige Textlinks mit 44 px Tippfläche */
.linkbtn{display:block;margin:0 auto 18px;background:none;border:none;color:var(--accent);font-family:inherit;font-size:12px;font-weight:600;padding:14px 8px;min-height:44px;touch-action:manipulation}
.linkbtn.left{margin:-8px 0 8px;padding:14px 0;text-align:left}

.divider{height:1px;background:var(--line);margin:18px 0}

<body>
<div class="app">
  <div class="bar" id="bar"></div>
  <div class="view" id="view"></div>
  <div class="foot">
    <div class="foot-note">Daten bleiben nur auf diesem Gerät · alle Angaben ohne Gewähr</div>
    <div class="foot-v">Zeiterfassung <b>V4.5.1</b></div>
  </div>
</div>
<input type="file" id="pdfInput" accept="application/pdf" class="hidden">
<input type="file" id="backupInput" accept="application/json,.json" class="hidden">
<div class="scrim" id="scrim"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<div class="cscrim" id="confirmBox"><div class="cdlg"><p class="ctitle"></p><p class="cmsg"></p><div class="crow"><button id="cNo" class="btn ghost">Abbrechen</button><button id="cYes" class="btn do">Löschen</button></div></div></div>

<script>
"use strict";
/* ===== Persistenz (Fallback falls localStorage gesperrt) ===== */
const KEY="zeiterfassung_v2";
const Store={mem:{},load(){try{const r=localStorage.getItem(KEY);return r?JSON.parse(r):null}catch(e){return this.mem[KEY]||null}},save(o){try{localStorage.setItem(KEY,JSON.stringify(o))}catch(e){this.mem[KEY]=o}}};
const KEY_PREV="zeiterfassung_v2_prev";  /* V4.4.2: Stand vor dem letzten Einlesen eines Backups, zurückholbar in den Einstellungen */
/* === DATEN-BEGIN === Datensicherung (V4.4.2, Review A3). Reine Funktionen ohne DOM, getestet in tests/daten.test.mjs. */
function istObj(x){return !!x&&typeof x==="object"&&!Array.isArray(x);}
/* Datum TT.MM.JJJJ aus einem Zeitstempel (Ortszeit), leer bei Unsinn. */
function datumAus(ts){const d=new Date(ts||"");return ts&&!isNaN(d)?String(d.getDate()).padStart(2,"0")+"."+String(d.getMonth()+1).padStart(2,"0")+"."+d.getFullYear():"";}
/* Beschädigten Stand abfangen: Der Start darf an keinem Eintrag scheitern. Kein Objekt wird leer, orders ohne Array leer, Einträge
   ohne Objekt fallen weg, ein Auftrag ohne days-Array bekommt eine leere Liste, ein Datum, das kein Text ist, wird leer (Statistik und
   Vertragstage rechnen mit d.datum.slice), settings ohne Objekt wird leer. */
function standBereinigen(db){
  if(!istObj(db))db={};
  db.orders=Array.isArray(db.orders)?db.orders.filter(istObj):[];
  db.orders.forEach(o=>{o.days=Array.isArray(o.days)?o.days.filter(istObj):[];o.days.forEach(d=>{if(d.datum!=null&&typeof d.datum!=="string")d.datum="";});});
  /* Urlaub: nur echte Kalendertage (2027-02-31 fällt weg), Ende nicht vor Beginn, beides im selben Jahr, ID auf sichere Zeichen begrenzt (sie landet in der Kalenderdatei). */
  const ISO=/^\d{4}-\d{2}-\d{2}$/,ST=["geplant","beantragt"];
  const tag=x=>{if(typeof x!=="string"||!ISO.test(x))return false;const d=new Date(x+"T00:00:00Z");return !isNaN(d)&&d.toISOString().slice(0,10)===x;};
  const belegt=new Set();
  db.urlaub=(Array.isArray(db.urlaub)?db.urlaub:[]).filter(u=>istObj(u)&&tag(u.von)&&tag(u.bis)&&u.bis>=u.von&&u.von.slice(0,4)===u.bis.slice(0,4)).map(u=>({
    id:String(u.id||"").replace(/[^A-Za-z0-9-]/g,"").slice(0,40)||("u"+u.von.replace(/-/g,"")),von:u.von,bis:u.bis,
    stand:u.stand==="genehmigt"?"beantragt":ST.includes(u.stand)?u.stand:"geplant",formular:u.formular==="613"||u.formular==="627"?u.formular:"",
    ausgefuelltAm:tag(u.ausgefuelltAm)?u.ausgefuelltAm:"",beantragtAm:tag(u.beantragtAm)?u.beantragtAm:"",
    antragId:String(u.antragId??"").replace(/[^A-Za-z0-9-]/g,"").slice(0,40),
    antragNr:u.formular==="613"?1:Number.isInteger(u.antragNr)&&u.antragNr>=1&&u.antragNr<=99?u.antragNr:0})).map(u=>{
    /* Doppelte IDs nach der Bereinigung auflösen: -2, -3 und so weiter anhängen. */
    let id=u.id,k=2;while(belegt.has(id))id=u.id+"-"+(k++);
    belegt.add(id);u.id=id;return u;});
  /* Anträge aus V4.5.0 ohne Nummer: je Datei (antragId, sonst je Urlaub) die nächste Nummer im Jahr, nach Ausfülldatum. */
  db.urlaub.filter(u=>u.formular==="627"&&!u.antragNr).sort((a,b)=>a.ausgefuelltAm.localeCompare(b.ausgefuelltAm)||a.antragId.localeCompare(b.antragId)).forEach(u=>{
    const j=u.von.slice(0,4),gleich=u.antragId&&db.urlaub.find(o=>o!==u&&o.antragId===u.antragId&&o.antragNr&&o.von.slice(0,4)===j);
    u.antragNr=gleich?gleich.antragNr:Math.max(1,...db.urlaub.filter(o=>o.von.slice(0,4)===j&&o.formular==="627").map(o=>o.antragNr))+1;});
  if(!istObj(db.settings))db.settings={};
  return db;
}
/* Ein Tag im Backup: ein Objekt, das Datum fehlt oder ist Text. */
function tagOk(d){return istObj(d)&&(d.datum==null||typeof d.datum==="string");}
/* Backup prüfen, bevor es etwas ersetzt. Format {app:"zeiterfassung", exportedAt, data} oder alt {orders, settings}. Geprüft wird
   nur, was Start und Anzeige brauchen: jeder Auftrag ein Objekt mit days-Array, jeder Tag ein Objekt mit Datum als Text, settings fehlt
   oder ist ein Objekt. Ergebnis {db, exportedAt} oder null (etwa bei einem Shopify-Export, der auch {"orders":[…]} heißt). */
function backupPruefen(j){
  const db=istObj(j)&&j.app==="zeiterfassung"?j.data:j;
  if(!istObj(db)||!Array.isArray(db.orders))return null;
  if(!db.orders.every(o=>istObj(o)&&Array.isArray(o.days)&&o.days.every(tagOk)))return null;
  if(db.urlaub!=null&&!Array.isArray(db.urlaub))return null;
  if(db.settings!=null&&!istObj(db.settings))return null;
  return {db,exportedAt:istObj(j)&&typeof j.exportedAt==="string"?j.exportedAt:""};
}
/* Text der Rückfrage beim Einlesen (zurueck=false) und beim Zurückholen (zurueck=true): Datum, Inhalt mit Zeitraum, jetziger Stand. */
function backupFrage(neu,datum,alt,zurueck){
  const zahl=(k,eins,viele)=>k+" "+(k===1?eins:viele);
  /* Urlaube so zählen, wie sie nach dem Einlesen bleiben: an einem Klon bereinigen, damit neu und alt unverändert bleiben. */
  const urlaube=db=>standBereinigen(JSON.parse(JSON.stringify(db))).urlaub.length;
  const tt=iso=>iso.slice(8,10)+"."+iso.slice(5,7)+"."+iso.slice(0,4);
  const inhalt=db=>{const ds=db.orders.flatMap(o=>(o.days||[]).map(d=>d&&d.datum)).filter(x=>typeof x==="string"&&/^\d{4}-\d{2}-\d{2}$/.test(x)).sort();
    return {a:db.orders.length,t:db.orders.reduce((s,o)=>s+(o.days||[]).length,0),von:ds[0]||"",bis:ds[ds.length-1]||""};};
  const n=inhalt(neu),a=inhalt(alt),un=urlaube(neu),ua=urlaube(alt),vom=datumAus(datum)?" vom "+datumAus(datum):"";
  const zeit=n.von?", "+tt(n.von)+(n.bis!==n.von?" bis "+tt(n.bis):""):"";
  return (zurueck?"Stand"+vom+" zurückholen?":"Backup"+vom+" einlesen?")+
    " Darin "+zahl(n.a,"Auftrag","Aufträge")+" mit "+zahl(n.t,"Tag","Tagen")+zeit+(un?(zeit?", und "+zahl(un,"Urlaub","Urlaube"):" und "+zahl(un,"Urlaub","Urlauben")):"")+"."+
    " Dein jetziger Stand mit "+zahl(a.a,"Auftrag","Aufträgen")+(ua?", "+zahl(a.t,"Tag","Tagen")+" und "+zahl(ua,"Urlaub","Urlauben"):" und "+zahl(a.t,"Tag","Tagen"))+" wird ersetzt."+
    (zurueck?" Du kannst ihn danach wieder zurückholen.":" Du kannst ihn danach in den Einstellungen zurückholen.");
}
/* Untertitel der Zeile „Vorherigen Stand zurückholen“: Datum, Aufträge und, wenn welche da sind, die Urlaube (bereinigt gezählt). */
function prevZeile(gesichertAm,db){
  const a=db.orders.length,u=standBereinigen(JSON.parse(JSON.stringify(db))).urlaub.length;
  return "gesichert am "+(datumAus(gesichertAm)||"unbekannt")+" · "+a+" "+(a===1?"Auftrag":"Aufträge")+(u?" · "+u+" "+(u===1?"Urlaub":"Urlaube"):"");
}
/* === DATEN-END === */
let DB=standBereinigen(Store.load());
const S=DB.settings;
/* Soll nach Tarif: PdTV Ziffer 6.2 i. V. m. Verguetungs-TV 2024-2026 § 6, seit 01.01.2026 7,7 Std = 462 Min ohne Pause.
   Der alte Standard 450 (7:30) wird auf 462 gehoben, ausser der Nutzer hat 450 bewusst gespeichert (S.sollEigen, gesetzt
   in saveRules). Bewusst kein "schon migriert"-Flag: Versionen bis 3.6.2 setzen 462 beim Start auf 450 zurueck; laeuft so
   eine Altversion noch einmal (z. B. aus dem Cache), holt 4.0 den Wert beim naechsten Start zurueck. */
S.sollMin??=462; if(S.sollMin===450&&S.sollEigen!==450)S.sollMin=462; S.standardPause??=30; S.abwesenheitMin??=480; S.email??=""; S.absender??=""; S.empfaenger??=""; S.theme??="dark";
S.status??="frei"; S.flink30??=390; S.flink45??=585;  /* FLINK-Schwellen: 6:30 und 9:45 */
/* Verdienst nach Tarif (V4.1, freiwillig): standardmäßig aus, Tagessätze leer, weil jeder andere Sätze hat. */

  {v:"4.5.1", t:"Urlaub einfacher", items:[

    ["Anträge mit Nummer","Deinen ersten Antrag im Jahr schickst du selbst, er ist Nummer 1. Die App zählt ab 2 weiter, und die Datei heißt zum Beispiel „Urlaubsantrag 2026 Nr 2“. So überschreibt ein neuer Antrag keinen alten."],
    ["Lehnt das ZDF einen Tag ab","Tipp im Block auf den Zeitraum und dann auf den Tag. Er fällt heraus, der Antrag bleibt. Einen anderen Tag tippst du danach im Kalender an."],

    ["Reiter bleiben stehen","Die Reiter Aufträge, Statistik und Urlaub stehen jetzt überall an derselben Stelle direkt unter der Überschrift. Beim Wechseln springt nichts mehr."],
    ["Urlaub direkt in den Kalender","Tippst du auf „In meinen Kalender übernehmen“, zeigt dein iPhone gleich deine Urlaubstage. Ein Tipp auf „Alle hinzufügen“ trägt sie ein, zum Beispiel als „ZDF Urlaub 12 von 31“."]

  {v:"4.5.0", t:"Urlaub", items:[
    ["Urlaub im Kalender antippen","Für Freie gibt es jetzt den Reiter Urlaub. Oben siehst du, wie viele Urlaubstage du im Jahr noch frei hast. Darunter tippst du im Kalender die Tage an, an denen du Urlaub willst, einzeln oder mehrere. Wochenenden und Feiertage sind grau, denn sie kosten dich keinen Urlaubstag. Dabei zählen nur deutsche Feiertage."],
    ["Oder mit Datum","Lieber mit Datum? Unter dem Kalender trägst du einen Urlaub auch mit dem ersten und dem letzten Tag ein. Die App zählt die Urlaubstage für dich."],
    ["Den Antrag füllt die App aus","Den ersten Antrag im Jahr schickst du selbst ab, weil dafür Nachweise dazugehören. In der App tippst du danach bei den Urlauben darin auf „Ja, abgeschickt“. Alle weiteren Anträge füllt die App mit dem echten Formular des ZDF für dich aus. Du unterschreibst, lässt den Fachbereich gegenzeichnen und schickst den Antrag an Freie-Mitarbeiter-3.Kreis-Urlaub@zdf.de."],
    ["Immer der nächste Schritt","Bei jedem Urlaub steht, was als Nächstes zu tun ist und bis wann der Antrag raus muss. Das ZDF will ihn spätestens 6 Wochen vor dem ersten Urlaubstag haben. Ist er abgeschickt, tippst du das einfach an."],
    ["Urlaub im iPhone-Kalender","Mit „In meinen Kalender übernehmen“ kommt jeder Urlaubstag als eigener Termin in deinen Kalender, zum Beispiel „ZDF Urlaub 12 von 31“. So siehst du auch dort, wie viele Tage du schon verplant hast."]

  {v:"4.4.2", t:"Import genauer, Backup sicherer", items:[
    ["Reisen mit Übernachtung richtig erkannt","Nennt die Dispo für einen Tag eine Fahrt mit Beginn und Ende, wird daraus jetzt eine Fahrt: am Anreisetag hin, am Rückreisetag zurück, auch bei Teil- und Restrückreise. Steht in der Bemerkung ein Tagesplan wie „05.03. Anreise“, liest die App ihn mit und wählt Mehrtägig gleich vor. Die Drehzeit beginnt nach der Ankunft und endet vor der Abfahrt."],
    ["Vorschau mit Jahr und Tagestyp","Im Import siehst du bei jedem Tag das Jahr und bei Mehrtägig den Tagestyp, bevor du speicherst. Januar-Dispos aus dem Dezember landen nicht mehr im Vorjahr."],
    ["Alle Personen erkannt","Steht in der Dispo ein Name mit abgekürztem Vornamen, rutschen seine Zeiten nicht mehr in die Zeile davor. Kamera-Assistenten erkennt die App jetzt auch in Leistungsbestätigungen."],
    ["Hin und zurück","Ein Tag mit Übernachtung und beiden Fahrten heißt auf der Tageskarte jetzt Hin und zurück."],
    ["Backup sicherer","Die App prüft eine Sicherungsdatei, bevor sie etwas ersetzt, und nennt dir Datum, Aufträge und Tage. Deinen bisherigen Stand legt sie beiseite. Unter Einstellungen › Datensicherung holst du ihn mit einem Tipp zurück."]
  ]},
  {v:"4.4.1", t:"Aufträge schneller im Griff", items:[
    ["Knöpfe oben","PDF importieren und Auftrag anlegen stehen jetzt direkt unter den Reitern. Auch bei vielen Aufträgen musst du dafür nicht mehr bis ans Ende der Liste scrollen."],
    ["Jeder Auftrag eine eigene Karte","Die Aufträge stehen jetzt einzeln untereinander. Unten rechts zeigt „Öffnen ›“, dass du die Karte antippen kannst. Abgerechnete Aufträge sehen genauso aus, nur gedämpft."],
    ["Plus zum Tagessatz","Im Verdienst heißt die dritte Kachel jetzt „Plus zum Tagessatz“. Sie zeigt, was im Monat zu deinen Tagessätzen dazukommt: die Mehrarbeit und alle Zuschläge."]
  ]},
  {v:"4.4.0", t:"Einfacher erfassen, klarer verstehen", items:[
    ["Tagestyp für jeden Tag","Oben im Tag wählst du jetzt Anreisetag, Vor Ort, Rückreisetag oder Eintägig. Ein Tipp setzt die Übernachtung und schaltet die passenden Fahrten ein oder aus. Am ersten Tag einer Reise mit Übernachtung verschwindet die Rückreise also mit einem Tipp. Neue Tage in einem mehrtägigen Auftrag starten als Vor Ort."],
    ["Grenzübertritt einfacher","Steht ein Tag auf Ausland, trägst du die Grenzzeiten sofort ein, ohne vorher etwas freizuschalten. Jedes Feld hat ein eigenes ✕ zum Leeren. Erkennt die App beim Import einen Ort im Ausland, starten die Tage gleich mit Ausland Ja."],
    ["Klarere Begriffe","Im Tag heißen die Zeitblöcke jetzt Einsatz, Drehzeit und Reisezeit. Für deine Überstunden zählt nur die Einsatzzeit minus Pause. Drehzeit und Reisezeit stehen im Nachweis und liegen innerhalb der Einsatzzeit."],
    ["Warum der Nachweis manchmal später endet","FLINK zieht über 9:45 Stunden immer 45 Minuten Pause ab, auch wenn du nur 30 gemacht hast. Damit deine echte Zeit ankommt, endet der Nachweis dann 15 Minuten später. Das siehst du jetzt auf der Tageskarte, zum Beispiel als „Nachweis 19:15 · +15 FLINK“, und im Tag steht direkt nach der Pause, wie FLINK rechnet."],
    ["Einstellungen neu sortiert","Die Einstellungen sind jetzt eine Übersicht. Dein Name, die Beschäftigung und die Vertragstage stehen unter Du und dein Vertrag. Empfänger und Mail-Text findest du unter Mail an die Disposition, deine Tagessätze unter Verdienst und Tagessätze. Aus der Statistik, dem Verdienst und dem Auftrag kommst du mit einem Tipp direkt an die richtige Stelle."],
    ["Schalter reagieren zuverlässiger","Die kleinen Schalter wie entfällt und kein Dreh lassen sich leichter treffen. Ein zweiter Tipp macht nichts mehr kaputt: Schaltest du eine Fahrt wieder ein, bevor du speicherst, kommen deine vorherigen Zeiten zurück. Ist am iPhone gerade das Zeitrad offen, schließt der erste Tipp daneben nur das Rad. Tipp danach einfach noch einmal."]
  ]},
  {v:"4.3.1", t:"Einsatztage richtig gezählt, Tagegeld genauer", items:[
    ["Zähler hängt nicht mehr an der Beschäftigung","Beim Umschalten zwischen frei und fest in den Einstellungen hat der Zähler ältere Aufträge ohne eigene Angabe mal mitgezählt und mal nicht. Jetzt zählt jeder Einsatztag aus deinen Aufträgen, egal ob frei oder fest."],
    ["Für fest Angestellte","Fest Angestellte sehen jetzt in der Statistik und oben in den Aufträgen ihre Einsatztage im laufenden Jahr, geleistet und disponiert. Eine Zahl aus dem Vertrag brauchen sie dafür nicht."],
    ["Tagegeld genauer erklärt","Bei mehrtägigen Reisen mit Übernachtung gibt es Tagegeld, es kommt aber automatisch über die Dienstreise-Abrechnung: 14 Euro für An- und Abreisetag, 28 Euro für volle Tage. Bisher stand dort „kein Anspruch“, das war ungenau. Neu ist auch der Hinweis, dass das ZDF kürzt, wenn die Produktion Essen stellt: 5,60 Euro für ein Frühstück, je 11,20 Euro für Mittag- und Abendessen. Liegt ein Tag knapp unter 8 Stunden, erinnert dich die App daran, dass die Anfahrt von zu Hause mitzählt."]
  ]},
  {v:"4.3", t:"Feiertage am Arbeitsort", items:[
    ["Feiertage in 15 Ländern","Die App kennt jetzt die gesetzlichen Feiertage am Arbeitsort: in Deutschland je Bundesland, in der Schweiz je Kanton, dazu Österreich, Italien, Slowenien, Norwegen, Schweden, Finnland, Frankreich, Andorra, Spanien, Polen, Tschechien, die Slowakei und Kroatien. Oster- und Pfingstsonntag zählen immer, so steht es im Tarif."],
    ["Welcher Ort gilt","Als freier Mitarbeiter zählt der Arbeitsort des Auftrags. Beim Dispo-Import erkennt die App das Land aus dem Produktionsort, zum Beispiel „Kranjska Gora SLO“ oder „Wengen SUI“. Sonst gilt dein üblicher Arbeitsort aus den Einstellungen. Fest Angestellte tragen dort ihren Dienstort ein, er gilt dann für alle Aufträge."],
    ["Im Nachweis markiert","Ein Feiertag bekommt im PDF ein Sternchen beim Datum, in der Mail den Zusatz „Feiertag“. Unten steht eine Zeile mit allen Feiertagen und ihren Namen. So sieht die Disposition sofort, wo der Feiertagszuschlag fällig ist. Im Tag kannst du einen Feiertag abschalten oder selbst einen eintragen."],
    ["Feiertagszuschlag im Verdienst","Wer den Verdienst nach Tarif nutzt, sieht jetzt auch den Feiertagszuschlag von 100 Prozent. Trifft er mit Nacht oder Sonntag zusammen, zählt nur der höhere."]
  ]},
  {v:"4.2", t:"Vertragstage, dein Name und geprüfte Zuschläge", items:[
    ["Vertragstage im Blick","Trag unter Einstellungen ein, wie viele Arbeitstage dein Vertrag im Jahr vorsieht. Dann siehst du in der Statistik und oben in den Aufträgen, wie viele Tage du dieses Jahr schon geleistet hast, wie viele disponiert sind und wie viele noch frei bleiben. Ohne Eintrag ändert sich nichts."],
    ["Die App kennt deinen Namen","Beim Start fragt die App jetzt, wer sie nutzt, bis ein Name gespeichert ist. Beim Dispo-Import wählt sie dich darüber aus, auch wenn dein Name in der Dispo abgeschnitten ist. Findet sie dich nicht, wählt sie niemanden vor, und du tippst an, wer du bist. Vorher hat sie in dem Fall einfach die erste Person genommen, meistens einen Kollegen."],
    ["Verdienst an echten Abrechnungen geprüft","Nacht- und Sonntagszuschlag stimmen mit echten Abrechnungen überein. Die App rundet den Stundensatz jetzt wie das ZDF, dadurch stimmen Mehrarbeit und Zuschläge in den geprüften Fällen auf den Cent. An langen Reisetagen kann sie noch abweichen. Warum, steht in der Anleitung unter Punkt 9. Die Beispiele in den Feldern für Tagessatz und Netto-Anteil zeigen jetzt übliche Spannen statt fester Zahlen."]
  ]},
  {v:"4.1", t:"Verdienst nach Tarif, freiwillig", items:[
    ["Sieh, was dir zusteht","Wenn du magst, zeigt dir die App jetzt pro Monat, was dir nach Tarif zusteht und ungefähr aufs Konto kommen sollte. Die Option ist aus. Du schaltest sie unter Einstellungen und Verdienst ein und trägst dort deine Tagessätze ein. Wie gerechnet wird, steht in der Anleitung unter Punkt 9."]
  ]},
  {v:"4.0", t:"Neues Logo, Soll nach Tarif und genauere Pausenkorrektur", items:[
    ["Neues Logo und neues App-Symbol","Oben in der App steht jetzt das neue Logo. Die Zeiger stehen auf Dienstbeginn, der Bogen ist die Zeit, die seitdem gelaufen ist. Das Symbol auf dem Home-Bildschirm tauscht das iPhone nicht von selbst aus. Wenn du das neue Symbol haben willst, mach zuerst unter Einstellungen ein Backup, denn beim Löschen vom Home-Bildschirm verschwinden auch die Daten der App. Dann löschst du die App und fügst sie in Safari neu zum Home-Bildschirm hinzu, wie in der Anleitung unter Punkt 7 beschrieben. Öffne sie über das neue Symbol und lies dort das Backup ein. Ohne diesen Schritt läuft alles weiter, nur mit dem alten Symbol."],
    ["Das Soll steht jetzt auf 7:42 Stunden","Seit dem 01.01.2026 gilt im Tarifvertrag für die auf Produktionsdauer Beschäftigten eine Woche von 38,5 Stunden, also 7,7 Stunden am Tag ohne Pause. Stand bei dir noch der alte Standard von 7:30, hat die App ihn auf 7:42 umgestellt. Mit 7:30 zeigte sie pro Tag 12 Minuten zu viel an. Hattest du selbst einen anderen Wert eingetragen, bleibt er stehen. Das Soll gilt für alle Tage in der App, auch für ältere aus 2025. Du siehst und änderst es unter Einstellungen und Arbeitszeit-Regeln."],
    ["Pausenkorrektur ohne Lücke kurz vor 9:45","An Tagen ohne Pause mit 9:16 bis 9:45 Stunden hat die Verlängerung den Nachweis über 9:45 geschoben. Dort zieht das System 45 statt 30 Minuten ab, und dir fehlten 15 Minuten. Die App rechnet die Korrektur jetzt auf den verlängerten Tag. Ein Tag von 09:00 bis 18:30 ohne Pause erscheint deshalb als 09:00 bis 19:15. Hast du solche Tage schon abgerechnet, lohnt ein Blick auf die alten Nachweise."],
    ["Kurze Tage starten ohne Pause","Tage bis 6:30 Stunden legt der Dispo-Import jetzt ohne Pause an. Bis dahin zieht FLINK nichts ab, und eine vorgegebene Pause hat deine Nettozeit nur verkürzt. Längere Tage starten weiter mit Pause ja. Bereits angelegte Tage bleiben, wie sie sind, und den Schalter kannst du jederzeit umstellen."],
    ["Tagegeld-Hinweis nennt 14 Euro","Für eintägige Reisen im Inland mit mehr als 8 Stunden Abwesenheit beträgt die Verpflegungspauschale 14 Euro. Bisher stand im Hinweis 28 Euro, das ist der Satz für volle 24 Stunden."]
  ]},
  {v:"3.6", t:"Eigenes Anschreiben und zwei Korrekturen", items:[
    ["Du schreibst die Mail jetzt selbst","In den Einstellungen kannst du Anrede und Grußformel frei formulieren. Lässt du die Felder leer, bleibt alles beim bisherigen Text. Wenn du magst, setzt du Platzhalter ein: {name} für den Empfänger, dazu {produktion}, {auftrag} und {tage}."],
    ["Pausenkorrektur greift wieder in allen Fällen","Das Abrechnungssystem zieht die gesetzliche Ruhepause immer ab, auch an Tagen ohne Pause. Der Nachweis gleicht das jetzt vollständig aus. Ein Tag von 09:00 bis 17:30 ohne Pause erscheint dort als 09:00 bis 18:00, damit deine echten 8:30 Stunden ankommen."],
    ["Der Folgetag stimmt wieder","Tag hinzufügen hat bisher immer das Datum des Vortags vorgeschlagen. Das ist behoben."],
    ["Keine erfundene Dispo-Zeile mehr","Von Hand erfasste Tage zeigten dauerhaft die Zeile Laut Dispo 09:00 bis 18:00, obwohl es nie eine Dispo gab. Ein Tipp auf Übernehmen hat dabei echte Zeiten überschrieben. Der Knopf setzt jetzt nur noch die Einsatzzeit."],
    ["Anleitung neu geschrieben","Sie erklärt den Ablauf jetzt Schritt für Schritt, statt nur Stichworte aufzuzählen."]
  ]},
  {v:"3.5", t:"Grenzübertritt bei Auslandsreisen", items:[
    ["Grenze hin und zurück festhalten","Steht ein Tag auf Ausland, kannst du eintragen, wann du Deutschland verlassen hast und wann du zurück warst. Die Felder sind zunächst gesperrt. Ein Tipp auf dokumentieren schaltet sie frei."],
    ["Erscheint unten im Nachweis","Hast du Grenzzeiten erfasst, stehen sie im Notizfeld von PDF und Mail. Die Tabelle mit deinen Arbeitszeiten bleibt unberührt."]
  ]},
  {v:"3.4", t:"Diese Übersicht", items:[
    ["Neuerungen auf einen Blick","Nach einem Update siehst du künftig einmalig, was sich geändert hat. Du erreichst die Liste jederzeit wieder über Einstellungen und dann Was ist neu."]
  ]},
  {v:"3.3", t:"Pausen richtig auf dem Nachweis", items:[
    ["Über 9:45 Stunden zieht das System 45 Minuten ab","Du machst aber nur 30. Der Nachweis verlängert dein Einsatzende deshalb um die Differenz, damit deine echte Arbeitszeit ankommt."],
    ["Die Pause steht jetzt als Zahl im Nachweis","Statt ja oder nein steht dort 0,5 Stunden, so wie es das Formular vorsieht. Damit erübrigt sich die Rückfrage, wie viel ja eigentlich bedeutet."],
    ["Freier Mitarbeiter oder fest angestellt","Du wählst es im Import, im Auftrag und als Vorgabe in den Einstellungen. Fest Angestellte bekommen den Nachweis mit unveränderten Zeiten."]
  ]},
  {v:"3.2", t:"Tagegeld und neues Symbol", items:[
    ["Tagegeld nur bei Einzeltagen","Bei einer mehrtägigen Reise mit Übernachtung besteht kein Anspruch, das läuft über die Dienstreise-Abrechnung. Im Ausland richtet sich der Satz nach dem Land."],
    ["Neues App-Symbol","Eine Klappe mit EB löst das alte Z ab."]
  ]},
  {v:"3.1", t:"Reiseart nachträglich ändern", items:[
    ["Einzeltage oder mehrtägig, jederzeit","Im Auftrag kannst du über den Arbeitstagen umschalten. Übernachtung und Reisezeiten aller Tage werden neu gesetzt, deine Überstunden bleiben gleich."]

/* ===== Helfer ===== */
function hm2min(s){if(!s)return null;const m=String(s).match(/(\d{1,2}):(\d{2})/);return m?(+m[1])*60+(+m[2]):null;}
function dur(a,b){if(a==null||b==null)return null;let d=b-a;if(d<0)d+=1440;return d;}
function addMin(hm,mins){const m=hm2min(hm);if(m==null)return "";let x=(m+mins)%1440;if(x<0)x+=1440;return String(Math.floor(x/60)).padStart(2,"0")+":"+String(x%60).padStart(2,"0");}
function fmtMin(m){if(m==null)return "–";const s=m<0?"-":"";m=Math.abs(m);return s+Math.floor(m/60)+":"+String(m%60).padStart(2,"0");}
function fmtSigned(m){if(m==null)return "–";const s=m>0?"+":(m<0?"-":"±");const a=Math.abs(m);return s+Math.floor(a/60)+":"+String(a%60).padStart(2,"0");}
function otClass(m){if(m==null||m===0)return "ot-zero";return m>0?"ot-pos":"ot-neg";}

function fmtMonth(mk){return MN[+mk.slice(5,7)-1]+" "+mk.slice(0,4);}
function fmtDate(iso){if(!iso)return "—";const d=new Date(iso+"T00:00");if(isNaN(d))return iso;return WD[d.getDay()]+". "+String(d.getDate()).padStart(2,"0")+"."+String(d.getMonth()+1).padStart(2,"0")+".";}
function fmtDateLong(iso){if(!iso)return "";const d=new Date(iso+"T00:00");if(isNaN(d))return iso;return WD[d.getDay()]+", "+String(d.getDate()).padStart(2,"0")+"."+String(d.getMonth()+1).padStart(2,"0")+"."+d.getFullYear();}
function fmtDayC(iso){if(!iso)return "—";const d=new Date(iso+"T00:00");if(isNaN(d))return iso;return WD[d.getDay()]+", "+String(d.getDate()).padStart(2,"0")+"."+String(d.getMonth()+1).padStart(2,"0")+".";}
function fmtRange(o){const ds=o.days.map(d=>d.datum).filter(Boolean).sort();if(!ds.length)return "";
  const a=new Date(ds[0]+"T00:00"),b=new Date(ds[ds.length-1]+"T00:00");if(isNaN(a)||isNaN(b))return "";
  const dd=x=>String(x.getDate()).padStart(2,"0"),mm=x=>String(x.getMonth()+1).padStart(2,"0");
  if(ds[0]===ds[ds.length-1])return dd(a)+"."+mm(a)+"."+a.getFullYear();
  if(a.getMonth()===b.getMonth()&&a.getFullYear()===b.getFullYear())return dd(a)+".–"+dd(b)+"."+mm(b)+"."+b.getFullYear();
  return dd(a)+"."+mm(a)+".–"+dd(b)+"."+mm(b)+"."+b.getFullYear();}
function rangeOrt(o){const r=fmtRange(o);return [r,o.produktionsort].filter(Boolean).join(" · ")||"Noch keine Tage";}
function headEyebrow(){const n=new Date();let s=MN[n.getMonth()].toUpperCase()+" "+n.getFullYear();const a=clean(S.absender);if(a)s+=" · "+a.toUpperCase();return s;}

/* ===== Berechnung pro Tag ===== */
/* ===== FLINK-Pausenautomatik (ZDF-System) =====
   Gesetzliche Ruhepause, die FLINK selbst abzieht – unabhängig davon, was im Nachweis steht:
   Anwesenheit über 9:45 Std → 45 Min · über 6:30 Std → 30 Min · darunter → keine.
   Quelle: ZDF/FLINK-Regel (6,5 bzw. 9,75 Stunden). Bei freien Mitarbeitern weicht die
   tatsächliche Pause davon ab (real 30 Min oder keine), deshalb muss der Nachweis
   korrigiert werden – siehe exportEnde(). */
function flinkPause(span){
  if(span==null)return 0;
  if(span>S.flink45)return 45;
  if(span>S.flink30)return 30;
  return 0;
}
/* Pausen-Vorgabe fuer neu angelegte Tage (V4.0): Bis zur ersten FLINK-Schwelle (6:30) zieht FLINK nichts ab,
   eine vorgegebene Pause wuerde nur die Nettozeit kuerzen. Darunter also "Pause nein", darueber "Pause ja".
   Nur Startwert, der Schalter im Tag bleibt frei. Fehlen Zeiten, bleibt es bei "ja" wie bisher. */
function pauseVorgabe(einsatz,ende){const s=dur(hm2min(einsatz),hm2min(ende));return s==null||s>S.flink30;}
function dayCalc(d){
  const span=dur(hm2min(d.einsatz),hm2min(d.ende));
  const az=dur(hm2min(d.drehbeginn),hm2min(d.drehende));
  const pauseMin=d.pause?(S.standardPause||0):0;
  const netto=span==null?null:Math.max(0,span-pauseMin);
  const ot=netto==null?null:netto-S.sollMin;
  let tg;
  if(d.uebernachtung) tg={state:"ue"};
  else if(d.ausland) tg={state:"ausland"};
  else if(span==null) tg={state:"none"};
  else if(span>S.abwesenheitMin) tg={state:"ok"};
  else tg={state:"under"};
  const fp=flinkPause(span);
  /* Korrektur = was FLINK abzieht minus die tatsaechlich gemachte Pause.
     FLINK zieht die gesetzliche Ruhepause immer ab, auch wenn keine gemacht wurde.
     Damit nach diesem Abzug die echte Arbeitszeit ankommt, wandert die Differenz
     ans Einsatzende. Beispiele: 30er-Fenster mit Pause 30 -> 0 (deckt sich, die Pause
     steckt in der Arbeitszeit) · 45er-Fenster mit Pause 30 -> +15 · ohne Pause -> voller
     FLINK-Abzug. Nie negativ: der Nachweis wird nie kuerzer als die echte Zeit.
     Schwellensprung (V4.0): FLINK sieht die VERLAENGERTE Spanne. Rutscht sie dadurch ueber
     die naechste Schwelle, zieht FLINK dort mehr ab. Deshalb wird die Korrektur auf die
     verlaengerte Spanne nachgerechnet, bis sie stabil ist. Beispiel: 09:00-18:30 ohne Pause
     -> +30 ergaebe 19:00 = 10:00 > 9:45 -> FLINK 45 -> es fehlten 15. Richtig: +45 = 19:15.
     flinkPause steigt nur und hat drei Stufen, die Schleife endet nach hoechstens zwei Runden. */
  let korr=span==null?0:Math.max(0,fp-pauseMin);
  if(span!=null){for(let i=0;i<3;i++){const k=Math.max(0,flinkPause(span+korr)-pauseMin);if(k===korr)break;korr=k;}}
  const flinkNw=span==null?0:flinkPause(span+korr);   /* was FLINK vom Nachweis abzieht */
  return {span,az,pause:pauseMin,pauseJa:!!d.pause,netto,ot,absence:span,tg,flink:fp,flinkNw,korr};
}
/* Einsatzende für den Nachweis. Bei freien Mitarbeitern wird es um die Differenz
   verschoben, die FLINK zu viel (oder zu wenig) abzieht – damit nach dessen Automatik
   die tatsächlich geleistete Nettozeit herauskommt. Feste bekommen die echte Zeit,
   für sie stimmt die Automatik.
   Beispiel frei: 09:00–19:00 (10:00), Pause 30. FLINK zieht 45 → Nachweis 19:15;
   FLINK rechnet 10:15 − 45 = 9:30 = die echte Nettozeit. */
function exportEnde(o,d){
  if(orderStatus(o)!=="frei")return d.ende||"";
  const c=dayCalc(d);
  if(!d.ende||!c.korr)return d.ende||"";
  return addMin(d.ende,c.korr);
}
/* Pausenwert für den Nachweis in Dezimalstunden, wie im ZDF-Formular üblich ("0,5"). */
function pauseDez(min){if(!min)return "—";return (min/60).toFixed(2).replace(/0$/,"").replace(".",",");}
/* Status des Auftrags: frei (Default aus den Einstellungen) oder fest angestellt. */
function orderStatus(o){return (o&&o.status)||S.status||"frei";}
/* === BEDIENUNG-BEGIN === Bedien-Runde (V4.4). Reine Funktionen ohne DOM, getestet in tests/bedienung.test.mjs.
   Kein neues Datenfeld: Tagestyp und Schalter folgen aus den Feldwerten, wie die Reiseart bei orderTrip. */
function hatAnreise(d){return !!(d&&(d.anreise||d.anreiseEnde));}
function hatRueckreise(d){return !!(d&&(d.rueckBeginn||d.rueck));}
/* Tagestyp: ohne Übernachtung "ein" (Eintägig), sonst nach Fahrten "an" (nur hin), "ort" (keine), "rueck" (nur zurück),
   "eigen" (Übernachtung mit beiden Fahrten am selben Tag, dafür gibt es keinen Knopf). */
function dayTyp(d){
  if(!d||!d.uebernachtung)return "ein";
  const an=hatAnreise(d),rk=hatRueckreise(d);
  return an&&rk?"eigen":an?"an":rk?"rueck":"ort";
}
/* Belegung je Typ: ue = Übernachtung, an/rk = Fahrt findet statt. "eigen" hat keine Belegung. */
function typFelder(typ){
  return ({ein:{ue:false,an:true,rk:true},an:{ue:true,an:true,rk:false},ort:{ue:true,an:false,rk:false},rueck:{ue:true,an:false,rk:true}})[typ]||null;
}
/* Chip je Tagestyp für Tageskarte und Import-Vorschau (V4.4.2: "eigen" heißt „Hin und zurück“). Eintägig ohne Chip. */
function typChip(d){return ({an:"Anreisetag",ort:"Vor Ort",rueck:"Rückreisetag",eigen:"Hin und zurück"})[dayTyp(d)]||"";}
/* Automatisches Einsatzende: letzte vorhandene Tätigkeit plus 30 Minuten (Rückreise-Ende vor Drehende vor Anreise-Ende).
   Eine Quelle für das Tages-Sheet und endeGeschuetzt (vorher doppelt als calcAutoEnde und lastEnd, Review C6). */
function autoEnde(d){const le=(d&&(d.rueck||d.drehende||d.anreiseEnde))||"";return le?addMin(le,30):"";}
/* Das Ende bleibt beim Typwechsel stehen, wenn es von Hand getippt ist (weicht von autoEnde ab) oder aus der Dispo stammt. */
function endeGeschuetzt(d){
  if(!d||!d.ende)return false;
  if(d.dispo&&d.dispo.ende&&d.ende===d.dispo.ende)return true;
  return d.ende!==autoEnde(d);
}

function auslandVorgabe(ort){return !!ort&&ortGueltig(ort)===ort&&!/^DE/.test(ort);}

   Ausland folgt dem Arbeitsort des Auftrags (o.feiertagOrt), nicht der Einstellung und nicht dem Dienstort. */
function neuerTag(o){
  const basis={einsatz:"09:00",drehbeginn:"10:00",drehende:"17:00",pause:true,ausland:auslandVorgabe(o&&o.feiertagOrt),grenzHin:"",grenzRueck:"",dispo:{einsatz:"",ende:""}};
  if(o&&orderTrip(o)==="mehr")return {...basis,anreise:"",anreiseEnde:"",rueckBeginn:"",rueck:"",ende:"17:30",uebernachtung:true};
  return {...basis,anreise:"09:30",anreiseEnde:"10:00",rueckBeginn:"17:00",rueck:"17:30",ende:"18:00",uebernachtung:false};
}

   Zuschläge (Nacht, Sonntag, Feiertag) nur bei Tagessatz bis 336,06 EUR (9.1). Nacht (22-6 Uhr, 25 %) und Sonntag (50 %) auf
   Arbeitszeit ohne Reise und ohne FLINK-Pause, bei Überschneidung nur der höhere Zuschlag, an Abrechnungen geprüft (V4.2).
   Reisezeit zählt bei der Mehrarbeit noch wie Arbeitszeit, ohne Kappung nach 6.7 und ohne Zuschlagsverbot nach 9.7, weil
   das ZDF Fahrten nicht einheitlich wertet (siehe Protokoll). Feiertag 100 % nach dem Arbeitsort, siehe FEIERTAGE-Block (V4.3). */
const TARIF_TAG_MIN=462;/* 7,7 Std am Tag (PdTV 9.2): Schwelle für Mehrarbeit, fest nach Tarif und unabhängig vom eigenen Soll */
/* Kaufmännisch auf Cent: toPrecision(12) glättet Gleitkomma-Reste wie 2.135*100 = 213.49999999999997. */
function runde2(x){return Math.round(+(x*100).toPrecision(12))/100;}
function funktionAus(txt){const t=String(txt||"");if(/assist/i.test(t))return "assistent";if(/kamera|\bKA\b/i.test(t))return "kamera";return null;}
function orderFunktion(o){return (o&&o.funktion)||S.funktion||"assistent";}
function orderSatz(o){const v=orderFunktion(o)==="kamera"?S.satzKamera:S.satzAssist;return typeof v==="number"&&v>0?v:null;}
/* Minuten mit Feiertags-, Sonntags- bzw. Nachtzuschlag in der Nachweis-Spanne, dazu die übersprungenen Reiseminuten. Reise
   zählt nicht (PdTV 9.7). Je Minute gilt nur der höchste Zuschlag: Feiertag vor Sonntag vor Nacht (9.5). ft[0] und ft[1]
   sagen, ob der Kalendertag des Einsatzes bzw. der Folgetag (Einsatz über Mitternacht) ein Feiertag ist (V4.3).
   Eine Fahrt mit nur einem Ende (der Import legt anreiseEnde und rueckBeginn leer an) gilt als 30 Minuten lang: Anreise
   ohne Ende = anreise bis anreise+30, Rückreise ohne Beginn = rueck-30 bis rueck.
   Die Pause ist hier noch nicht abgezogen, das übernimmt tarifTag über die anerkannte Zeit minus Reise. */
function tarifZuschlagMin(d,endeHm,ft){
  const b=hm2min(d.einsatz),e=hm2min(endeHm);if(b==null||e==null||!d.datum)return {nacht:0,sonntag:0,feiertag:0,reise:0};
  const len=dur(b,e);const reise=[];
  const iv=(von,bis)=>{let a=hm2min(von),z=hm2min(bis);if(a==null&&z==null)return;if(z==null)z=(a+30)%1440;if(a==null)a=(z+1410)%1440;
    /* Beginnt die Fahrt vor dem Einsatzbeginn und reicht in die Spanne hinein, zählt nur der überlappende Teil. */
    const l=dur(a,z);let s=a-b;if(s<0&&s+l>0){reise.push([0,s+l]);return;}if(s<0)s+=1440;reise.push([s,s+l]);};
  iv(d.anreise,d.anreiseEnde);iv(d.rueckBeginn,d.rueck);
  const wd0=new Date(d.datum+"T00:00").getDay();let nacht=0,sonntag=0,feiertag=0,rz=0;
  for(let i=0;i<len;i++){
    if(reise.some(([s,z])=>i>=s&&i<z)){rz++;continue;}
    const abs=b+i,tag=Math.floor(abs/1440),mod=abs%1440,wd=(wd0+tag)%7;
    if(ft&&ft[tag])feiertag++;else if(wd===0)sonntag++;else if(mod>=1320||mod<360)nacht++;
  }
  return {nacht,sonntag,feiertag,reise:rz};
}
/* Ein Einsatztag nach Tarif. null, wenn die Option aus ist, der Auftrag nicht "frei" ist, der Tagessatz fehlt
   oder Zeiten fehlen. Anerkannt ist, was FLINK vom Nachweis bucht (Nachweis-Spanne minus FLINK-Pause). */
function tarifTag(o,d){
  if(!S.verdienstOn||orderStatus(o)!=="frei")return null;
  const satzTag=orderSatz(o);if(!satzTag||!d||!d.einsatz||!d.ende)return null;
  const endeNw=exportEnde(o,d);const spanNw=dur(hm2min(d.einsatz),hm2min(endeNw));if(spanNw==null)return null;
  const anerkannt=spanNw-flinkPause(spanNw);
  /* PdTV 9.1: Mehrarbeit, Nacht-, Sonntags- und Feiertagszuschlag gibt es nur bei einer Tagesvergütung bis 336,06 EUR. */
  const tarifOk=satzTag<=336.06;
  const mehrStd=tarifOk?Math.ceil(Math.max(0,anerkannt-TARIF_TAG_MIN)/30)/2:0;
  /* Stundensatz wie auf der ZDF-Abrechnung auf drei Stellen gerundet, V4.2. */
  const satz=Math.round(satzTag/7.7*1000)/1000;
  const mehrEur=runde2(mehrStd*satz),mehrZuschlEur=runde2(mehrEur*0.25);
  /* Zuschläge nur auf Arbeitsminuten, die FLINK bucht: Die Pause liegt in der Nachweis-Spanne, wird aber nicht bezahlt,
     und die Reise steckt in "anerkannt", zählt aber nicht als Zuschlagszeit. Also Deckel = anerkannt minus Reise. */
  /* Feiertag am Tag selbst und am Folgetag, falls der Einsatz über Mitternacht geht (V4.3). Steht der Folgetag im Auftrag, gilt
     sein eigener Eintrag (auch abgeschaltet), sonst der automatische Wert. Gezählt wird bis zum Nachweis-Ende wie beim Sonntag,
     denn das ZDF rechnet vom Nachweis aus, den es bekommt. */
  const f1=d.datum?plusTage(d.datum,1):"",d1=f1&&((o&&o.days)||[]).find(x=>x.datum===f1);
  const ft=[!!(d.datum&&feiertagTag(o,d)),!!(f1&&feiertagTag(o,d1||{datum:f1}))];
  const z=tarifZuschlagMin(d,endeNw,ft);
  const cap=Math.max(0,anerkannt-z.reise);
  /* Deckel in der Reihenfolge des höchsten Zuschlags: Feiertag 100 %, Sonntag 50 %, Nacht 25 % (PdTV 9.5). */
  const feiertagMin=tarifOk?Math.min(z.feiertag,cap):0,sonntagMin=tarifOk?Math.min(z.sonntag,cap-feiertagMin):0,
    nachtMin=tarifOk?Math.min(z.nacht,cap-feiertagMin-sonntagMin):0;
  const nachtEur=runde2(nachtMin/60*satz*0.25),sonntagEur=runde2(sonntagMin/60*satz*0.5),feiertagEur=runde2(feiertagMin/60*satz);
  return {tagessatz:satzTag,funktion:orderFunktion(o),anerkannt,mehrStd,mehrEur,mehrZuschlEur,nachtMin,nachtEur,
    sonntagMin,sonntagEur,feiertagMin,feiertagEur,summe:runde2(satzTag+mehrEur+mehrZuschlEur+nachtEur+sonntagEur+feiertagEur)};
}
function nettoQuote(){const q=S.nettoQuote;return typeof q==="number"&&q>=1&&q<=100?q:null;}
/* Monate mit Einsätzen bis heute, neuester zuerst. Geplante Tage in der Zukunft zählen nicht. */
function verdienstMonate(heute){
  const bis=heute||isoLocal(new Date());const m={};
  DB.orders.forEach(o=>o.days.forEach(d=>{
    if(!d.datum||d.datum>bis)return;const t=tarifTag(o,d);if(!t)return;
    const k=d.datum.slice(0,7);
    const x=(m[k]??={monat:k,tage:[],einsaetze:0,honorar:0,mehrStd:0,mehrEur:0,nachtEur:0,sonntagEur:0,feiertagEur:0,brutto:0,konto:null});
    x.tage.push({o,d,t});x.einsaetze++;x.honorar+=t.tagessatz;x.mehrStd+=t.mehrStd;x.mehrEur+=t.mehrEur+t.mehrZuschlEur;
    x.nachtEur+=t.nachtEur;x.sonntagEur+=t.sonntagEur;x.feiertagEur+=t.feiertagEur;x.brutto+=t.summe;
  }));
  const q=nettoQuote();
  return Object.values(m).sort((a,b)=>b.monat.localeCompare(a.monat)).map(x=>{
    ["honorar","mehrEur","nachtEur","sonntagEur","feiertagEur","brutto"].forEach(k=>x[k]=runde2(x[k]));
    x.tage.sort((a,b)=>(a.d.datum+(a.d.einsatz||"")).localeCompare(b.d.datum+(b.d.einsatz||"")));
    x.konto=q?runde2(x.brutto*q/100):null;return x;});
}
/* Tage bis heute, die nur wegen eines fehlenden Tagessatzes nicht mitzählen, je Funktion. Grundlage für den Hinweis
   im Reiter Verdienst. Zählt wie verdienstMonate: Status frei, Einsatzbeginn und -ende eingetragen, nicht in der Zukunft. */
function verdienstFehlSatz(heute){
  const bis=heute||isoLocal(new Date());const n={assistent:0,kamera:0};if(!S.verdienstOn)return n;
  DB.orders.forEach(o=>{if(orderStatus(o)!=="frei"||orderSatz(o))return;const k=orderFunktion(o)==="kamera"?"kamera":"assistent";
    o.days.forEach(d=>{if(d.datum&&d.datum<=bis&&d.einsatz&&d.ende)n[k]++;});});
  return n;
}
function parseEur(s){const t=String(s??"").trim().replace(/\s|€/g,"");if(!t)return null;
  const n=parseFloat(t.includes(",")?t.replace(/\./g,"").replace(",","."):t);return isFinite(n)&&n>0?runde2(n):null;}
/* Netto-Anteil in Prozent: Komma oder Punkt, ohne vorher zu runden. Ein Bruch unter 1 (z. B. 0,625) gilt als 62,5 %.
   Gültig nur 1 bis 100, sonst null (dann zeigt die App nur Brutto). */
function parseQuote(s){const t=String(s??"").trim().replace(/\s|%/g,"");if(!t)return null;
  let n=parseFloat(t.replace(",","."));if(!isFinite(n))return null;if(n<1)n*=100;n=runde2(n);return n>=1&&n<=100?n:null;}
function fmtEur(n){return n==null?"–":n.toLocaleString("de-DE",{minimumFractionDigits:2,maximumFractionDigits:2})+"\u00a0€";}
function fmtEurRund(n){return n==null?"–":Math.round(n).toLocaleString("de-DE")+" €";}
function fmtStd(h){return String(h).replace(".",",")+" Std";}
/* === TARIF-END === */
/* ===== Vertragstage (V4.2) ===== Reine Rechnung ohne DOM, getestet in tests/vertragstage.test.mjs. */
/* Arbeitstage laut Vertrag eingeben: ganze Zahl 1 bis 366, ein angehängtes "Tage" ist erlaubt. Sonst null (kein Zähler). */
function parseTage(s){const m=String(s??"").trim().match(/^(\d{1,3})(\s*tage?)?$/i);if(!m)return null;const n=+m[1];return n>=1&&n<=366?n:null;}
/* Einsatztage im laufenden Kalenderjahr (V4.2, V4.3.1). Gezählt werden alle Aufträge, egal ob frei oder fest, abgerechnete
   eingeschlossen, jedes Datum einmal. Geleistet = bis einschließlich heute, disponiert = danach. Die Beschäftigung zählt nicht
   mehr mit: Ältere Aufträge ohne eigenen Status folgten der Einstellung und fielen beim Umschalten auf „fest“ heraus.
   Frei (S.status): Vertragstage nötig, sonst null; frei = Vertrag minus beides, darf negativ werden (über dem Vertrag).
   Fest: immer geleistet und disponiert, ohne Vertrag und ohne frei (vertrag und frei = null). */
function vertragsTage(heute){
  const fest=S.status==="fest",v=S.vertragstage,mitVertrag=!fest&&Number.isInteger(v)&&v>=1&&v<=366;
  if(!fest&&!mitVertrag)return null;
  const bis=heute||isoLocal(new Date()),jahr=bis.slice(0,4),daten=new Set();
  DB.orders.forEach(o=>o.days.forEach(d=>{if(d.datum&&d.datum.slice(0,4)===jahr)daten.add(d.datum);}));
  let geleistet=0,disponiert=0;daten.forEach(t=>{if(t<=bis)geleistet++;else disponiert++;});
  return {jahr,vertrag:mitVertrag?v:null,geleistet,disponiert,frei:mitVertrag?v-geleistet-disponiert:null};
}
const orderOT=o=>o.days.reduce((a,d)=>a+(dayCalc(d).ot||0),0);
const orderNetto=o=>o.days.reduce((a,d)=>a+(dayCalc(d).netto||0),0);
const orderTGdays=o=>o.days.reduce((a,d)=>a+(dayCalc(d).tg.state==="ok"?1:0),0);
const orderDate=o=>o.days.map(d=>d.datum).filter(Boolean).sort()[0]||"";
const byDate=(a,b)=>(orderDate(a)||"0000").localeCompare(orderDate(b)||"0000");

/* ===== Reiseart (abgeleitet, nicht gespeichert) =====
   Eine Wahrheit: der Zustand ergibt sich aus days[].uebernachtung, damit Reiseart und
   Tage nie auseinanderlaufen (auch nicht, wenn ein einzelner Tag im Sheet umgestellt wird).
   "mix" = uneinheitlich, z. B. zwei Nächte Hotel und der letzte Tag heimgefahren. */
function orderTrip(o){
  if(!o.days.length)return "none";
  const ue=o.days.filter(d=>d.uebernachtung).length;
  if(ue===0)return "ein";
  if(ue===o.days.length)return "mehr";
  return "mix";
}
/* Reiseart auf alle Tage anwenden. Ändert NUR uebernachtung und die vier Reisefelder –
   Einsatzbeginn/-ende, Dreh und Pause bleiben unangetastet, damit Netto und Überstunden
   sich nicht verschieben. Muster wie beim Import: bei "mehr" Anreise nur am ersten,
   Rückreise nur am letzten Tag; bei "ein" beide Fahrten an jedem Tag. */
function applyTrip(o,trip){
  const mehr=trip==="mehr";
  const days=o.days.slice().sort((a,b)=>((a.datum||"")+(a.einsatz||"")).localeCompare((b.datum||"")+(b.einsatz||"")));
  const last=days.length-1;
  days.forEach((d,i)=>{
    d.uebernachtung=mehr;
    const hin=!mehr||i===0, rueck=!mehr||i===last;
    d.anreise=hin&&d.einsatz?addMin(d.einsatz,30):"";
    d.anreiseEnde=hin&&d.einsatz?addMin(d.einsatz,60):"";
    d.rueckBeginn=rueck&&d.ende?addMin(d.ende,-60):"";
    d.rueck=rueck&&d.ende?addMin(d.ende,-30):"";
  });
}

/* Vertragstage (V4.2): Kurzzeile in den Aufträgen, bei Freien leer ohne Eintrag in den Einstellungen.
   Fest angestellt (V4.3.1): „Einsatztage“ mit geleistet und disponiert, ohne Vertrag und ohne frei. */
function vertragsZeileHtml(){const v=vertragsTage();if(!v||v.vertrag==null&&!DB.orders.length)return "";
  if(v.vertrag==null)return `<p class="note vline">Einsatztage ${v.jahr} · ${v.geleistet}&nbsp;geleistet · ${v.disponiert}&nbsp;disponiert</p>`;
  return `<p class="note vline">Vertragstage ${v.jahr} · ${v.geleistet}&nbsp;geleistet · ${v.disponiert}&nbsp;disponiert · ${v.frei>=0?`noch ${v.frei}&nbsp;frei`:`<span class="vwarn">${-v.frei} über Vertrag</span>`}</p>`;}
/* Block in der Statistik: drei Kacheln und ein Balken (geleistet voll, disponiert heller, Rest leer). */
function vertragsBlockHtml(){const v=vertragsTage();if(!v)return "";
  if(v.vertrag==null)return `<div class="section-h"><h3>Einsatztage ${v.jahr}</h3></div>
  <div class="kpis two">
    <div class="kpi"><div class="l">Geleistet</div><div class="n">${v.geleistet}</div></div>
    <div class="kpi"><div class="l">Disponiert</div><div class="n">${v.disponiert}</div></div>
  </div>`;
  const pct=x=>Math.max(0,Math.min(100,x/v.vertrag*100)),g=pct(v.geleistet),dsp=Math.min(pct(v.disponiert),100-g);
  return `<div class="section-h tap" id="vtHead" role="button" tabindex="0"><h3>Vertragstage ${v.jahr} ›</h3><span class="tot">von ${v.vertrag}</span></div>
  <div class="kpis">
    <div class="kpi"><div class="l">Geleistet</div><div class="n">${v.geleistet}</div></div>
    <div class="kpi"><div class="l">Disponiert</div><div class="n">${v.disponiert}</div></div>
    <div class="kpi ${v.frei<0?"warnk":"acc"}"><div class="l">${v.frei<0?"Über Vertrag":"Frei"}</div><div class="n">${Math.abs(v.frei)}</div></div>
  </div>
  <div class="vbar" aria-hidden="true"><span class="g" style="width:${g}%"></span><span class="d" style="width:${dsp}%"></span></div>`;}
/* ===== Statistik ===== */
function renderStats(){
  const totOT=DB.orders.reduce((a,o)=>a+orderOT(o),0);
  const totNetto=DB.orders.reduce((a,o)=>a+orderNetto(o),0);
  const totDays=DB.orders.reduce((a,o)=>a+o.days.length,0);
  const totTGd=DB.orders.reduce((a,o)=>a+orderTGdays(o),0);
  const nw=new Date();
  let h=`<div class="pagehead"><div class="eyebrow">${esc(headEyebrow())}</div><div class="display">Statistik</div></div>`+tabsHtml();
  h+=`<div class="hero"><div class="l">Überstunden gesamt</div><div class="n ${otClass(totOT)}">${fmtSigned(totOT)}</div><div class="hsub">${DB.orders.length} ${DB.orders.length===1?"Auftrag":"Aufträge"} · Stand ${MN[nw.getMonth()]} ${nw.getFullYear()}</div></div>
  <div class="kpis two">
    <div class="kpi"><div class="l">Netto-Arbeitszeit</div><div class="n">${fmtMin(totNetto)}</div></div>
    <div class="kpi"><div class="l">Arbeitstage</div><div class="n">${totDays}</div></div>
    <div class="kpi posk"><div class="l">Tagegeld-Tage</div><div class="n">${totTGd}</div></div>
    <div class="kpi"><div class="l">Soll / Tag</div><div class="n">${fmtMin(S.sollMin)}</div></div>
  </div>`;
  h+=vertragsBlockHtml();
  /* Direkter Weg (V4.4): Freie ohne Vertragstage sehen eine ruhige Zeile, bis ein Wert gespeichert ist. */
  if(S.status!=="fest"&&S.vertragstage==null)h+=`<button class="linkbtn left" id="vtSet">Vertragstage eintragen ›</button>`;
  // Gruppierung nach Monat und Jahr (aus den Tagesdaten)
  const perMonth={},perYear={};
  DB.orders.forEach(o=>o.days.forEach(d=>{
    if(!d.datum)return;const c=dayCalc(d);if(c.netto==null)return;
    const mk=d.datum.slice(0,7),yk=d.datum.slice(0,4);
    (perMonth[mk]??={ot:0,netto:0,days:0});perMonth[mk].ot+=c.ot||0;perMonth[mk].netto+=c.netto;perMonth[mk].days++;
    (perYear[yk]??={ot:0,netto:0,days:0});perYear[yk].ot+=c.ot||0;perYear[yk].netto+=c.netto;perYear[yk].days++;
  }));
  const months=Object.keys(perMonth).sort().reverse(),years=Object.keys(perYear).sort().reverse();
  if(months.length){h+=`<div class="section-h"><h3>Pro Monat</h3></div>`;
    months.forEach(mk=>{const m=perMonth[mk];
      h+=`<div class="srow"><div class="nm">${fmtMonth(mk)}<small>${m.days} ${m.days===1?"Tag":"Tage"} · ${fmtMin(m.netto)} netto</small></div><div class="v ${otClass(m.ot)}">${fmtSigned(m.ot)}</div></div>`;});
  }
  if(years.length>1){h+=`<div class="section-h"><h3>Pro Jahr</h3></div>`;
    years.forEach(yk=>{const yy=perYear[yk];
      h+=`<div class="srow"><div class="nm">${yk}<small>${yy.days} ${yy.days===1?"Tag":"Tage"} · ${fmtMin(yy.netto)} netto</small></div><div class="v ${otClass(yy.ot)}">${fmtSigned(yy.ot)}</div></div>`;});
  }
  if(DB.orders.length){h+=`<div class="section-h"><h3>Pro Auftrag</h3></div>`;
    DB.orders.slice().sort((a,b)=>byDate(b,a)).forEach(o=>{const ot=orderOT(o),tgd=orderTGdays(o);
      h+=`<div class="srow${o.abgerechnet?" dim":""}" data-open="${o.id}" style="cursor:pointer"><div class="nm">${esc(o.titel||"Ohne Titel")}<small>${o.days.length} ${o.days.length===1?"Tag":"Tage"} · ${fmtMin(orderNetto(o))} netto${tgd>0?` · ${tgd}× Tagegeld`:""}</small></div><div style="display:flex;align-items:center;gap:10px"><span class="v ${otClass(ot)}">${fmtSigned(ot)}</span><span class="chev">›</span></div></div>`;});
  }else h+=`<div class="empty"><div class="big">📊</div><p>Noch keine Daten.</p></div>`;
  view.innerHTML=h;
  bindTabs();
  ["vtHead","vtSet"].forEach(id=>{const el=document.getElementById(id);if(el){el.onclick=()=>openSettings("vertrag");el.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();openSettings("vertrag");}};}});
  view.querySelectorAll("[data-open]").forEach(c=>c.onclick=()=>{state.orderId=c.dataset.open;window.scrollTo(0,0);render();});
}

/* ===== Verdienst (V4.1, freiwillig) ===== */
/* Hinweis in ganzen Sätzen, wenn Einsätze nur wegen eines fehlenden Tagessatzes nicht mitzählen (je Funktion). */
function fehlSatzText(f){
  const s=[["assistent","Dreh-Assistent"],["kamera","Kamera"]].filter(([k])=>f[k]).map(([k,nm])=>
    `${f[k]} ${f[k]===1?"Einsatz":"Einsätze"} als ${nm} ${f[k]===1?"zählt":"zählen"} nicht mit, weil der Tagessatz ${nm} fehlt.`);
  return s.length?s.join(" ")+` Trag ${s.length>1?"sie":"ihn"} unter Einstellungen › Verdienst und Tagessätze ein.`:"";
}
function renderVerdienst(){
  const ms=verdienstMonate(),q=nettoQuote(),fehl=fehlSatzText(verdienstFehlSatz());

      <div class="n">${q?"ca. "+fmtEurRund(m.konto):fmtEur(m.brutto)}</div>
      <div class="hsub">${q?"Brutto "+fmtEur(m.brutto)+" · Netto-Anteil "+String(q).replace(".",",")+" %":"Trag einen Netto-Anteil ein, dann steht hier der Betrag fürs Konto."}</div></div>
    <div class="kpis verd">
      <div class="kpi"><div class="l">Einsätze</div><div class="n">${m.einsaetze}</div></div>
      <div class="kpi"><div class="l">Mehrarbeit</div><div class="n">${fmtStd(m.mehrStd)}</div></div>
      <div class="kpi acc"><div class="l">Plus zum Tagessatz</div><div class="n">${plusEur(m.brutto-m.honorar)}</div></div>
    </div>
    ${fehl?`<div class="rnote" style="margin:0 0 6px">${fehl}</div><button class="linkbtn left" id="satzSet" style="margin:0 0 8px">Tagessätze eintragen ›</button>`:""}
    <div class="section-h"><h3>Pro Monat</h3></div>`;
    ms.forEach(x=>{
      h+=`<div class="srow" data-vm="${esc(x.monat)}" style="cursor:pointer"><div class="nm">${esc(fmtMonth(x.monat))}<small>${x.einsaetze} ${x.einsaetze===1?"Einsatz":"Einsätze"} · Brutto ${fmtEur(x.brutto)}${x.mehrStd?" · "+fmtStd(x.mehrStd)+" Mehrarbeit":""}</small></div><div style="display:flex;align-items:center;gap:10px;flex:none"><span class="v" style="white-space:nowrap">${x.konto!=null?"ca. "+fmtEurRund(x.konto):fmtEur(x.brutto)}</span><span class="chev">›</span></div></div>`;
    });
    h+=`<p class="note">Das ZDF zahlt nachträglich, meist ein bis zwei Monate später und oft in mehreren Teilbeträgen. Urlaubsentgelt ist nicht enthalten.${q?" Der Anteil aufs Konto ist geschätzt.":""} Gezählt werden Einsätze als freier Mitarbeiter bis heute.</p>`;

/* ===== Urlaub (Spec 2026-10-23, Variante B „Schritt für Schritt“) ===== */
function renderUrlaub(){
  const heute=isoLocal(new Date()),hj=+heute.slice(0,4),ort=urlaubOrt(S.feiertagOrt);
  /* Nur das laufende und das nächste Jahr; das Jahr wechselt mit den Monatspfeilen im Kalender (V4.5.1, Max 23.10.2026). */
  if(state.urlaubJahr!==hj&&state.urlaubJahr!==hj+1)state.urlaubJahr=hj;
  const jahr=state.urlaubJahr;
  const j=urlaubJahr(DB.urlaub,jahr,S.urlaubAnspruch,S.urlaubSatz,ort),verfall=verfallHinweis(jahr,heute,j.frei);
  const bl=antragBloecke(DB.urlaub,jahr,heute,ort),frei=Math.max(j.frei,0);
  let h=`<div class="pagehead"><div class="eyebrow">${esc(headEyebrow())}</div><div class="display">Urlaub</div></div>`+tabsHtml();
  h+=`<div class="hero"><div class="l">Du hast ${jahr} noch</div><div class="n" id="uFreiN">${frei} ${frei===1?"Tag":"Tage"}</div><div class="hsub">von ${S.urlaubAnspruch} ${S.urlaubAnspruch===1?"Urlaubstag":"Urlaubstagen"} frei.</div>
    <div class="hsub neg" id="uMehr"></div>
    ${j.verguetung!=null?`<div class="hsub">Dafür bekommst du ungefähr ${esc(fmtEur(j.verguetung))}.</div>`:`<button class="linkbtn left" id="uSatz">Trag deinen Betrag je Urlaubstag ein, dann siehst du hier die Vergütung ›</button>`}</div>`;
  h+=`<div id="uKal"></div><button class="linkbtn" id="uDatum">Oder mit Datum eintragen: erster und letzter Tag ›</button>`;
  h+=`<div class="tgbox nw" id="uVerfall"${verfall?"":" hidden"}><div class="t">${esc(verfall)}</div></div>`;
  /* Ein Block je Antrag (V4.5.1): Zeiträume als Links zum Ändern, ein Knopf für den nächsten Schritt des ganzen Antrags. */
  if(!bl.length)h+=`<div class="empty"><p>Noch kein Urlaub für ${jahr} eingetragen.</p></div>`;
  else h+=`<div class="cards">`+bl.map(b=>{const ids=esc(b.urlaube.map(u=>u.id).join(","));
    return `<div class="card ucard"><div class="ut">${esc(b.titel)}</div><div class="us">${b.tage} ${b.tage===1?"Urlaubstag":"Urlaubstage"}</div>
      <div class="uz">${b.urlaube.map(u=>`<button class="linkbtn" data-urlaub="${esc(u.id)}">${esc(zeitraumLesbar(u.von,u.bis))} ›</button>`).join("")}</div>
      <div class="ust ${b.klasse}">${esc(b.text)}</div>
      ${b.knopf?`<button class="btn ghost ustep" data-schritt="${b.aktion}" data-ids="${ids}">${esc(b.knopf)}</button>`:""}
      ${b.neben?`<button class="linkbtn uneben" data-schritt="${b.neben.aktion}" data-ids="${ids}">${esc(b.neben.text)}</button>`:""}</div>`;}).join("")+`</div>`;
  if(bl.some(b=>b.art!=="offen"))h+=`<p class="note">Sagt das ZDF zu einem Tag nein, tipp auf den Zeitraum. Dort nimmst du den Tag heraus. Einen anderen Tag tippst du dann im Kalender an.</p>`;
  h+=`<ol class="usteps"><li>Urlaubstage im Kalender antippen</li><li>Den ersten Antrag im Jahr schickst du selbst, alle weiteren füllt die App aus</li><li>Unterschreiben, an den Fachbereich schicken, dann „Abgeschickt?“ tippen</li></ol>`;
  if(bl.length)h+=`<button class="linkbtn" id="uIcs">In meinen Kalender übernehmen ›</button>
    <p class="note">Jeder Urlaubstag kommt als eigener Termin mit Nummer in deinen Kalender, zum Beispiel „ZDF Urlaub 3 von 31“. Hat sich seitdem etwas geändert, lösch erst die alten „ZDF Urlaub“-Termine im Kalender und übernimm dann neu. Sonst stimmen dort die Nummern nicht.</p>`;
  view.innerHTML=h;bindTabs();
  document.getElementById("uDatum").onclick=()=>openUrlaub(null,jahr);
  urlaubTippKalender(jahr,ort,j,heute);
  const us=document.getElementById("uSatz");if(us)us.onclick=()=>openSettings("urlaub");
  const ui=document.getElementById("uIcs");if(ui)ui.onclick=()=>urlaubKalender(jahr);
  view.querySelectorAll("[data-urlaub]").forEach(c=>c.onclick=()=>openUrlaub(DB.urlaub.find(u=>u.id===c.dataset.urlaub),jahr));
  view.querySelectorAll("[data-schritt]").forEach(b=>b.onclick=()=>urlaubAktion(b.dataset.schritt,b.dataset.ids.split(","),jahr));
}
/* Kalender zum Antippen (Nachtrag 23.10.2026 nachts). Die Auswahl lebt in state.urlaubAuswahl, bis man das Jahr wechselt oder den
   Reiter verlässt. Ein Tipp zeichnet nur den Kalender und die große Zahl neu, damit die Seite nicht springt. Die Monatspfeile laufen
   über den Jahreswechsel, von Januar dieses bis Dezember nächsten Jahres; ein neues Jahr zeichnet die ganze Seite (V4.5.1). */
function urlaubTippKalender(jahr,ort,j,heute){

/* Knopf im Block: nächster Schritt für alle Urlaube des Blocks (ids), also für den ganzen Antrag (V4.5.1). */
function urlaubAktion(aktion,ids,jahr){
