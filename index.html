/* Datei über das Teilen-Menü weitergeben. Muss direkt im Tipp laufen (iOS will eine frische Geste, kein await davor).
   ok() kommt nur nach dem Teilen oder, wenn das Gerät Dateien nicht teilen kann, nach dem Download. Bricht man ab, passiert nichts.
   Lehnt das Gerät ab (NotAllowedError oder ein anderer Fehler), sagt nochmal, was zu tun ist, und ok() bleibt aus. */
function dateiTeilen(blob,fname,typ,ok,nochmal){
  const file=new File([blob],fname,{type:typ});
  let geht=false;try{geht=!!(navigator.canShare&&navigator.share&&navigator.canShare({files:[file]}));}catch(e){}
  if(!geht){dlBlob(blob,fname);ok();return;}
  const fehler=err=>{if(err&&err.name==="AbortError")return;console.warn(err);toast(nochmal);};
  try{navigator.share({files:[file]}).then(ok,fehler);}catch(err){fehler(err);}
}
const DOCX_TYP="application/vnd.openxmlformats-officedocument.wordprocessingml.document";
/* Antrag ausfüllen (Spec Abschnitt 5 und Nachtrag): Formular 627 mit allen geplanten Urlauben des Jahres, je Datei höchstens 5.
   Die Vorlage kommt aus dem Offline-Cache des Service Workers (sw.js ASSETS). Erst alle Dateien bauen, dann je Datei ein Sheet
   mit Knopf „Antrag teilen“: Das Teilen-Menü braucht einen frischen Tipp, nach dem await gilt der erste nicht mehr.
   Erst nach dem Teilen bekommen die Urlaube der Datei formular, ausgefuelltAm und dieselbe antragId. */
async function urlaubAntrag(jahr){
  /* Pflicht ist nur der Name. Fachbereich ist freiwillig (Max 23.10.2026): leer bleibt das Feld im Formular frei. */
  if(!clean(S.absender)){toast("Für den Antrag fehlt noch dein Name. Trag ihn unter Einstellungen › Du und dein Vertrag ein.");return openSettings("vertrag");}
  const gruppen=antragZeilen(DB.urlaub,jahr);if(!gruppen.length)return;
  const heute=isoLocal(new Date()),p={absender:S.absender,fachbereich:S.fachbereich},dateien=[],nr0=naechsteAntragNr(DB.urlaub,jahr);
  try{
    const r=await fetch("vorlagen/627.dotx");
    if(!r.ok)throw new Error("Vorlage 627: "+r.status);
    const vorlage=new Uint8Array(await r.arrayBuffer());
    for(let g=0;g<gruppen.length;g++){
      const bytes=await antragDocx(vorlage,jahr,gruppen[g],p,heute,urlaubOrt(S.feiertagOrt));
      /* Nummer im Dateinamen, damit ein zweiter Antrag den ersten nicht überschreibt (Max 23.10.2026). */
      dateien.push({id:uid(),nr:nr0+g,zeilen:gruppen[g],blob:new Blob([bytes],{type:DOCX_TYP}),fname:"Urlaubsantrag "+jahr+" Nr "+(nr0+g)+".docx"});
    }
  }catch(e){console.error(e);toast("Der Antrag ließ sich nicht erstellen. Öffne die App einmal mit Netz und versuch es noch einmal.");return;}
  const n=dateien.length;
  const bereit=k=>{const d=dateien[k];
    openSheet(`<h3>Antrag ${d.nr} ist bereit</h3>
    <p class="note" style="margin:-8px 0 16px">${n>1?"Du hast mehr als 5 Urlaube geplant. Sie passen nicht in ein Formular, deshalb gibt es "+n+" Anträge. ":""}Tipp auf „Antrag teilen“, dann kannst du die Datei sichern oder verschicken.</p>
    <button class="btn" id="uTeil">Antrag teilen</button><button class="btn ghost" id="uTeilNein" style="margin-bottom:0">Später</button>`);
    /* Kein await vor dateiTeilen: der Aufruf läuft direkt in diesem Tipp. */
    document.getElementById("uTeil").onclick=()=>dateiTeilen(d.blob,d.fname,DOCX_TYP,()=>{
      d.zeilen.forEach(u=>Object.assign(u,{formular:"627",ausgefuelltAm:heute,antragId:d.id,antragNr:d.nr}));persist();render();
      if(k+1<n)bereit(k+1);else antragFertig(n);},"Teilen ging nicht. Tipp noch einmal auf „Antrag teilen“.");
    document.getElementById("uTeilNein").onclick=closeSheet;};
  bereit(0);
}

}

const scrim=document.getElementById("scrim"),sheet=document.getElementById("sheet");
let shT=null;
/* Wächter (V4.4, nur Unterseiten der Einstellungen): merkt die Feldwerte beim Öffnen. Schließen, Wischen und „Zurück“
   fragen nach, wenn sich etwas geändert hat. openSheet setzt ihn bei jedem neuen Sheet zurück. */
let sheetGuard=null;
function wacheSetzen(ids,extra){const start=ids.map(val).join("\u0001");sheetGuard=()=>ids.map(val).join("\u0001")!==start||!!(extra&&extra());}
function verwerfenFragen(weiter){askConfirm("Du hast hier etwas geändert und noch nicht gespeichert. Änderungen verwerfen?",()=>{sheetGuard=null;weiter();},"Verwerfen");}
function zurueckZurUebersicht(){if(sheetGuard&&sheetGuard())verwerfenFragen(()=>openSettings());else openSettings();}
function openSheet(html){clearTimeout(shT);sheetGuard=null;scrim.classList.remove("out");sheet.classList.remove("out");sheet.innerHTML='<div class="grip"></div>'+html;scrim.classList.add("on");sheet.scrollTop=0;document.body.style.overflow="hidden";}
function closeSheet(){
  if(!scrim.classList.contains("on")||scrim.classList.contains("out"))return;
  if(sheetGuard&&sheetGuard()){verwerfenFragen(closeSheet);return;}
  scrim.classList.add("out");
  if(!sheet.style.transform)sheet.classList.add("out");/* Swipe hat das Sheet schon rausgeschoben */
  shT=setTimeout(()=>{scrim.classList.remove("on","out");sheet.classList.remove("out");sheet.style.transform="";sheet.style.transition="";document.body.style.overflow="";},200);
}
scrim.addEventListener("click",e=>{if(e.target===scrim)closeSheet();});
/* Wisch nach unten schließt das Sheet (nur wenn der Inhalt oben steht) */
let swY=null,swActive=false;
sheet.addEventListener("touchstart",e=>{swY=e.touches[0].clientY;swActive=sheet.scrollTop<=0;},{passive:true});
sheet.addEventListener("touchmove",e=>{
  if(swY==null||!swActive)return;
  const dy=e.touches[0].clientY-swY;
  /* Erst ab 10 px nach unten (V4.4): Ein Tipp mit leichtem Zittern bleibt ein Tipp und lässt das Sheet nicht zucken. */
  if(dy>10&&sheet.scrollTop<=0){sheet.style.transition="none";sheet.style.transform="translateY("+(dy-10)+"px)";e.preventDefault();}
  else if(sheet.style.transform)sheet.style.transform="";
},{passive:false});
sheet.addEventListener("touchend",e=>{
  if(swY==null)return;
  const dy=e.changedTouches[0].clientY-swY;swY=null;
  if(swActive&&dy>110&&sheetGuard&&sheetGuard()){sheet.style.transition="transform .22s ease";sheet.style.transform="";setTimeout(()=>{sheet.style.transition="";},240);verwerfenFragen(closeSheet);}
  else if(swActive&&dy>110){sheet.style.transition="transform .22s ease";sheet.style.transform="translateY(100%)";setTimeout(closeSheet,210);}
  else{sheet.style.transition="transform .22s ease";sheet.style.transform="";setTimeout(()=>{sheet.style.transition="";},240);}
  swActive=false;
});

/* ===== Auftrag ===== */
function editOrder(id){
  const o=id?DB.orders.find(x=>x.id===id):{titel:"",auftragsnr:"",prodNummer:"",kostentraeger:"",produktionsort:""};
  openSheet(`<h3>${id?"Auftrag bearbeiten":"Neuer Auftrag"}</h3>
    <div class="field"><label>Titel (wie auf der Dispo)</label><input type="text" class="txt" id="f_titel" value="${esc(o.titel||"")}" placeholder="z. B. Produktionstitel"></div>
    <div class="two"><div class="field"><label>Auftrags-Nr.</label><input type="text" id="f_anr" value="${esc(o.auftragsnr||"")}" placeholder="A1234567"></div><div class="field"><label>Prod.-Nr.</label><input type="text" id="f_pnr" value="${esc(o.prodNummer||"")}" placeholder="12345678"></div></div>
    <div class="two"><div class="field"><label>Kostenträger</label><input type="text" id="f_kt" value="${esc(o.kostentraeger||"")}" placeholder="80123456"></div><div class="field"><label>Produktionsort</label><input type="text" class="txt" id="f_ort" value="${esc(o.produktionsort||"")}" placeholder="z. B. München"></div></div>
    <div class="field"><label>Mitarbeiter (für Nachweis)</label><input type="text" class="txt" id="f_mit" value="${esc(o.mitarbeiter||"")}" placeholder="Nachname, Vorname"></div>
    <div class="field"><label>Beschäftigung</label><div class="toggles" id="f_status"><button data-s="frei">Freier Mitarbeiter</button><button data-s="fest">Fest angestellt</button></div>
      <p class="note">Bei freien Mitarbeitern verlängert der Nachweis das Einsatzende, weil FLINK die Ruhepause immer abzieht: über 6:30 Std 30 Min, über 9:45 Std 45 Min, auch wenn du keine oder eine kürzere Pause gemacht hast. Fest Angestellte bekommen die Zeiten unverändert.</p></div>
    <div class="field"><label>Feiertage nach</label><select id="f_ftort">${ftOptionen(o.feiertagOrt||"",["","Wie Einstellungen: "+ortLabel(S.feiertagOrt)])}</select>
      <p class="note" id="f_ftnote"></p></div>
    ${S.verdienstOn?`<div class="field"><label>Funktion (für Verdienst)</label><div class="toggles" id="f_fk"><button data-f="assistent">Dreh-Assistent</button><button data-f="kamera">Kamera</button></div></div>`:""}
    <div class="field"><label>Sonder-Equipment (Mehrfachauswahl)</label><div class="chips" id="f_equip">${["Sony Alpha 7S III","Sony FX6","Sony FX3","2. Kamera","Drohne","DJI RS-Gimbal","Slider","Stativ/Head","ND-/Vari-ND-Filter","Timecode-Sync","Funkstrecke","Ton","Licht","Datenmanagement"].map(e=>`<button type="button" data-e="${esc(e)}"${(o.equipment||[]).includes(e)?' class="on"':''}>${esc(e)}</button>`).join("")}</div></div>
    <div class="field"><label>Sonstiges (optional)</label><textarea class="txt" id="f_notiz" rows="3" placeholder="z. B. weitere Hinweise">${esc(o.notiz||"")}</textarea></div>
    <button class="btn" id="saveOrder">Speichern</button><button class="btn ghost" id="cancelOrder" style="margin-bottom:0">Abbrechen</button>
    ${id?'<button class="btn danger" id="delOrder" style="margin:16px 0 0">Auftrag löschen</button>':''}`);
  document.getElementById("cancelOrder").onclick=closeSheet;
  document.querySelectorAll("#f_equip button").forEach(b=>b.onclick=()=>b.classList.toggle("on"));
  let tmpStatus=orderStatus(id?o:null);
  const paintStatus=()=>document.querySelectorAll("#f_status button").forEach(b=>b.classList.toggle("on",b.dataset.s===tmpStatus));
  /* Fest angestellt: Es gilt der Dienstort aus den Einstellungen, die Auswahl im Auftrag ist gesperrt (V4.3). */
  const paintFt=()=>{const fest=tmpStatus==="fest";document.getElementById("f_ftort").disabled=fest;
    document.getElementById("f_ftnote").textContent=fest?"Fest angestellt: Es gilt dein Dienstort aus Einstellungen › Du und dein Vertrag."
      :"Es zählen die Feiertage am Arbeitsort. Sie werden im Nachweis markiert und unten aufgelistet.";};
  document.querySelectorAll("#f_status button").forEach(b=>b.onclick=()=>{tmpStatus=b.dataset.s;paintStatus();paintFt();});
  paintStatus();paintFt();
  let tmpFk=orderFunktion(id?o:null);
  const paintFk=()=>document.querySelectorAll("#f_fk button").forEach(b=>b.classList.toggle("on",b.dataset.f===tmpFk));
  document.querySelectorAll("#f_fk button").forEach(b=>b.onclick=()=>{tmpFk=b.dataset.f;paintFk();});
  paintFk();
  document.getElementById("saveOrder").onclick=()=>{
    const equipment=[...document.querySelectorAll("#f_equip button.on")].map(b=>b.dataset.e);
    const data={titel:val("f_titel"),auftragsnr:val("f_anr"),prodNummer:val("f_pnr"),kostentraeger:val("f_kt"),produktionsort:val("f_ort"),mitarbeiter:val("f_mit"),notiz:val("f_notiz"),equipment,status:tmpStatus,...(S.verdienstOn?{funktion:tmpFk}:{})};
    if(!data.titel){toast("Bitte einen Titel eingeben");return;}
    let ziel=o;if(id)Object.assign(o,data);else{ziel={id:uid(),...data,days:[]};DB.orders.push(ziel);state.orderId=ziel.id;}
    const fo=val("f_ftort");if(fo)ziel.feiertagOrt=fo;else delete ziel.feiertagOrt;
    persist();closeSheet();render();toast(id?"Gespeichert":"Auftrag angelegt");};
  if(id)document.getElementById("delOrder").onclick=()=>{askConfirm("Diesen Auftrag mit allen Tagen wirklich löschen?",()=>{DB.orders=DB.orders.filter(x=>x.id!==id);persist();state.orderId=null;closeSheet();render();toast("Auftrag gelöscht");});};
}

/* ===== Tag ===== */
let tmpPause,tmpUE,tmpAL;
function editDay(orderId,dayId){
  const o=DB.orders.find(x=>x.id===orderId);
  const d=dayId?o.days.find(x=>x.id===dayId):{datum:guessNextDate(o),...neuerTag(o)};
  tmpPause=d.pause!==false; tmpUE=!!d.uebernachtung; tmpAL=!!d.ausland;
  const dsp=d.dispo||{}; const hasDispo=dsp.einsatz||dsp.ende;
  openSheet(`<h3>${dayId?"Tag bearbeiten":"Tag erfassen"}</h3>
    <div class="field"><label>Datum</label><input type="date" id="d_datum" value="${d.datum||""}"></div>
    ${hasDispo?`<div class="dispoinfo"><span>Laut Dispo: ${dsp.einsatz||"?"}–${dsp.ende||"?"}</span><button id="useDispo">übernehmen</button></div>`:""}
    <div class="field"><label>Tagestyp</label><div class="toggles typseg" id="typSeg"><button type="button" data-typ="an">Anreisetag</button><button type="button" data-typ="ort">Vor Ort</button><button type="button" data-typ="rueck">Rückreisetag</button><button type="button" data-typ="ein">Eintägig</button></div><p class="note" id="typNote"></p></div>
    <div class="timebox acc"><div class="tl"><span>Einsatz</span><span class="hint">zählt für Überstunden und Nachweis</span></div>
      <div class="two">
        <div class="tfield"><span class="tlbl">von</span><input type="time" id="d_einsatz" value="${d.einsatz||""}"></div>
        <div class="tfield"><span class="tlbl">bis</span><input type="time" id="d_ende" value="${d.ende||""}"></div>
      </div>
      <p class="note endehw hidden" id="endeHw"></p>
    </div>
    <div class="timebox"><div class="tl"><span>Drehzeit</span><span class="mseg" id="azSeg"><button type="button" data-az="1">kein Dreh</button><button type="button" data-az="0">Dreh</button></span></div>
      <div class="two" id="azFields">
        <div class="tfield"><span class="tlbl">von</span><input type="time" id="d_drehbeginn" value="${d.drehbeginn||""}"></div>
        <div class="tfield"><span class="tlbl">bis</span><input type="time" id="d_drehende" value="${d.drehende||""}"></div>
      </div>
      <p class="note" id="azNote">Steht im Nachweis, zählt nicht extra. Sie liegt in der Einsatzzeit.</p>
    </div>
    <div class="timebox"><div class="tl"><span>Reisezeit</span><span class="hint">liegt in der Einsatzzeit</span></div>
      <div class="rzblock"><div class="nrow"><span class="rlbl">Anreise</span><button type="button" class="offbtn" id="anNone">entfällt</button></div>
        <div class="two"><div class="tfield"><span class="tlbl">von</span><input type="time" id="d_anreise" value="${d.anreise||""}"></div><div class="tfield"><span class="tlbl">bis</span><input type="time" id="d_anreiseEnde" value="${d.anreiseEnde||""}"></div></div></div>
      <div class="rzblock"><div class="nrow"><span class="rlbl">Rückreise</span><button type="button" class="offbtn" id="rkNone">entfällt</button></div>
        <div class="two"><div class="tfield"><span class="tlbl">von</span><input type="time" id="d_rueckBeginn" value="${d.rueckBeginn||""}"></div><div class="tfield"><span class="tlbl">bis</span><input type="time" id="d_rueck" value="${d.rueck||""}"></div></div></div>
    </div>
    <div class="field"><label>Pause genommen?</label><div class="toggles" id="pausebtns"><button data-p="1">Ja · ${fmtMin(S.standardPause)}</button><button data-p="0">Nein</button></div></div>
    <div id="flinkbox" class="nwwrap"></div>
    <div class="calc" id="calc"></div>
    <div class="section-h" style="margin:18px 0 8px"><h3>Dienstreise</h3></div>
    <div class="field"><label>Ausland?</label><div class="toggles" id="albtns"><button data-a="1">Ja</button><button data-a="0">Nein</button></div></div>
    <div id="grenzwrap" class="hidden">
      <div class="timebox" id="grenzbox">
        <div class="tl"><span>Grenzübertritt</span></div>
        <div class="two">
          <div class="tfield gfield"><span class="tlbl">hin</span><input type="time" id="d_grenzHin" value="${d.grenzHin||""}"><span class="gleer">nicht erfasst</span><button type="button" class="gclr" id="clrGrenzHin" aria-label="Grenze hin leeren">✕</button></div>
          <div class="tfield gfield"><span class="tlbl">zurück</span><input type="time" id="d_grenzRueck" value="${d.grenzRueck||""}"><span class="gleer">nicht erfasst</span><button type="button" class="gclr" id="clrGrenzRueck" aria-label="Grenze zurück leeren">✕</button></div>
        </div>
        <p class="note">Deutschland verlassen und wieder angekommen. Steht unten im Notizfeld von PDF und Mail, nicht in der Zeitentabelle.</p>
      </div>
    </div>
    <div class="field" style="margin-top:14px"><label>Feiertag am Arbeitsort</label><input type="text" class="txt" id="d_feiertag" value="${esc(feiertagTag(o,d))}" placeholder="kein Feiertag">
      <p class="note">${feiertagOrt(o)==="XX"?"Für dieses Land kennt die App nur Oster- und Pfingstsonntag.":"Automatisch nach "+esc(ortLabel(feiertagOrt(o)))+"."} Leeren heißt: kein Feiertag. Für ein Land, das die App nicht kennt, trägst du den Namen selbst ein.</p></div>
    <div id="tgbox"></div>
    <p class="note">Überstunden rechnet die App nur aus der Einsatzzeit minus Pause. Dreh- und Reisezeit stehen im Nachweis und schlagen das Einsatzende vor: letzte Tätigkeit plus 30 Minuten, bis du es selbst tippst.</p>
    <button class="btn" id="saveDay" style="margin-top:14px">Speichern</button>
    <div class="btnrow">${dayId?'<button class="btn danger" id="delDay" style="margin-bottom:0">Tag löschen</button>':''}<button class="btn ghost" id="cancelDay" style="margin-bottom:0">Abbrechen</button></div>`);
  const g=id=>document.getElementById(id);
  function paintPause(){document.querySelectorAll("#pausebtns button").forEach(b=>b.classList.toggle("on",(b.dataset.p==="1")===tmpPause));}
  document.querySelectorAll("#pausebtns button").forEach(b=>b.onclick=()=>{tmpPause=b.dataset.p==="1";paintPause();recalc();});
  /* Tagestyp (V4.4): folgt live dem Formular (tmpUE und Leere der Reisefelder), kein eigenes Datenfeld.
     Ein Tipp setzt Übernachtung und schaltet die Fahrten über dieselben Wege wie „entfällt“. Tipp auf den aktiven Typ: nichts. */
  const TYP_NOTE={ein:"Ohne Übernachtung. Hin- und Rückfahrt am selben Tag.",an:"Mit Übernachtung. Anreise ja, Rückreise entfällt.",ort:"Mit Übernachtung, ohne Fahrt.",rueck:"Mit Übernachtung. Anreise entfällt, Rückreise ja.",eigen:"Eigene Angaben: Übernachtung mit Hin- und Rückfahrt am selben Tag."};
  function formTyp(){return dayTyp({uebernachtung:tmpUE,anreise:val("d_anreise"),anreiseEnde:val("d_anreiseEnde"),rueckBeginn:val("d_rueckBeginn"),rueck:val("d_rueck")});}
  function paintTyp(){const t=formTyp();document.querySelectorAll("#typSeg button").forEach(b=>b.classList.toggle("on",b.dataset.typ===t));const beide=(val("d_anreise")||val("d_anreiseEnde"))&&(val("d_rueckBeginn")||val("d_rueck"));g("typNote").textContent=t==="ein"&&!beide?"Ohne Übernachtung.":TYP_NOTE[t];}
  document.querySelectorAll("#typSeg button").forEach(b=>b.onclick=()=>{
    const t=b.dataset.typ;if(t===formTyp())return;
    const f=typFelder(t),vorher=val("d_ende");
    const an=!!(val("d_anreise")||val("d_anreiseEnde")),rk=!!(val("d_rueckBeginn")||val("d_rueck"));
    tmpUE=f.ue;
    if(f.an!==an||(!f.an&&!anNoneBtn.classList.contains("on")))applyAN(!f.an);
    if(f.rk!==rk||(!f.rk&&!rkNoneBtn.classList.contains("on")))applyRK(!f.rk);
    endeAnpassen(vorher);recalc();});
  function paintAL(){document.querySelectorAll("#albtns button").forEach(b=>b.classList.toggle("on",(b.dataset.a==="1")===tmpAL));
    /* Grenzuebertritt nur bei Auslandsreisen anbieten */
    g("grenzwrap").classList.toggle("hidden",!tmpAL);}
  document.querySelectorAll("#albtns button").forEach(b=>b.onclick=()=>{tmpAL=b.dataset.a==="1";paintAL();recalc();});

  /* Grenzübertritt (V4.4): bei Ausland sofort eintragbar, jedes Feld mit eigenem ✕, „nicht erfasst“ bei leerem Feld.
     Kein Sperrschalter, kein eigenes Datenfeld. Amber, sobald ein Wert steht. */
  function paintGrenz(){let eins=false;
    ["d_grenzHin","d_grenzRueck"].forEach(id=>{const voll=!!val(id);g(id).parentNode.classList.toggle("voll",voll);if(voll)eins=true;});
    g("grenzbox").classList.toggle("acc",eins);}
  ["d_grenzHin","d_grenzRueck"].forEach(id=>{g(id).oninput=g(id).onchange=paintGrenz;});
  g("clrGrenzHin").onclick=()=>{g("d_grenzHin").value="";paintGrenz();};
  g("clrGrenzRueck").onclick=()=>{g("d_grenzRueck").value="";paintGrenz();};
  /* Halbe Fahrt aus dem Import (nur ein Ende gefüllt): Das leere Ende gilt als bewusst leer (V4.4). Sonst füllte
     deriveFromEinsatz es beim Ändern des Einsatzbeginns mit einsatz+60, und es entstand z. B. „08:00–07:00“. */
  let anEd=!!(d.anreise&&d.anreise!==addMin(d.einsatz,30))||(!d.anreise&&!!d.anreiseEnde);
  let aeEd=!!(d.anreiseEnde&&d.anreiseEnde!==addMin(d.einsatz,60))||(!d.anreiseEnde&&!!d.anreise);
  let dbEd=!!(d.drehbeginn&&d.drehbeginn!==addMin(d.einsatz,60));
  /* Getipptes Ende und Ende aus der Dispo bleiben stehen (V4.4), sonst rechnet es sich automatisch. */
  let endeEd=endeGeschuetzt(d);
  function deriveFromEinsatz(){const e=val("d_einsatz");if(!anEd)g("d_anreise").value=e?addMin(e,30):"";if(!aeEd)g("d_anreiseEnde").value=e?addMin(e,60):"";if(!dbEd)g("d_drehbeginn").value=e?addMin(e,60):"";}
  function computeEnde(){if(endeEd)return;g("d_ende").value=autoEnde({rueck:val("d_rueck"),drehende:val("d_drehende"),anreiseEnde:val("d_anreiseEnde")});}
  /* Nach Typwechsel, „entfällt“ oder „kein Dreh“: Ende neu rechnen und eine Änderung sichtbar machen (V4.4). */
  function endeAnpassen(vorher){computeEnde();const jetzt=val("d_ende");
    if(!endeEd&&jetzt!==vorher){g("endeHw").textContent=`Einsatzende automatisch angepasst: ${vorher||"–"} → ${jetzt||"–"}`;g("endeHw").classList.remove("hidden");}}
  g("d_anreise").oninput=()=>{anEd=true;recalc();};
  g("d_anreiseEnde").oninput=()=>{aeEd=true;computeEnde();recalc();};
  g("d_drehbeginn").oninput=()=>{dbEd=true;recalc();};
  g("d_drehende").oninput=()=>{computeEnde();recalc();};
  g("d_rueckBeginn").oninput=()=>{recalc();};
  /* Feiertag folgt dem Datum, bis er von Hand geändert wird (V4.3). */
  let ftEd=typeof d.feiertag==="string";
  g("d_feiertag").oninput=()=>{ftEd=true;recalc();};
  g("d_datum").oninput=g("d_datum").onchange=()=>{if(!ftEd)g("d_feiertag").value=feiertagAuto(val("d_datum"),feiertagOrt(o));recalc();};
  g("d_rueck").oninput=()=>{computeEnde();recalc();};
  g("d_einsatz").oninput=()=>{deriveFromEinsatz();computeEnde();recalc();};
  g("d_ende").oninput=()=>{endeEd=true;recalc();};
  /* Wer selbst eine Zeit tippt, braucht den Hinweis auf die automatische Anpassung nicht mehr. */
  sheet.querySelectorAll(".tfield input").forEach(i=>i.addEventListener("input",()=>g("endeHw").classList.add("hidden")));
  /* "Uebernehmen" setzt NUR die Einsatzzeit. Frueher hat es zusaetzlich die
     "kein Dreh"- und "entfaellt"-Schalter aufgehoben und Reisezeiten erfunden -
     an einem Uebernachtungstag landete so eine Rueckreise im Nachweis.
     deriveFromEinsatz respektiert die Edit-Flags, getippte Felder bleiben stehen. */
  /* Das Ende ändert sich hier ohne input-Ereignis, also den Hinweis auf die automatische Anpassung selbst ausblenden (V4.4). */
  if(hasDispo)g("useDispo").onclick=()=>{g("d_einsatz").value=dsp.einsatz||"";g("d_ende").value=dsp.ende||"";endeEd=true;g("endeHw").classList.add("hidden");deriveFromEinsatz();recalc();};
  function recalc(){
    paintTyp();
    const c=dayCalc({einsatz:val("d_einsatz"),ende:val("d_ende"),drehbeginn:val("d_drehbeginn"),drehende:val("d_drehende"),pause:tmpPause,uebernachtung:tmpUE,ausland:tmpAL});
    g("calc").innerHTML=`<div class="clbl">Rechnung</div>
      <div class="r">
        <div class="c"><div class="l">Einsatz</div><div class="n">${fmtMin(c.span)}</div></div>
        <div class="c"><div class="l">− Pause</div><div class="n">${fmtMin(c.pause)}</div></div>
        <div class="c"><div class="l">Netto</div><div class="n">${fmtMin(c.netto)}</div></div>
      </div><hr>
      <div class="r">
        <div class="c"><div class="l">Soll</div><div class="n">${fmtMin(S.sollMin)}</div></div>
        <div class="c"><div class="l">Überstunden</div><div class="n big ${otClass(c.ot)}">${fmtSigned(c.ot)}</div></div>
      </div>`;
    /* Verdienst nach Tarif (V4.1): nur wenn die Option an ist, der Auftrag frei ist und ein Tagessatz existiert */
    const tt=tarifTag(o,{datum:val("d_datum"),einsatz:val("d_einsatz"),ende:val("d_ende"),anreise:val("d_anreise"),anreiseEnde:val("d_anreiseEnde"),rueckBeginn:val("d_rueckBeginn"),rueck:val("d_rueck"),pause:tmpPause,feiertag:clean(val("d_feiertag"))});
    if(tt)g("calc").insertAdjacentHTML("beforeend",`<hr><div class="tarifz">Laut Tarif: Mehrarbeit ${fmtStd(tt.mehrStd)} · ${fmtEur(runde2(tt.mehrEur+tt.mehrZuschlEur))}${tt.nachtEur?" · Nacht "+fmtEur(tt.nachtEur):""}${tt.sonntagEur?" · Sonntag "+fmtEur(tt.sonntagEur):""}${tt.feiertagEur?" · Feiertag "+fmtEur(tt.feiertagEur):""}</div>`);
    /* „So steht es im Nachweis“ (V4.4): wie der Nachweis aussieht und, bei Freien mit Ausgleich, was FLINK am Ende bucht.
       Die Rechnung selbst (korr, flinkNw, exportEnde) bleibt unverändert. */
    const fb=g("flinkbox");
    if(fb){
      const frei=orderStatus(o)==="frei";
      const mm=n=>n+" Min";
      if(c.span==null){fb.innerHTML="";}
      else if(!frei){fb.innerHTML=`<div class="tgbox"><div class="t"><span>So steht es im Nachweis: wie eingetragen</span><span class="in">fest angestellt</span></div><div class="why">FLINK zieht ${mm(c.flink)} ab. Für fest Angestellte stimmt das, der Nachweis zeigt deine Zeiten unverändert.</div></div>`;}
      else if(c.korr>0){
        const schwelle=c.flink===45?S.flink45:S.flink30;
        const sprung=c.flinkNw>c.flink
          ? ` Eine Verlängerung um ${mm(c.flink-c.pause)} würde den Nachweis über ${fmtMin(S.flink45)} Std schieben, und dort zieht FLINK ${mm(c.flinkNw)} ab.`
          : "";
        const wieso=(c.pause>0
          ? `Über ${fmtMin(schwelle)} Std zieht FLINK immer ${mm(c.flink)} Pause ab, du machst ${mm(c.pause)}.`
          : `Über ${fmtMin(schwelle)} Std zieht FLINK ${mm(c.flink)} Pause ab, auch wenn du keine Pause gemacht hast.`)+sprung;
        const nwSpan=c.span+c.korr;
        fb.innerHTML=`<div class="tgbox nw"><div class="t"><span>So steht es im Nachweis: ${addMin(val("d_ende"),c.korr)}</span><span class="in">+${mm(c.korr)}</span></div><div class="why">${wieso} Deshalb endet der Nachweis ${mm(c.korr)} später. FLINK bucht dann ${fmtMin(nwSpan)} minus ${mm(c.flinkNw)}, also ${fmtMin(nwSpan-c.flinkNw)}. Das ist genau deine Nettozeit.</div></div>`;}
      else{fb.innerHTML=`<div class="tgbox"><div class="t"><span>So steht es im Nachweis: wie eingetragen</span><span class="in">FLINK ${mm(c.flink)}</span></div><div class="why">${c.flink>0&&c.flink===c.pause?"Deine Pause und der FLINK-Abzug sind gleich, die Pause steckt in der Arbeitszeit. Kein Ausgleich nötig.":(c.flink===0?"Bis "+fmtMin(S.flink30)+" Std zieht FLINK keine Pause ab.":"Kein Ausgleich nötig.")}</div></div>`;}
    }
    const box=g("tgbox");const t=c.tg;
    if(t.state==="ok"){box.innerHTML=`<div class="tgbox ok"><div class="t"><span>Tagegeld: 14,00 €</span><span class="in">nur intern</span></div><div class="why">Abwesenheit ${fmtMin(c.absence)} h · über der Schwelle von ${fmtMin(S.abwesenheitMin)} h, eintägig, Inland. Bitte selbst beantragen, binnen sechs Monaten. Stellt die Produktion Essen, kürzt das ZDF: Frühstück 5,60 €, Mittag- und Abendessen je 11,20 €.</div></div>`;}
    else{
      const why=t.state==="ue"?"Mehrtägige Reise mit Übernachtung: Das Tagegeld kommt automatisch über die Dienstreise-Abrechnung, 14 € für An- und Abreisetag, 28 € für volle Tage. Beantragen musst du hier nichts."
        :t.state==="ausland"?"Auslandsreise: Der Spesensatz ist Ländersache und wird über den Reisedienst abgerechnet. Deshalb steht hier kein Betrag."
        :t.state==="under"?`Abwesenheit ${fmtMin(c.absence)} h liegt unter der Schwelle von ${fmtMin(S.abwesenheitMin)} h.`+(c.absence>=S.abwesenheitMin-60?" Zählt deine Anfahrt von zu Hause dazu, kann es trotzdem reichen: Gerechnet wird ab der Abfahrt von der Wohnung.":"")
        :"Zeiten eintragen.";
      box.innerHTML=`<div class="tgbox"><div class="t"><span>${t.state==="ue"?"Tagegeld über die Reiseabrechnung":"Kein Tagegeld"}</span><span class="in">nur intern</span></div><div class="why">${why}</div></div>`;
    }
  }
  const anNoneBtn=g("anNone"),rkNoneBtn=g("rkNone");
  function paintAZ(none){document.querySelectorAll("#azSeg button").forEach(b=>b.classList.toggle("on",(b.dataset.az==="1")===none));g("azFields").classList.toggle("hidden",none);g("azNote").classList.toggle("hidden",none);}
  /* Gedächtnis im offenen Sheet (V4.4): Was ein Schalter oder Tagestyp leert, kommt beim Wiedereinschalten zurück,
     samt Edit-Merkern. Nur ohne gemerkte Werte gelten die Startwerte. Gespeichert wird weiter nur der Feldwert.
     Danach rechnet deriveFromEinsatz nicht getippte Werte von der aktuellen Einsatzzeit neu, getippte bleiben stehen.
     Die Rückreise hat keinen Edit-Merker und folgt auch sonst weder Einsatz noch Drehende, sie kommt unverändert zurück. */
  const keep={};
  function applyAZ(none){paintAZ(none);g("d_drehbeginn").disabled=none;g("d_drehende").disabled=none;
    if(none){if(val("d_drehbeginn")||val("d_drehende"))keep.az={v:[val("d_drehbeginn"),val("d_drehende")],ed:dbEd};g("d_drehbeginn").value="";g("d_drehende").value="";dbEd=true;}
    else if(keep.az){const e=val("d_einsatz"),[v0,v1]=keep.az.v;dbEd=keep.az.ed;g("d_drehbeginn").value=v0&&!dbEd&&e?addMin(e,60):v0;g("d_drehende").value=v1;}
    else{const e=val("d_einsatz");dbEd=false;g("d_drehbeginn").value=e?addMin(e,60):"";g("d_drehende").value=e?addMin(e,480):"";}}
  function applyAN(none){anNoneBtn.classList.toggle("on",none);g("d_anreise").disabled=none;g("d_anreiseEnde").disabled=none;
    if(none){if(val("d_anreise")||val("d_anreiseEnde"))keep.an={v:[val("d_anreise"),val("d_anreiseEnde")],ed:[anEd,aeEd]};g("d_anreise").value="";g("d_anreiseEnde").value="";anEd=true;aeEd=true;}
    else if(keep.an){const e=val("d_einsatz"),[v0,v1]=keep.an.v;anEd=keep.an.ed[0];aeEd=keep.an.ed[1];
      /* Nur ein automatischer Wert mit Inhalt folgt dem aktuellen Einsatzbeginn. Ein leeres Feld (halbe Fahrt aus dem Import) bleibt leer. */
      g("d_anreise").value=v0&&!anEd&&e?addMin(e,30):v0;g("d_anreiseEnde").value=v1&&!aeEd&&e?addMin(e,60):v1;}
    else{const e=val("d_einsatz");anEd=false;aeEd=false;g("d_anreise").value=e?addMin(e,30):"";g("d_anreiseEnde").value=e?addMin(e,60):"";}}
  /* Eine gemerkte Rückreise passt nur, wenn sie nicht vor dem aktuellen Drehende beginnt. Sonst wurde der Dreh inzwischen verlängert,
     und die Startwerte ab Drehende sind richtig. Verglichen wird relativ zum Einsatzbeginn, damit es auch über Mitternacht stimmt. */
  function rkPasst(rk){const e=hm2min(val("d_einsatz")),de=hm2min(val("d_drehende")),rb=hm2min(rk[0]||rk[1]);
    return e==null||de==null||rb==null||dur(e,rb)>=dur(e,de);}
  function applyRK(none){rkNoneBtn.classList.toggle("on",none);g("d_rueckBeginn").disabled=none;g("d_rueck").disabled=none;
    if(none){if(val("d_rueckBeginn")||val("d_rueck"))keep.rk=[val("d_rueckBeginn"),val("d_rueck")];g("d_rueckBeginn").value="";g("d_rueck").value="";}
    else if(keep.rk&&rkPasst(keep.rk)){g("d_rueckBeginn").value=keep.rk[0];g("d_rueck").value=keep.rk[1];}
    else{const rb=val("d_drehende")||addMin(val("d_einsatz"),480);g("d_rueckBeginn").value=rb;g("d_rueck").value=rb?addMin(rb,30):"";}}
  /* Tipp auf das schon aktive Segment tut nichts (V4.4). Vorher überschrieb „Dreh“ bei aktivem „Dreh“ getippte Zeiten. */
  document.querySelectorAll("#azSeg button").forEach(b=>b.onclick=()=>{const none=b.dataset.az==="1";if(none===g("azFields").classList.contains("hidden"))return;const vorher=val("d_ende");applyAZ(none);endeAnpassen(vorher);recalc();});
  anNoneBtn.onclick=()=>{const vorher=val("d_ende");applyAN(!anNoneBtn.classList.contains("on"));endeAnpassen(vorher);recalc();};
  rkNoneBtn.onclick=()=>{const vorher=val("d_ende");applyRK(!rkNoneBtn.classList.contains("on"));endeAnpassen(vorher);recalc();};
  function initNone(){
    /* Gilt seit V4.4 auch für neue Tage: Ein Vor-Ort-Tag startet mit „entfällt“, sonst füllt deriveFromEinsatz die Anreise wieder. */
    const azN=!d.drehbeginn&&!d.drehende, anN=!d.anreise&&!d.anreiseEnde, rkN=!d.rueckBeginn&&!d.rueck;
    paintAZ(azN);g("d_drehbeginn").disabled=azN;g("d_drehende").disabled=azN;if(azN)dbEd=true;
    anNoneBtn.classList.toggle("on",anN);g("d_anreise").disabled=anN;g("d_anreiseEnde").disabled=anN;if(anN){anEd=true;aeEd=true;}
    rkNoneBtn.classList.toggle("on",rkN);g("d_rueckBeginn").disabled=rkN;g("d_rueck").disabled=rkN;
  }
  paintPause();paintAL();paintGrenz();initNone();recalc();
  g("cancelDay").onclick=closeSheet;
  if(dayId)g("delDay").onclick=()=>{askConfirm("Diesen Arbeitstag wirklich löschen?",()=>{o.days=o.days.filter(x=>x.id!==dayId);persist();closeSheet();render();toast("Tag gelöscht");});};
  g("saveDay").onclick=()=>{
    const data={datum:val("d_datum"),einsatz:val("d_einsatz"),anreise:val("d_anreise"),anreiseEnde:val("d_anreiseEnde"),drehbeginn:val("d_drehbeginn"),drehende:val("d_drehende"),rueckBeginn:val("d_rueckBeginn"),rueck:val("d_rueck"),ende:val("d_ende"),pause:tmpPause,uebernachtung:tmpUE,ausland:tmpAL,grenzHin:tmpAL?val("d_grenzHin"):"",grenzRueck:tmpAL?val("d_grenzRueck"):""};
    if(!data.datum){toast("Bitte Datum angeben");return;}
    /* Gleich dem automatischen Wert: kein eigener Eintrag, der Tag folgt weiter dem Arbeitsort. Sonst speichern, auch leer. */
    const ftWert=clean(val("d_feiertag")),ftAuto=feiertagAuto(data.datum,feiertagOrt(o));
    let ziel=d;if(dayId)Object.assign(d,data);else{ziel={id:uid(),...data,dispo:d.dispo};o.days.push(ziel);}
    if(ftWert===ftAuto)delete ziel.feiertag;else ziel.feiertag=ftWert;
    persist();const c=dayCalc(data);closeSheet();render();
    toast(c.tg.state==="ok"?"Gespeichert · Tagegeld möglich":(dayId?"Gespeichert":"Tag hinzugefügt"));
  };
}
/* Lokales ISO-Datum. toISOString() rechnet nach UTC und verschiebt in Deutschland
   den Tag zurueck - der Folgetag war dadurch immer der Vortag. */
function isoLocal(dt){return dt.getFullYear()+"-"+String(dt.getMonth()+1).padStart(2,"0")+"-"+String(dt.getDate()).padStart(2,"0");}
function guessNextDate(o){if(o.days.length){const last=o.days.map(d=>d.datum).filter(Boolean).sort().pop();if(last){const dt=new Date(last+"T00:00");dt.setDate(dt.getDate()+1);return isoLocal(dt);}}return isoLocal(new Date());}

/* Auswahl der Feiertags-Orte, gruppiert nach Deutschland, Schweiz, weitere Länder (V4.3).
   erste = optionale erste Option [Wert, Text], z. B. ["", "Wie Einstellungen: Bayern"]. */
function ftOptionen(wahl,erste){
  let h=erste?`<option value="${esc(erste[0])}"${wahl===erste[0]?" selected":""}>${esc(erste[1])}</option>`:"",gruppe="";
  FT_ORTE.forEach(([k,name,g])=>{if(g!==gruppe){h+=(gruppe?"</optgroup>":"")+`<optgroup label="${esc(g)}">`;gruppe=g;}
    h+=`<option value="${k}"${k===wahl?" selected":""}>${esc(name)}</option>`;});
  return h+"</optgroup>";
}

/* Unterseite „Urlaub und Antrag“: speichert urlaubAnspruch, urlaubSatz und den Fachbereich für den Antrag. */
function openUrlaubSettings(){
  openSheet(`<h3>Urlaub und Antrag</h3>
    <div class="field"><label>Urlaubstage im Jahr</label><input type="text" inputmode="numeric" id="u_ansp" value="${S.urlaubAnspruch}"></div>
    <p class="note">Laut Merkblatt sind es 31 Arbeitstage.</p>
    <div class="field" style="margin-top:12px"><label>Betrag je Urlaubstag (Euro)</label><input type="text" inputmode="decimal" id="u_satz" placeholder="z. B. 200,00" value="${S.urlaubSatz?esc(String(S.urlaubSatz).replace(".",",")):""}"></div>
    <p class="note">Damit zeigt die App ungefähr, was du für deinen Urlaub bekommst. Ohne Betrag fehlt nur diese Zeile.</p>
    <div class="section-h"><h3>Für den Antrag</h3></div>
    <div class="field"><label>Fachbereich (freiwillig)</label><input type="text" id="u_fb" placeholder="z. B. HR Sport" value="${esc(S.fachbereich)}"></div>
    <p class="note">Trägst du hier nichts ein, bleibt das Feld im Antrag leer und du füllst es selbst aus.</p>
    <p class="note">Dein Name kommt aus „Du und dein Vertrag“. Alles bleibt auf deinem Gerät und steht nur im Antrag.</p>
    <button class="btn" id="u_save" style="margin-top:16px">Speichern</button><button class="btn ghost" id="u_back" style="margin-bottom:0">Zurück</button>`);
  wacheSetzen(["u_ansp","u_satz","u_fb"]);
  document.getElementById("u_back").onclick=zurueckZurUebersicht;
  document.getElementById("u_save").onclick=()=>{
    const ar=val("u_ansp").trim(),a=/^\d+$/.test(ar)?parseInt(ar,10):0;
    if(!(a>=1&&a<=60)){toast("Urlaubstage: ganze Zahl von 1 bis 60");return;}
    const sr=val("u_satz").trim(),sa=parseEur(sr);
    /* parseEur rundet auf Cent: 0,004 ergibt 0, das zählt hier nicht als Betrag. */
    if(sr!==""&&(sa===null||sa===0)){toast("Betrag je Urlaubstag: eine Zahl über 0");return;}
    S.urlaubAnspruch=a;S.urlaubSatz=sa;S.fachbereich=clean(val("u_fb"));
    persist();render();openSettings();toast("Einstellungen gespeichert");};
}

/* ===== Datensicherung ===== */
function exportBackup(){
  const fname="Zeiterfassung-Backup_"+new Date().toISOString().slice(0,10)+".json";
  const blob=new Blob([JSON.stringify({app:"zeiterfassung",exportedAt:new Date().toISOString(),data:DB},null,1)],{type:"application/json"});
  const file=new File([blob],fname,{type:"application/json"});
  const mark=()=>{S.lastBackup=Date.now();persist();const lb=document.getElementById("lastBak");if(lb)lb.textContent="heute";};
  if(navigator.canShare&&navigator.canShare({files:[file]})){
    navigator.share({files:[file]}).then(()=>{mark();toast("Backup geteilt");render();}).catch(err=>{if(err&&err.name!=="AbortError"){dlBlob(blob,fname);mark();render();}});
  }else{dlBlob(blob,fname);mark();render();}
}
function dlBlob(blob,fname){const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=fname;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),3000);toast("Datei gespeichert");}

/* Stand vor dem Einlesen (V4.4.2, Review A3): eine Kopie unter KEY_PREV, in den Einstellungen zurückholbar. */
function prevSichern(db){try{localStorage.setItem(KEY_PREV,JSON.stringify({gesichertAm:new Date().toISOString(),data:db}));return true;}catch(e){return false;}}
function prevLaden(){try{const x=JSON.parse(localStorage.getItem(KEY_PREV)||"null");const b=istObj(x)?backupPruefen({app:"zeiterfassung",data:x.data}):null;return b?{gesichertAm:x.gesichertAm||"",db:b.db}:null;}catch(e){return null;}}
function prevLoeschen(){try{localStorage.removeItem(KEY_PREV);}catch(e){}}
document.getElementById("backupInput").addEventListener("change",e=>{
  const f=e.target.files[0];e.target.value="";if(!f)return;
  const r=new FileReader();
  r.onerror=()=>toast("Datei nicht lesbar. Liegt sie in iCloud, lade sie zuerst in der Dateien-App.");
  r.onload=()=>{
    let j=null;try{j=JSON.parse(r.result);}catch(err){}
    const b=backupPruefen(j);
    if(!b){toast("Keine gültige Backup-Datei");return;}
    askConfirm(backupFrage(b.db,b.exportedAt,DB,false),()=>{
      if(!prevSichern(DB)){toast("Der jetzige Stand ließ sich nicht sichern. Nichts eingelesen.");return;}
      DB=standBereinigen(b.db);persist();location.reload();
    },"Einlesen");
  };
  r.readAsText(f);
});

/* ===== Was ist neu ===== */
function openWhatsNew(alle){
  /* Nach einem Update nur die Versionen zeigen, die der Nutzer noch nicht gesehen hat.
     Beim Aufruf aus den Einstellungen (alle=true) die komplette Liste. */
  const seen=S.seenVersion||"";
  const cmp=(a,b)=>a.split(".").map(Number).reduce((r,n,i)=>r||n-(+b.split(".")[i]||0),0);
  const zeigen=alle?WHATSNEW:WHATSNEW.filter(w=>!seen||cmp(w.v,seen)>0);
  const liste=(zeigen.length?zeigen:WHATSNEW.slice(0,1));
  openSheet(`<h3>Was ist neu</h3>
    <p class="note" style="margin:-8px 0 16px">Version ${APP_VERSION}${seen?" · zuletzt gesehen: "+esc(seen):""}</p>
    ${liste.map(w=>`<div class="section-h" style="margin:18px 0 8px"><h3>V${w.v} · ${esc(w.t)}</h3></div>
      ${w.items.map(([k,txt])=>`<div class="hsec"><div class="eb">${esc(k)}</div><p>${esc(txt)}</p></div>`).join("")}`).join("")}
    <button class="btn" id="wnOk" style="margin-top:16px">Verstanden</button>`);
  document.getElementById("wnOk").onclick=()=>{S.seenVersion=APP_VERSION;persist();closeSheet();};
}

/* ===== Anleitung ===== */
function openHelp(){
  openSheet(`<h3>Anleitung</h3>
    <p class="note" style="margin:-8px 0 16px">So arbeitest du mit der App. Einmal lesen reicht.</p>

    <div class="hsec"><div class="eb">Der Ablauf in Kurzform</div>
      <p>Du legst einen <b>Auftrag</b> an, das ist ein Dreh oder eine Produktion. In diesen Auftrag trägst du deine <b>Arbeitstage</b> ein. Am Ende schickst du daraus einen Stundennachweis an die Disposition, als PDF oder als E-Mail.</p>
      <p>Alles andere rechnet die App: Überstunden, Pausen und den Hinweis auf mögliches Tagegeld.</p>
      <p>Die <b>Überstunden</b> misst die App an deinem Tages-Soll. Voreingestellt sind <b>7:42 Stunden ohne Pause</b>. So steht es seit dem 01.01.2026 im Tarifvertrag für die auf Produktionsdauer Beschäftigten: 38,5 Stunden in der Woche, also 7,7 Stunden am Tag. Die Pause kommt obendrauf. Steht in deinem Vertrag etwas anderes, stellst du es unter Einstellungen › Rechenregeln ein.</p>
      <p>Die <b>Einstellungen</b> öffnest du über das Zahnrad oben rechts in der Übersicht. Dort stehen dein Name und dein Vertrag, die Mail an die Disposition, Verdienst und Tagessätze und die Rechenregeln, für Freie auch Urlaub und Antrag.</p>
      <p>Für Freie gibt es den Reiter <b>Urlaub</b>. Dort planst du deine Urlaubstage und lässt dir den Antrag ausfüllen. Mehr dazu unter Punkt 12.</p></div>

    <div class="hsec"><div class="eb">1 · Auftrag anlegen</div>
      <p>Am schnellsten geht es mit der Dispo. Tippe oben unter den Reitern auf <b>PDF importieren</b> und wähle die Datei aus. Die App liest Titel, Auftragsnummer, Produktionsnummer, Ort und die Namen aller eingeteilten Personen heraus und legt dir die Drehtage gleich mit an.</p>
      <p>Die App sucht dich über deinen Namen aus Einstellungen › Du und dein Vertrag und wählt dich vor. Findet sie dich nicht, ist niemand ausgewählt, und du tippst an, wer du bist. Danach prüfst du die <b>Reiseart</b>. Einzeltage heißt, du fährst jeden Tag hin und zurück. Mehrtägig heißt, du übernachtest vor Ort. Nennt die Dispo einen An- oder Rückreisetag, ist Mehrtägig schon vorgewählt. Die Vorschau zeigt dir jeden Tag mit Jahr und bei Mehrtägig mit Tagestyp. Den Tagestyp einzelner Tage änderst du danach im Tag.</p>
      <p>Ohne Dispo geht es genauso über <b>Auftrag anlegen</b>. Dann trägst du die Tage von Hand ein.</p>
      <p class="tip">Die Dispo kommt per Mail? Tippe das PDF an, dann auf Teilen und auf In Dateien sichern. Danach findest du es im Import ganz oben unter Zuletzt benutzt.</p></div>

    <div class="hsec"><div class="eb">2 · Einen Tag erfassen</div>
      <p>Oben wählst du den <b>Tagestyp</b>. Eintägig heißt, du fährst am selben Tag hin und zurück. Bei einer Reise mit Übernachtung ist der erste Tag der Anreisetag, die Tage dazwischen sind Vor Ort, und der letzte ist der Rückreisetag. Ein Tipp setzt die Übernachtung und schaltet die passenden Fahrten ein oder aus.</p>
      <p>Ein Tag hat drei Zeitblöcke. Die <b>Einsatzzeit</b> reicht vom Einsatzbeginn bis zum Einsatzende. Nur sie zählt für deine Überstunden: Einsatzzeit minus Pause, verglichen mit dem Soll. <b>Drehzeit</b> und <b>Reisezeit</b> stehen im Nachweis, weil das Formular sie abfragt. Für die Überstunden zählen sie nicht extra, sie liegen innerhalb der Einsatzzeit.</p>
      <p>Der <b>Einsatzbeginn ist der Ausgangspunkt</b>. Sobald du ihn einträgst, schlägt die App alle übrigen Zeiten vor. Die Vorschläge sind nur Startwerte, du überschreibst sie einfach mit deinen echten Zeiten.</p>
      <p>Das <b>Einsatzende</b> rechnet sich dabei selbst aus. Es liegt immer 30 Minuten nach deiner letzten Tätigkeit, also nach der Rückreise, sonst nach dem Dreh. Sobald du es einmal selbst eintippst, bleibt dein Wert stehen, ebenso ein Ende aus der Dispo. Ändern ein Tagestyp, entfällt oder kein Dreh das Ende, steht das im Einsatz-Kasten, bis du selbst eine Zeit tippst.</p>
      <p>Für Sonderfälle gibt es kleine Schalter. <b>Kein Dreh</b> nimmst du für Tage ohne Dreh. <b>Entfällt</b> steht bei Anreise und Rückreise getrennt zur Verfügung. Schaltest du eine Fahrt wieder ein, bevor du speicherst, kommen deine vorherigen Zeiten zurück.</p>
      <p>Bist du im Ausland unterwegs, stellst du unten <b>Ausland</b> auf Ja. Dann hältst du fest, wann du Deutschland verlassen hast und wann du zurück warst. Mit dem ✕ leerst du ein Feld einzeln. Die Zeiten stehen unten im Notizfeld des Nachweises. Erkennt die App beim Import einen Ort im Ausland, steht Ausland schon auf Ja.</p>
      <p class="tip">Ist am iPhone gerade das Zeitrad offen, schließt der erste Tipp daneben nur das Rad. Tipp danach einfach noch einmal.</p></div>

    <div class="hsec"><div class="eb">3 · Pausen und was FLINK daraus macht</div>
      <p>Das Abrechnungssystem des Senders zieht die gesetzliche Ruhepause <b>immer automatisch</b> ab. Über 6:30 Stunden Anwesenheit sind das 30 Minuten, über 9:45 Stunden 45 Minuten. Daran kann niemand etwas ändern, auch die Disposition nicht.</p>
      <p>Machst du tatsächlich 30 Minuten Pause, gehen dir bei langen Tagen also 15 Minuten verloren. Machst du gar keine, sogar die vollen 30 oder 45.</p>
      <p>Deshalb verlängert die App auf dem Nachweis dein Einsatzende genau um diese Differenz. Der häufigste Fall: Du arbeitest von 09:00 bis 19:00 und machst 30 Minuten Pause. Das sind 10 Stunden, also zieht FLINK 45 Minuten ab. Auf dem Nachweis steht deshalb <b>09:00 bis 19:15</b>. FLINK rechnet 10:15 minus 45 Minuten und bucht deine echten 9:30.</p>
      <p>Ohne Pause gilt dasselbe mit dem vollen Abzug. Arbeitest du von 09:00 bis 17:30 ohne Pause, steht auf dem Nachweis <b>09:00 bis 18:00</b>. Das System zieht davon 30 Minuten ab und bucht deine echten 8:30.</p>
      <p>Eine Besonderheit gibt es kurz vor 9:45 Stunden. Arbeitest du zum Beispiel von 09:00 bis 18:30 ohne Pause, würde eine Verlängerung um 30 Minuten den Nachweis über 9:45 Stunden schieben, und dort zieht das System 45 Minuten ab. Die App rechnet das mit ein und verlängert in diesem Fall gleich um 45 Minuten, auf <b>19:15</b>.</p>
      <p>Beim Dispo-Import legt die App Tage bis 6:30 Stunden <b>ohne Pause</b> an, längere mit Pause. Bis 6:30 Stunden zieht FLINK nichts ab, eine Pause würde dort nur deine Nettozeit kürzen. Hast du doch Pause gemacht, stellst du den Schalter im Tag einfach um.</p>
      <p>In der App selbst siehst du weiterhin deine tatsächlichen Zeiten. Im Tag steht direkt nach der Pause unter <b>So steht es im Nachweis</b>, was am Ende auf dem Papier landet. Auf der Tageskarte im Auftrag zeigt ein Chip wie „Nachweis 19:15 · +15 FLINK“, an welchen Tagen der Nachweis später endet.</p>
      <p class="tip">Das gilt nur für freie Mitarbeiter. Fest Angestellte bekommen den Nachweis mit den unveränderten Zeiten.</p></div>

    <div class="hsec"><div class="eb">4 · Tagegeld</div>
      <p>Selbst beantragen musst du Tagegeld <b>nur bei Einzeltagen</b>: eintägig unterwegs, im Inland und länger als 8 Stunden abwesend. Dann beträgt es <b>14 Euro</b>. Das ist die Verpflegungspauschale aus dem Einkommensteuergesetz, auf die die Reisekosten-Regelung des ZDF verweist. Genau genommen zählen die 8 Stunden ab der Abfahrt von deiner Wohnung, die App nimmt dafür die Einsatzzeit. Liegt ein Tag knapp darunter, weist sie dich darauf hin.</p>
      <p>Bei einer mehrtägigen Reise mit Übernachtung kommt das Tagegeld <b>automatisch über die Dienstreise-Abrechnung</b>: 14 Euro für den An- und den Abreisetag, 28 Euro für jeden vollen Tag dazwischen. Beantragen musst du dort nichts. Im Ausland richtet sich der Satz nach dem jeweiligen Land und wird über den Reisedienst abgewickelt, deshalb nennt die App dort keinen Betrag.</p>
      <p>Stellt die Produktion Essen, kürzt das ZDF das Tagegeld: um 5,60 Euro für ein Frühstück und um je 11,20 Euro für Mittag- und Abendessen. Das gilt auch, wenn du das Essen ohne triftigen Grund nicht nimmst. Mit Mittagessen bleiben vom Einzeltag also 2,80 Euro.</p>
      <p>Der grüne Hinweis ist nur für dich gedacht. Er taucht weder im PDF noch in der Mail auf. Denk daran: Der Antrag muss innerhalb von sechs Monaten raus.</p></div>

    <div class="hsec"><div class="eb">5 · Nachweis verschicken</div>
      <p><b>Als PDF</b> erzeugt die fertige Datei und öffnet das Teilen-Menü. Von dort schickst du sie per Mail, legst sie in Dateien ab oder gibst sie per AirDrop weiter.</p>
      <p><b>Als E-Mail</b> öffnet deine Mail-App mit dem Nachweis als Text. Empfängeradresse, Anrede, Mail-Text und Grußformel stellst du einmal unter <b>Einstellungen › Mail an die Disposition</b> ein, danach steht alles automatisch drin. Den Weg dorthin findest du auch im Auftrag unter den Export-Knöpfen.</p>
      <p>Feiertage am Arbeitsort sind im Nachweis beim Datum markiert, im PDF mit einem Sternchen, in der Mail mit dem Zusatz „Feiertag“. Unten stehen sie mit ihrem Namen. Mehr dazu unter Punkt 11.</p>
      <p>Ist ein Auftrag erledigt, markierst du ihn mit <b>Abgerechnet</b>. Er wandert dann ausgegraut ans Ende der Liste und ist nicht mehr im Weg.</p></div>

    <div class="hsec"><div class="eb">6 · Sicherung, das Wichtigste</div>
      <p>Deine Daten liegen ausschließlich in dieser App, auf diesem Gerät. Safari und die App auf dem Home-Bildschirm haben dabei getrennte Speicher. Es gibt keinen Server und kein Konto. Das heißt auch: Wenn das iPhone die Websitedaten löscht, sind sie weg.</p>
      <p>Mach deshalb regelmäßig ein Backup. Du findest es unter <b>Einstellungen</b> und dann <b>Backup teilen</b>. Sichere die Datei in deiner Cloud oder schick sie dir selbst per Mail. Zurückholen kannst du sie jederzeit mit <b>Backup einlesen</b>.</p>
      <p class="tip">Beim Einlesen wird der aktuelle Stand komplett ersetzt. Prüfe also kurz, ob du die richtige Datei erwischt hast.</p></div>

    <div class="hsec"><div class="eb">7 · Auf dem iPhone installieren</div>
      <p>Öffne die Adresse in <b>Safari</b> und tippe auf <b>Teilen</b>. Bei neuerem iOS liegt Teilen hinter den drei Punkten. Scrolle in der Liste nach unten zu <b>Zum Home-Bildschirm</b>, bei neuerem iOS heißt es „Zu Home-Bildschirm hinzufügen“, und lass <b>Als Web-App öffnen</b> eingeschaltet. Ab da startest du die App über ihr Symbol und sie läuft im Vollbild.</p>
      <p>Nach dem ersten Laden funktioniert alles auch <b>ohne Internet</b>, sogar der PDF-Export.</p>
      <p class="tip">Bekommt die App ein neues Symbol, tauscht das iPhone es auf dem Home-Bildschirm nicht von selbst aus. Dafür musst du die App löschen und neu hinzufügen. Mach vorher unbedingt ein Backup, denn beim Löschen verschwinden auch ihre Daten. Danach öffnest du die neue App über ihr Symbol und liest das Backup dort ein.</p></div>

    <div class="hsec"><div class="eb">8 · An Kollegen weitergeben</div>
      <p>Unter <b>Einstellungen</b> und <b>App weiterempfehlen</b> teilst du den Link. Jeder Kollege bekommt seine eigene, leere App. Daten werden nie geteilt oder vermischt.</p>
      <p>Sag ihm dazu, dass er die App nach dem Öffnen zum Home-Bildschirm hinzufügen sollte. Beim ersten Start fragt die App nach seinem Namen. Der Name sorgt dafür, dass beim Dispo-Import automatisch die richtige Person vorausgewählt wird.</p></div>

    <div class="hsec"><div class="eb">9 · Verdienst (freiwillig)</div>
      <p>Wenn du magst, zeigt dir die App pro Monat, was dir nach Tarif zusteht und ungefähr auf dem Konto ankommen sollte. Du schaltest das unter <b>Einstellungen › Verdienst und Tagessätze</b> ein und trägst dort deine Tagessätze als Dreh-Assistent und als Kamera ein. Danach gibt es neben Aufträge und Statistik den Reiter <b>Verdienst</b>.</p>
      <p>Die App rechnet so wie das ZDF auf der Abrechnung. Jeder Einsatztag bringt den Tagessatz. Dazu kommt Mehrarbeit für alles über 7,7 Stunden am Tag, aufgerundet auf halbe Stunden, mit dem Tagessatz geteilt durch 7,7 und 25 Prozent Zuschlag. Die 7,7 Stunden stehen so im Tarif und gelten auch dann, wenn du unter Rechenregeln ein anderes Soll eingetragen hast. Für Arbeit in der Nacht zwischen 22 und 6 Uhr kommen 25 Prozent dazu, am Sonntag 50 Prozent. An Feiertagen am Arbeitsort sind es 100 Prozent. Treffen zwei Zuschläge zusammen, zählt nur der höhere. Pause und Reisezeit zählen dabei nicht mit. Laut Tarif zahlt das ZDF Mehrarbeit und diese Zuschläge nur bei einem Tagessatz bis 336,06 Euro. Liegt dein Tagessatz über 336,06 Euro, gibt es nur den Tagessatz.</p>
      <p>Die Kachel <b>Plus zum Tagessatz</b> zeigt, was im Monat zu deinen Tagessätzen dazukommt: die Mehrarbeit und alle Zuschläge.</p>
      <p>Steht bei einer Fahrt nur der Beginn oder nur das Ende, wie nach einem Dispo-Import, rechnet die App diese Fahrt mit 30 Minuten. Trag die echten Fahrzeiten ein, dann wird es genauer. Nacht- und Sonntagszuschlag sind an echten Abrechnungen geprüft. Abweichen kann es an langen Reisetagen. Das ZDF zählt eine Fahrt manchmal als Arbeitszeit und manchmal als Reisezeit. Reisezeit zählt mit der Arbeit höchstens 12 Stunden am Tag und bekommt keine Zuschläge. Die App rechnet jede Fahrt bei der Mehrarbeit wie Arbeitszeit, bei den Zuschlägen aber wie Reisezeit. An solchen Tagen kann sie deshalb nach oben oder nach unten abweichen.</p>
      <p>Trägst du deinen Netto-Anteil ein, zeigt die App auch, was ungefähr aufs Konto kommt. Den Anteil findest du auf einer Abrechnung, wenn du die Auszahlung durch die Summe des Vertrags teilst.</p>
      <p class="tip">Das ZDF zahlt nachträglich, meist ein bis zwei Monate später und oft in mehreren Teilbeträgen. Urlaubsentgelt ist nicht enthalten. Nichts davon erscheint im Nachweis.</p></div>

    <div class="hsec"><div class="eb">10 · Vertragstage</div>
      <p>In deinem Vertrag steht, an wie vielen Tagen im Jahr du eingesetzt werden kannst. Trag diese Zahl unter <b>Einstellungen › Du und dein Vertrag</b> bei <b>Arbeitstage laut Vertrag</b> ein. Dann zeigt dir die App in der Statistik und oben in den Aufträgen, wie viele Tage du im laufenden Jahr schon geleistet hast, wie viele bereits disponiert sind und wie viele noch frei bleiben.</p>
      <p>Gezählt wird jeder Tag aus deinen Aufträgen, auch aus abgerechneten, egal ob der Auftrag frei oder fest ist. Geleistet sind die Tage bis heute, disponiert die Tage danach. Stehen zwei Aufträge am selben Tag, zählt der Tag einmal. Urlaubstage zählt die App nicht mit. Die Kachel „Tage“ oben in den Aufträgen zählt dagegen alle Tage der offenen Aufträge über alle Jahre, deshalb weichen die beiden Zahlen oft voneinander ab.</p>
      <p>Bist du fest angestellt, brauchst du keine Vertragstage einzutragen. Die App zeigt dir dann unter <b>Einsatztage</b>, wie viele Tage du im laufenden Jahr geleistet hast und wie viele disponiert sind.</p>
      <p class="tip">Am 1. Januar beginnt die Zählung von vorn. Liegst du über der Zahl aus dem Vertrag, steht das rot in der Statistik.</p></div>

    <div class="hsec"><div class="eb">11 · Feiertage</div>
      <p>Die App kennt die gesetzlichen Feiertage in Deutschland je Bundesland, in der Schweiz je Kanton und in 13 weiteren Ländern. Oster- und Pfingstsonntag zählen immer, weil der Tarif sie ausdrücklich nennt.</p>
      <p>Als freier Mitarbeiter zählt der Feiertag dort, wo du arbeitest. Beim Dispo-Import erkennt die App das Land aus dem Produktionsort, im Auftrag änderst du es unter <b>Feiertage nach</b>. Erkennt sie nichts, gilt dein üblicher Arbeitsort aus <b>Einstellungen › Du und dein Vertrag</b>. Als fest Angestellter gilt immer der Dienstort, den du dort einträgst.</p>
      <p>Im Tag steht, ob er ein Feiertag ist. Stimmt das nicht, leerst du das Feld. Für ein Land, das die App nicht kennt, trägst du den Namen selbst ein. Regionale Feiertage in Spanien, etwa Gründonnerstag in den meisten Regionen, und Ortsfeiertage in Italien kennt die App nicht, die trägst du ebenfalls selbst ein.</p>
      <p class="tip">Im PDF bekommt ein Feiertag ein Sternchen beim Datum, in der Mail den Zusatz „Feiertag“. Unten stehen alle Feiertage mit Namen. So sieht die Disposition, wo der Zuschlag fällig ist.</p></div>

    <div class="hsec"><div class="eb">12 · Urlaub</div>
      <p>Für Freie gibt es den Reiter <b>Urlaub</b>. Oben steht, wie viele Urlaubstage du im Jahr noch frei hast. Die Pfeile über dem Kalender blättern durch dieses und das nächste Jahr, die Zahl oben gilt für das gezeigte Jahr.</p>
      <p>Darunter steht ein Kalender. Tipp die Tage an, an denen du Urlaub willst, und dann auf <b>Als Urlaub eintragen</b>. Wochenenden und Feiertage sind grau, du kannst sie nicht antippen. Ein Feiertag kostet dich nämlich keinen Urlaubstag. Es zählen nur deutsche Feiertage: die an deinem Ort aus <b>Einstellungen › Du und dein Vertrag</b>, liegt er im Ausland, die bundesweiten. Tage mit einem Einsatz haben einen Rahmen. Lieber mit Datum? Dann tippst du unter dem Kalender auf <b>Oder mit Datum eintragen</b> und gibst den ersten und den letzten Tag ein.</p>
      <p>Urlaub musst du beim ZDF beantragen, und zwar spätestens <b>6 Wochen vor dem ersten Urlaubstag</b>. Unter dem Kalender steht ein Block für alles, was noch nicht beantragt ist, mit der Frist, und darunter ein Block je Antrag. Den <b>ersten Antrag im Jahr</b> schickst du selbst mit dem Formular für den Jahresurlaub ab, weil dafür Nachweise dazugehören. Er ist Antrag 1. Danach tippst du in der App auf <b>Ja, abgeschickt</b>. Stand ein Urlaub später auch darin, tippst du auf seinen Zeitraum und dort auf <b>Schon abgeschickt?</b>.</p>
      <p>Für alle weiteren Urlaube tippst du auf <b>Antrag ausfüllen lassen</b>. Die App füllt das echte Formular des ZDF mit allen geplanten Urlauben des Jahres aus, die noch in keinem Antrag stehen. Die Anträge bekommen ab 2 eine Nummer, die Datei heißt zum Beispiel „Urlaubsantrag 2026 Nr 2“. Mit <b>Antrag teilen</b> sicherst du die Datei oder schickst sie weiter. Dann unterschreibst du den Antrag und lässt ihn vom Fachbereich gegenzeichnen, denn der Fachbereich muss von deinem Urlaub wissen. Danach geht er an Freie-Mitarbeiter-3.Kreis-Urlaub@zdf.de. Ist er abgeschickt, tippst du im Block auf <b>Abgeschickt?</b>. Das gilt für den ganzen Antrag.</p>
      <p>Lehnt das ZDF einen Tag ab, tippst du im Block auf den Zeitraum und unter <b>Einen Tag herausnehmen</b> auf den Tag. Der Antrag bleibt, denn ein Tag weniger braucht keinen neuen. Einen anderen Tag tippst du danach im Kalender an, dafür füllt die App einen neuen Antrag aus. Machst du einen Urlaub nur kürzer, bleibt der Antrag auch. Kommen neue Tage dazu, fragt die App nach und setzt den Urlaub auf „Noch nicht beantragt“ zurück.</p>
      <p>Urlaub gilt nur im Kalenderjahr. Was du bis zum Jahresende nicht beantragst, <b>verfällt am 31. Dezember</b>. Ab Oktober erinnert dich die App daran, solange du noch Tage frei hast.</p>
      <p>Unter <b>Einstellungen › Urlaub und Antrag</b> stellst du ein, wie viele Urlaubstage du im Jahr hast. Laut Merkblatt sind es 31. Trägst du einen Betrag je Urlaubstag ein, zeigt die App, was du für deinen Urlaub ungefähr bekommst. Den Fachbereich kannst du dort auch eintragen, dann steht er gleich im Antrag. Sonst füllst du ihn im Formular selbst aus.</p>
      <p class="tip">Mit <b>In meinen Kalender übernehmen</b> zeigt dein iPhone deine Urlaubstage, mit <b>Alle hinzufügen</b> kommt jeder als eigener Termin in deinen Kalender, zum Beispiel „ZDF Urlaub 12 von 31“. Hat sich seitdem etwas geändert, lösch erst die alten „ZDF Urlaub“-Termine im Kalender und übernimm dann neu. Vorhandene Termine ändert dein iPhone dabei nicht, sonst stimmen die Nummern nicht mehr.</p></div>

    <button class="btn" id="helpBack" style="margin-top:6px">Verstanden</button>`);

function flipName(n){const p=String(n||"").split(",");return p.length===2?clean(p[1])+" "+clean(p[0]):clean(n);}
function initials(n){const p=clean(flipName(n)).split(/\s+/).filter(Boolean);if(!p.length)return "";const a=p[0][0].toUpperCase();const b=p.length>1?p[p.length-1][0].toUpperCase():"";return a+"."+(b?b+".":"");}

function mailOrder(o){

     braucht sie nicht. */

    .replace(/\{name\}/g,S.empfaenger||"[Name]")

    L.push(fmtDateLong(d.datum)+(feiertagTag(o,d)?" · Feiertag":""));

    L.push("Dreh: "+dreh);
    L.push("Anreise: "+((d.anreise||d.anreiseEnde)?((d.anreise||"—")+"–"+(d.anreiseEnde||"—")):"—"));
    L.push("Rückreise: "+((d.rueckBeginn||d.rueck)?((d.rueckBeginn||"—")+"–"+(d.rueck||"—")):"—"));
    L.push("Pause: "+pauseDez(c.pause));
    L.push("");});

  const eq=equipText(o);if(eq){L.push("Sonder-Equipment: "+eq);L.push("");}

/* Dispo lesen (ab V4.4.2 eigene Funktion): Das Prüfwerkzeug tests/import-pruefung.mjs geht genau diesen Weg. */
async function dispoLesen(pdf){
  let text="",hints=null;
  for(let p=1;p<=pdf.numPages;p++){const pg=await pdf.getPage(p);const tc=await pg.getTextContent();
    text+=seitenText(tc.items)+" ";
    if(p===1)hints=labelHints(tc.items);}
  const meta=parseZDF(text);
  if(hints){if(hints.titel)meta.titel=hints.titel;if(hints.ort)meta.produktionsort=hints.ort;}
  return meta;
}
/* Text einer Seite positionsbasiert: Items nach y gruppieren, je Zeile nach x sortieren. */
function seitenText(items){
  const lines=[];items.forEach(it=>{if(typeof it.str!=="string"||it.str===""||!it.transform)return;const x=it.transform[4],y=it.transform[5];let ln=lines.find(l=>Math.abs(l.y-y)<=4);if(!ln){ln={y,parts:[]};lines.push(ln);}ln.parts.push({x,w:it.width||0,s:it.str});});
  lines.sort((a,b)=>b.y-a.y);
  /* Teile nur bei echter Lücke (>1pt) mit Leerzeichen verbinden – PDFs zerlegen
     Wörter/Nummern oft in berührende Stücke ("A"+"2748455", "455"+"11333") */
  const pageText=lines.map(l=>{const ps=l.parts.sort((a,b)=>a.x-b.x);let s="",end=null;ps.forEach(p=>{if(end!==null&&p.x-end>1)s+=" ";s+=p.s;end=p.x+p.w;});return s;}).join(" ");
  return pageText||items.map(i=>i.str).join(" ");
}
function clean(s){return String(s||"").replace(/\s+/g," ").trim();}
function cleanName(n){return clean(n).replace(/\s*(?:\.{2,3}|…)\s*$/,"").replace(/\s+,/,",").replace(/,\s*$/,"").trim();}
/* Spaltenwerte direkt unter den Formular-Labels lesen (Seite 1).
   Titel/Produktionsort stehen im ZDF-Formular exakt unter ihrer Beschriftung –

function labelHints(items){
  const its=[];items.forEach(it=>{if(typeof it.str!=="string"||!it.str.trim()||!it.transform)return;its.push({s:it.str,x:it.transform[4],y:it.transform[5],w:it.width||0});});
  const find=re=>its.find(i=>re.test(i.s.trim()));
  const grab=(lab,xEnd)=>{
    if(!lab)return "";
    const cand=its.filter(i=>i.y<lab.y-3&&i.y>lab.y-30&&i.x>=lab.x-2&&i.x<xEnd-2&&!/^(Personalleistung|Personal-Disposition|Auftragsbemerkung)/.test(i.s.trim()));
    cand.sort((a,b)=>b.y-a.y||a.x-b.x);
    let s="",end=null,lastY=null;
    cand.forEach(c=>{if(lastY!==null&&Math.abs(c.y-lastY)>3){s+=" ";end=null;}if(end!==null&&c.x-end>1)s+=" ";s+=c.s;end=c.x+c.w;lastY=c.y;});
    return clean(s);

  function paintTage(){
    const sel=persons[impSel],mehr=impTrip==="mehr";
    const tage=sel?importTage(sel.days,mehr,false,p.ablauf):[];
    document.getElementById("i_days").innerHTML=tage.length?tage.map(d=>{
      const c=dayCalc({einsatz:d.einsatz,ende:d.ende,pause:d.pause}),tc=mehr?typChip(d):"";
      return `<div class="irow"><div class="d">${fmtDateLong(d.datum)}${tc?`<span class="chip">${tc}</span>`:""}<small>Einsatz ${d.einsatz||"?"}–${d.ende||"?"}</small></div><div class="o ${otClass(c.ot)}">${fmtSigned(c.ot)}</div></div>`;
    }).join(""):(persons.length&&!sel?'<p class="note">Wähl zuerst aus, wer du bist.</p>':'<p class="note">Keine Tage erkannt.</p>');
    document.querySelectorAll("#i_trip button").forEach(b=>b.classList.toggle("on",b.dataset.t===impTrip));
    document.getElementById("i_tripnote").classList.toggle("hidden",tripTouched||reiseVorwahl(p.ablauf)!=="mehr");
  }
  let impFk=null,fkTouched=false;
  const paintFk=()=>{const sel=persons[impSel];if(!fkTouched)impFk=(sel&&sel.funktion)||S.funktion||"assistent";
    document.querySelectorAll("#i_fk button").forEach(b=>b.classList.toggle("on",b.dataset.f===impFk));
    const fn=document.getElementById("i_fknote");
    if(fn)fn.textContent=!sel?"Folgt der Person, die du oben antippst.":sel.funktion?"Aus der Dispo erkannt, bitte prüfen.":"In der Dispo nicht gefunden, Vorgabe aus Einstellungen › Verdienst und Tagessätze.";};
  let impStatus=S.status||"frei";
  const paintImpStatus=()=>document.querySelectorAll("#i_status button").forEach(b=>b.classList.toggle("on",b.dataset.s===impStatus));
  document.querySelectorAll("#i_status button").forEach(b=>b.onclick=()=>{impStatus=b.dataset.s;paintImpStatus();});
  paintImpStatus();
  if(persons.length){document.querySelectorAll("#i_persons button").forEach(b=>b.onclick=()=>{if(impSel>=0)fkTouched=false;impSel=+b.dataset.i;paint();paintFk();});}
  document.querySelectorAll("#i_fk button").forEach(b=>b.onclick=()=>{impFk=b.dataset.f;fkTouched=true;paintFk();});
  paintFk();
  /* Hinweis zum Ort (V4.4): woher die Auswahl kommt und ob die Tage mit Ausland Ja starten. */
  const paintFtNote=()=>{const v=val("i_ftort");
    document.getElementById("i_ftnote").textContent=(!v?(ftErkannt?"Es gilt die Einstellung.":"Im Produktionsort nicht erkannt, es gilt die Einstellung."):(v===ftErkannt?"Aus dem Produktionsort erkannt, bitte prüfen.":"Von dir gewählt."))+(auslandVorgabe(v)?" Die Tage starten mit Ausland Ja.":"");};
  document.getElementById("i_ftort").onchange=paintFtNote;
  paintFtNote();
  /* Reiseart zeichnet nur die Vorschau neu, der Name im Feld bleibt, wie getippt (V4.4.2). */
  document.querySelectorAll("#i_trip button").forEach(b=>b.onclick=()=>{impTrip=b.dataset.t;tripTouched=true;paintTage();});
  paint();
  document.getElementById("cancelImport").onclick=closeSheet;
  document.getElementById("doImport").onclick=()=>{
    const sel=persons[impSel];if(persons.length&&!sel)return;
    const days=importTage(sel?sel.days:[],impTrip==="mehr",auslandVorgabe(val("i_ftort")),p.ablauf);
    /* Funktion nur speichern, wenn erkannt oder bewusst gewählt: mit Verdienst-Option zählt das Segment, sonst nur die
       Erkennung aus der Dispo. Ohne beides bleibt das Feld weg und der Auftrag folgt der Vorgabe S.funktion. */
    const fk=S.verdienstOn&&sel?impFk:(sel&&sel.funktion);
    const no={id:uid(),titel:val("i_titel"),auftragsnr:val("i_anr"),prodNummer:val("i_pnr"),kostentraeger:val("i_kt"),produktionsort:val("i_ort"),mitarbeiter:val("i_name"),status:impStatus,...(fk?{funktion:fk}:{}),...(val("i_ftort")?{feiertagOrt:val("i_ftort")}:{}),days};
    DB.orders.push(no);persist();state.orderId=no.id;state.tab="orders";closeSheet();render();toast(days.length?(days.length===1?"1 Tag":days.length+" Tage")+" importiert, bitte prüfen.":"Auftrag angelegt");
  };
}

/* ===== Utils ===== */
function val(id){return (document.getElementById(id)||{}).value||"";}
function esc(s){return String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
let toastT;function toast(m){const el=document.getElementById("toast");el.textContent=m;el.classList.add("on");clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove("on"),Math.max(2600,String(m).length*60));}
/* kind="go" = nicht-destruktiv (Amber), sonst destruktiv (Rot) */
function askConfirm(msg,onYes,yesLabel,kind){const el=document.getElementById("confirmBox");el.querySelector(".ctitle").textContent=(yesLabel||"Löschen")+"?";el.querySelector(".cmsg").textContent=msg;el.classList.remove("out");el.classList.add("on");const yes=document.getElementById("cYes"),no=document.getElementById("cNo");yes.textContent=yesLabel||"Löschen";yes.classList.toggle("go",kind==="go");const close=()=>{el.classList.add("out");setTimeout(()=>{el.classList.remove("on","out");},150);yes.onclick=null;no.onclick=null;};yes.onclick=()=>{close();onYes();};no.onclick=close;}
if("serviceWorker" in navigator&&(location.protocol==="https:"||location.hostname==="localhost"))navigator.serviceWorker.register("sw.js").catch(()=>{});
applyTheme();
render();
/* Was-ist-neu einmalig nach einem Update. Nicht bei frischen Installationen –
   wer die App zum ersten Mal öffnet, soll kein Changelog sehen, sondern die App.
   Fehlt der Name, fragt die App zuerst danach (V4.2), Was ist neu folgt danach. */
const wnFaellig=DB.orders.length>0&&S.seenVersion!==APP_VERSION;
if(!wnFaellig&&!S.seenVersion){S.seenVersion=APP_VERSION;persist();}
/* Hat der Nutzer in den ersten 400 ms schon selbst ein Sheet geöffnet, wartet die Frage bis zum nächsten Start. */
if(!clean(S.absender))setTimeout(()=>{if(!scrim.classList.contains("on"))openNameFrage(()=>{if(wnFaellig)openWhatsNew();else closeSheet();});},400);
else if(wnFaellig)setTimeout(openWhatsNew,400);
</script>
